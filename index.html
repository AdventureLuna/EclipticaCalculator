      ["shadowDamage", "Gunmancer_Proficiency_Antimatter", 5, { notes: "Antimatter Accelerator variant." }],

      ["attackSpeed", "Swift_Hands", 15], ["attackSpeed", "Heavy_Hand", -40],
      ["attackSpeed", "Rapid_Fire", 50], ["attackSpeed", "An_IQ_Too_High_", -10],
      ["projectileSpeed", "Eagle_Eye", 35], ["projectileSpeed", "An_IQ_Too_High_", -15],
      ["projectileSpread", "Thaumaturge_Splitshot", 2.5], ["projectileSpread", "Hawkeye", -1],
      ["movementSpeed", "Big_and_Round", -10], ["movementSpeed", "Iron_Skin", -3],
      ["movementSpeed", "Mass_Aspect", -30], ["movementSpeed", "Athletic", 8],
      ["movementSpeed", "Leg_Day", 5],
      ["movementSpeed", "Thunder_Aura", -5, { once: true, notes: "This penalty only applies once." }],
      ["movementSpeed", "Featherweight", 30],
      ["jumpHeight", "Big_and_Round", -10], ["jumpHeight", "Springfoot", 20],
      ["jumpHeight", "Leg_Day", 10], ["extraJumps", "Partial_Flight", 1],
      ["knockbackResistance", "Big_and_Round", 50],
      ["criticalChance", "Full_Focus", 5], ["criticalChance", "Charged_Strike", -5],
      ["criticalDamage", "Full_Focus", 5], ["criticalDamage", "Pocket_Abacus", 10],
      ["utilityCooldownRate", "Adrenaline_Fiend", 7], ["utilityCooldownRate", "Quick_Breath", 10],
      ["utilityCooldownRate", "Big_and_Speedy", 50], ["utilityCooldownRate", "Warrior's_Will", -15],
      ["utilityCooldownRate", "Spellsword_Burst", -20]
    ].map(([stat, id, value, options = {}]) => ({ stat, id, value, ...options }));

    function capValue(stat, raw) {
      const cap = CAPS[stat];
      if (!cap || raw <= cap[0]) return raw;
      const [soft, hard] = cap;
      const overflow = raw - soft;
      return soft + (hard - soft) * overflow / ((hard - soft) + overflow);
    }

    function hardCapValue(stat, raw) {
      const hardCap = HARD_CAPS[stat];
      return hardCap && raw > hardCap ? hardCap : raw;
    }

    function calculateStats() {
      const activeBase = {
        ...BASE,
        health: CLASS_BASE_HEALTH[selectedClass],
        healingReceived: selectedClass === "Thaumaturge" ? 50 : 100
      };
      const bonus = Object.fromEntries(Object.keys(activeBase).map(stat => [stat, 0]));
      const breakdowns = Object.fromEntries(Object.entries(activeBase).map(([stat, base]) => [stat, [{
        value: formatContribution(stat, base),
        type: "Base",
        source: selectedClass,
        notes: "Default class value."
      }]]));

      for (const effect of STAT_EFFECTS) {
        const selected = count(effect.id);
        if (!selected) continue;
        const appliedStacks = effect.once ? 1 : selected;
        const total = typeof effect.value === "function"
          ? effect.value(selected)
          : effect.value * appliedStacks;
        bonus[effect.stat] += total;

        const stackNote = typeof effect.value === "number" && selected > 1
          ? `${selected} stacks Ç- ${formatContribution(effect.stat, effect.value)}.`
          : effect.once && selected > 1
            ? `${selected} selected; the modifier is only applied once.`
            : "";
        breakdowns[effect.stat].push({
          value: formatContribution(effect.stat, total, true),
          type: "Additive",
          source: upgradeIndex.get(effect.id)?.name || effect.id,
          notes: [effect.notes, stackNote].filter(Boolean).join(" ")
        });
      }

      const nekomancerMasteryStacks = selectedClass === "Nekomancer" ? count("Nekomancer_Mastery") : 0;
      const nekomancerSouls = Math.min(5, Math.max(0, Math.floor(Number(buildOptions.nekomancerSouls) || 0)));
      if (nekomancerMasteryStacks > 0 && nekomancerSouls > 0) {
        const masteryEffects = {
          overallDamage: 2 * nekomancerMasteryStacks * nekomancerSouls,
          healthRegeneration: 20 * nekomancerMasteryStacks * nekomancerSouls
        };
        for (const [stat, value] of Object.entries(masteryEffects)) {
          bonus[stat] += value;
          breakdowns[stat].push({
            value: formatContribution(stat, value, true),
            type: "Additive",
            source: upgradeIndex.get("Nekomancer_Mastery")?.name || "Nekomancer: Mastery",
            notes: `${nekomancerMasteryStacks} upgrade stack${nekomancerMasteryStacks === 1 ? "" : "s"}; ${nekomancerSouls} soul${nekomancerSouls === 1 ? "" : "s"} held.`
          });
        }
      }

      const berserkerVariant = berserkerVariantForClass();
      const berserkerCopies = berserkerUpgradeCount();
      const berserkerStacks = clampBerserkerStacks(berserkerCopies);
      if (berserkerVariant && berserkerCopies > 0) {
        const berserkerEffects = {
          overallDamage: berserkerVariant.damagePenalty * berserkerCopies + berserkerVariant.damageAt70 * berserkerStacks / 70,
          attackSpeed: berserkerVariant.attackSpeedPenalty * berserkerCopies + berserkerVariant.attackSpeedAt70 * berserkerStacks / 70,
          healthRegeneration: berserkerVariant.regenerationAt70 * berserkerStacks / 70,
          projectileSpread: berserkerVariant.spreadAt70 * berserkerStacks / 70
        };
        for (const [stat, value] of Object.entries(berserkerEffects)) {
          if (!value) continue;
          bonus[stat] += value;
          breakdowns[stat].push({
            value: formatContribution(stat, value, true),
            type: "Additive",
            source: upgradeIndex.get(berserkerVariant.id)?.name || berserkerVariant.id,
            notes: `${berserkerCopies} upgrade stack${berserkerCopies === 1 ? "" : "s"}; ${berserkerStacks}/${berserkerMaximumStacks(berserkerCopies)} Berserker's Soul stacks.`
          });
        }
      }

      const addBuildStats = (stats, source, type = "Additive") => {
        for (const [stat, value] of Object.entries(stats || {})) {
          if (!(stat in bonus) || !value) continue;
          bonus[stat] += value;
          breakdowns[stat].push({
            value: formatContribution(stat, value, true), type, source,
            notes: "Selected outside the upgrade catalog."
          });
        }
      };
      for (const [artifactId, artifactCount] of Object.entries(buildOptions.artifacts)) {
        const artifact = ARTIFACTS.find(item => item.id === artifactId);
        if (!artifact) continue;
        const totalMultiplier = artifactCount;
        addBuildStats(Object.fromEntries(Object.entries(artifact.stats).map(([stat, value]) => [stat, value * totalMultiplier])),
          artifact.name, `Artifact Ç-${artifactCount}`);
      }
      buildOptions.runes.forEach((runeId, index) => {
        const rune = RUNES.find(item => item.id === runeId);
        if (rune?.stats) addBuildStats(rune.stats(index + 1), `${RUNE_SLOTS[index]} ¶ْ ${rune.name}`, "Rune");
        const curse = rune && CURSES.find(item => item.id === buildOptions.curses[index]);
        if (curse?.stats) addBuildStats(curse.stats(index + 1), `${RUNE_SLOTS[index]} ¶ْ Runic Curse: ${curse.name}`, "Curse");
      });

      const caps = {};
      const defenseCalculations = {};
      const result = Object.fromEntries(Object.entries(activeBase).map(([stat, base]) => {
        if (DEFENSE_STATS.has(stat)) {
          const calculation = DefenseCalculation.calculateDefense(bonus[stat]);
          defenseCalculations[stat] = calculation;
          return [stat, calculation.defense];
        }
        const raw = base + bonus[stat];
        const cappedRaw = capValue(stat, raw);
        const cappedBase = capValue(stat, base);
        const lowerSoftCap = LOWER_CAPS[stat];
        const hardCappedRaw = hardCapValue(stat, raw);
        let effective = bonus[stat] > 0 ? base + cappedRaw - cappedBase : raw;
        if (bonus[stat] > 0 && Math.abs(cappedRaw - raw) > .0001) {
          const [soft, hard] = CAPS[stat];
          caps[stat] = {
            kind: "upper", base, bonus: bonus[stat], raw, soft, hard,
            overflow: raw - soft, range: hard - soft,
            cappedRaw, cappedBase, effective
          };
        } else if (Math.abs(hardCappedRaw - raw) > .0001) {
          effective = hardCappedRaw;
          caps[stat] = {
            kind: "hard", base, bonus: bonus[stat], raw,
            hard: HARD_CAPS[stat], effective
          };
        } else if (lowerSoftCap && bonus[stat] < -lowerSoftCap) {
          effective = lowerSoftCap ** 2 / Math.abs(bonus[stat]);
          caps[stat] = {
            kind: "lower",
            base,
            bonus: bonus[stat],
            raw,
            soft: lowerSoftCap,
            divisor: Math.abs(bonus[stat]),
            numerator: lowerSoftCap ** 2,
            effective
          };
        }
        return [stat, effective];
      }));

      const wardenStacks = count("Shieldmage_Warden");
      if (wardenStacks) {
        const divisor = 1 + wardenStacks;
        breakdowns.utilityCooldownRate.push({
          value: `اْ${formatNumber(divisor)}`,
          type: "Multiplicative",
          source: upgradeIndex.get("Shieldmage_Warden")?.name || "Shieldmage: Warden",
          notes: `+100% cooldown per stack is converted to recovery rate; ${formatNumber(result.utilityCooldownRate)}% اْ ${formatNumber(divisor)}.`
        });
        result.utilityCooldownRate /= divisor;
      }
      if (result.health < 1) result.health = 1;
      if (result.projectileSpread < 0) result.projectileSpread = 0;
      const bigAndLazyStacks = count("Big_and_Lazy");
      const bigAndLazyMultiplier = bigAndLazyStacks > 0 ? 3 + .5 * (bigAndLazyStacks - 1) : 1;
      const healthRegenerationCalculation = {
        basePerSecond: BASE_HEALTH_REGENERATION_PER_SECOND,
        percentage: result.healthRegeneration,
        percentageMultiplier: result.healthRegeneration / 100,
        bigAndLazyStacks,
        bigAndLazyMultiplier,
        perSecond: BASE_HEALTH_REGENERATION_PER_SECOND * result.healthRegeneration / 100 * bigAndLazyMultiplier
      };
      return { stats: result, base: activeBase, breakdowns, caps, defenseCalculations, healthRegenerationCalculation };
    }

    function formatNumber(value) {
      const rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function formatContribution(stat, value, showSign = false) {
      const prefix = showSign && value > 0 ? "+" : "";
      const suffix = stat === "health" || stat === "extraJumps" ? "" : "%";
      return `${prefix}${formatNumber(value)}${suffix}`;
    }

    function formatStat(stat, value) {
      if (stat === "health" || stat === "extraJumps") return formatNumber(value);
      if (stat === "attackSpeed") return `${Number(Number(value).toFixed(2))}%`;
      if (stat === "movementSpeed") return `${formatNumber(value)}% ¶ْ ${formatNumber(7 * value / 100)} m/s`;
      return `${formatNumber(value)}%`;
    }

    function formatHealthPerSecond(value) {
      return Number(Number(value).toFixed(2)).toString();
    }

    let latestCalculation;

    function renderStats() {
      hideStatTooltip();
      latestCalculation = calculateStats();
      const stats = latestCalculation.stats;
      $("#stats").innerHTML = STAT_ROWS.map(([stat, label, color]) => {
        if (!stat) return '<div class="stat-gap"></div>';
        const delta = stats[stat] - latestCalculation.base[stat];
        const changed = Math.abs(delta) > .001;
        const deltaHtml = changed
          ? `<span class="delta ${delta > 0 ? "up" : "down"}">${delta > 0 ? "+" : ""}${formatNumber(delta)}</span>`
            : "";
        const derivedHtml = stat === "healthRegeneration"
          ? `<span class="health-regeneration-rate" data-health-regeneration-rate="${escapeHtml(String(latestCalculation.healthRegenerationCalculation.perSecond))}">(${formatHealthPerSecond(latestCalculation.healthRegenerationCalculation.perSecond)} hp/s)</span>`
          : "";
        return `<div class="stat-row ${color ? `element ${color}` : ""} ${changed ? "changed" : ""}"
          data-stat="${stat}" data-label="${escapeHtml(label)}" tabindex="0">
          <span>${label}:</span><span class="value">${formatStat(stat, stats[stat])}${deltaHtml}${derivedHtml}</span>
        </div>`;
      }).join("");
    }

    function softCapMarkup(stat) {
      const cap = latestCalculation?.caps?.[stat];
      if (!cap) return "";
      const unit = stat === "health" || stat === "extraJumps" ? "" : "%";
      const n = value => `${formatNumber(value)}${unit}`;
      if (cap.kind === "lower") {
        return `<div class="cap-calculation">
          <strong>Lower soft-cap calculation</strong><br>
          Raw additive sum: <span class="cap-formula">${n(cap.base)} ${cap.bonus < 0 ? "ƒ^'" : "+"} ${n(Math.abs(cap.bonus))} = ${n(cap.raw)}</span><br>
          Negative modifier exceeds the ${n(cap.soft)} lower soft cap.<br>
          <span class="cap-formula">${formatNumber(cap.soft)}¶‎ اْ |${n(cap.bonus)}| = ${formatNumber(cap.numerator)} اْ ${n(cap.divisor)} = ${n(cap.effective)}</span>
        </div>`;
      }
      if (cap.kind === "hard") {
        return `<div class="cap-calculation">
          <strong>Hard-cap calculation</strong><br>
          Raw additive sum: <span class="cap-formula">${n(cap.base)} + ${n(cap.bonus)} = ${n(cap.raw)}</span><br>
          Hard cap ${n(cap.hard)}<br>
          Effective result: <span class="cap-formula">min(${n(cap.raw)}, ${n(cap.hard)}) = ${n(cap.effective)}</span>
        </div>`;
      }
      return `<div class="cap-calculation">
        <strong>Upper soft-cap calculation</strong><br>
        <em>Warning: the game's exact approaching-hard-cap formula is not yet known; this is an estimate.</em><br>
        Raw additive sum: <span class="cap-formula">${n(cap.base)} + ${n(cap.bonus)} = ${n(cap.raw)}</span><br>
        Soft cap ${n(cap.soft)} ¶ْ hard-cap limit ${n(cap.hard)}<br>
        <span class="cap-formula">${n(cap.soft)} + (${n(cap.range)} ا- ${n(cap.overflow)} اْ (${n(cap.range)} + ${n(cap.overflow)})) = ${n(cap.cappedRaw)}</span><br>
        Effective result: <span class="cap-formula">${n(cap.base)} + ${n(cap.cappedRaw)} ƒ^' ${n(cap.cappedBase)} = ${n(cap.effective)}</span>
      </div>`;
    }

    function defenseCalculationMarkup(stat) {
      const calculation = latestCalculation?.defenseCalculations?.[stat];
      if (!calculation) return "";
      const n = value => `${formatNumber(value)}%`;
      const modifier = calculation.defenseModifier;
      const modifierFormula = modifier === 0
        ? n(calculation.rawDamageTaken)
        : `${n(DefenseCalculation.BASE_DAMAGE_TAKEN)} ${modifier > 0 ? "ƒ^'" : "+"} ${n(Math.abs(modifier))} = ${n(calculation.rawDamageTaken)}`;
      const capMarkup = calculation.isSoftCapped
        ? `<br>Reduction exceeds the ${n(calculation.softCap)} damage-taken lower soft cap.<br>
          <span class="cap-formula">${formatNumber(calculation.softCap)}¶‎ اْ ${n(modifier)} = ${formatNumber(calculation.numerator)} اْ ${n(modifier)} = ${n(calculation.damageTaken)}</span>`
        : "";
      return `<div class="cap-calculation">
        <strong>Defense derived from damage taken</strong><br>
        Defense modifiers apply inversely to damage taken.<br>
        Damage taken: <span class="cap-formula">${modifierFormula}</span>${capMarkup}<br>
        Shown defense: <span class="cap-formula">100% اْ ${n(calculation.damageTaken)} = ${n(calculation.defense)}</span>
      </div>`;
    }

    function healthRegenerationCalculationMarkup(stat) {
      if (stat !== "healthRegeneration") return "";
      const calculation = latestCalculation?.healthRegenerationCalculation;
      if (!calculation) return "";
      const stacks = calculation.bigAndLazyStacks;
      const bigAndLazyLine = stacks > 0
        ? `Big and Lazy: <span class="cap-formula">100% + 200%${stacks > 1 ? ` + (${stacks - 1} ا- 50%)` : ""} = ${formatNumber(calculation.bigAndLazyMultiplier * 100)}% = ا-${formatNumber(calculation.bigAndLazyMultiplier)}</span><br>`
        : "";
      return `<div class="health-regeneration-calculation">
        <strong>Regenerated HP per second</strong><br>
        Base regeneration: ${formatHealthPerSecond(calculation.basePerSecond)} hp/s<br>
        Shown Health Regeneration: <span class="cap-formula">${formatNumber(calculation.percentage)}% = ا-${formatNumber(calculation.percentageMultiplier)}</span><br>
        ${bigAndLazyLine}
        <span class="cap-formula">${formatHealthPerSecond(calculation.basePerSecond)} ا- ${formatNumber(calculation.percentageMultiplier)} ا- ${formatNumber(calculation.bigAndLazyMultiplier)} = ${formatHealthPerSecond(calculation.perSecond)} hp/s</span>
      </div>`;
    }

    function showStatTooltip(row) {
      const stat = row.dataset.stat;
      const label = row.dataset.label;
      const entries = latestCalculation?.breakdowns?.[stat] || [];
      const tooltip = $("#stat-tooltip");
      tooltip.innerHTML = `<h3>${escapeHtml(label)} ¶ْ ${formatStat(stat, latestCalculation.stats[stat])}</h3>
        <table>
          <thead><tr><th>Value</th><th>Type</th><th>Source</th><th>Notes</th></tr></thead>
          <tbody>${entries.map(entry => `<tr>
            <td class="source-value">${escapeHtml(entry.value)}</td>
            <td class="source-type">${escapeHtml(entry.type)}</td>
            <td>${escapeHtml(entry.source)}</td>
            <td>${escapeHtml(entry.notes || "ƒ?"")}</td>
          </tr>`).join("")}</tbody>
        </table>
        ${healthRegenerationCalculationMarkup(stat)}
        ${defenseCalculationMarkup(stat)}
        ${softCapMarkup(stat)}`;
      tooltip.classList.add("visible");

      const rect = row.getBoundingClientRect();
      const box = tooltip.getBoundingClientRect();
      const gap = 10;
      let left = rect.right + gap;
      let top = rect.top - 12;
      if (left + box.width > window.innerWidth - 12) left = Math.max(12, rect.left - box.width - gap);
      if (top + box.height > window.innerHeight - 12) top = window.innerHeight - box.height - 12;
      tooltip.style.left = `${Math.max(12, left)}px`;
      tooltip.style.top = `${Math.max(12, top)}px`;
    }

    function hideStatTooltip() {
      $("#stat-tooltip").classList.remove("visible");
    }

    function clearCalculationReferences() {
      document.querySelectorAll(".calculation-reference").forEach(element => element.classList.remove("calculation-reference"));
    }

    function highlightCalculationReferences(refs) {
      clearCalculationReferences();
      refs.filter(Boolean).forEach(ref => {
        const separator = ref.indexOf(":");
        const type = ref.slice(0, separator);
        const key = ref.slice(separator + 1);
        const selector = type === "stat" ? `[data-stat="${CSS.escape(key)}"]`
          : type === "upgrade" ? `[data-id="${CSS.escape(key)}"]`
          : `[data-calculation-key="${CSS.escape(key)}"]`;
        document.querySelectorAll(selector).forEach(element => element.classList.add("calculation-reference"));
      });
    }

    function positionCalculationTooltip(clientX, clientY) {
      const tooltip = $("#calculation-tooltip");
      const gap = 14;
      const box = tooltip.getBoundingClientRect();
      let left = clientX + gap;
      let top = clientY + gap;
      if (left + box.width > window.innerWidth - 8) left = clientX - box.width - gap;
      if (top + box.height > window.innerHeight - 8) top = clientY - box.height - gap;
      tooltip.style.left = `${Math.max(8, left)}px`;
      tooltip.style.top = `${Math.max(8, top)}px`;
    }

    function showCalculationTooltip(value, clientX, clientY) {
      const tooltip = $("#calculation-tooltip");
      const lines = value.dataset.calculationFormula.split("\n");
      const isSource = value.dataset.calculationKey.startsWith("source:");
      const accent = getComputedStyle(value).color;
      const damageType = value.dataset.calculationDamageType;
      const damageTypeId = value.dataset.calculationDamageId;
      const sourceUpgradeId = value.dataset.calculationSourceUpgrade;
      const sourceUpgrade = sourceUpgradeId ? upgradeIndex.get(sourceUpgradeId) : null;
      const sourceIcon = value.dataset.calculationSourceIcon;
      const sourceIconUrl = sourceIcon && /^(?:https?:|data:|\/|pictures\/)/i.test(sourceIcon)
        ? sourceIcon
        : sourceIcon ? `pictures/${encodeURIComponent(sourceIcon)}` : "";
      let damageBreakdown = [];
      try { damageBreakdown = JSON.parse(value.dataset.calculationBreakdown || "[]"); } catch { damageBreakdown = []; }
      let applicationBreakdown = null;
      try { applicationBreakdown = JSON.parse(value.dataset.applicationBreakdown || "null"); } catch { applicationBreakdown = null; }
      const damageBadge = damageType
        ? `<span class="calculation-damage-type damage-type-${escapeHtml(damageTypeId)}">${escapeHtml(damageType)}</span>`
        : "";
      const breakdownMarkup = damageBreakdown.length
        ? `<div class="calculation-damage-breakdown">${damageBreakdown.map(item => `<div class="calculation-damage-breakdown-row damage-type-${escapeHtml(item.id)}"><span>${escapeHtml(item.name)}</span><strong>${escapeHtml(item.value)}</strong></div>`).join("")}</div>`
        : "";
      const applicationBreakdownMarkup = applicationBreakdown?.sources?.length
        ? `<div class="application-breakdown"><table><thead><tr><th>Source</th><th>Hit instances/s</th><th>Chance after boss penalty</th><th>Applications/s</th></tr></thead><tbody>${applicationBreakdown.sources.map(source => `<tr><td>${escapeHtml(source.name)}</td><td>${escapeHtml(source.hitsPerSecond)}</td><td>${escapeHtml(source.chanceCalculation)}</td><td>${escapeHtml(source.applicationsPerSecond)}</td></tr>`).join("")}</tbody><tfoot><tr><th colspan="3">Total applications/s</th><td>${escapeHtml(applicationBreakdown.total)}</td></tr></tfoot></table><div class="application-breakdown-result">1 اْ ${escapeHtml(applicationBreakdown.total)} = ${escapeHtml(applicationBreakdown.interval)} s</div></div>`
        : "";
      const upgradeMarkup = sourceUpgrade
        ? `<div class="calculation-tooltip-upgrade">
            <img class="calculation-tooltip-upgrade-icon" src="pictures/${encodeURIComponent(sourceUpgrade.icon)}" alt="">
            <div class="calculation-tooltip-upgrade-name">${escapeHtml(sourceUpgrade.name)}</div>
            <span class="calculation-tooltip-upgrade-stacks">${count(sourceUpgrade.id)} ${count(sourceUpgrade.id) === 1 ? "stack" : "stacks"}</span>
            <div class="calculation-tooltip-upgrade-effect">${escapeHtml(sourceUpgrade.effect)}</div>
          </div>`
        : "";
      const sourceDetailsMarkup = sourceIcon
        ? `<div class="calculation-tooltip-source-with-icon">
            <img class="calculation-tooltip-source-icon" src="${escapeHtml(sourceIconUrl)}" alt="" onerror="this.onerror=null;this.src='pictures/${escapeHtml(CLASS_LOGOS[selectedClass])}';">
            <div><div class="calculation-tooltip-title">${escapeHtml(lines[0])}</div>
              <div class="calculation-tooltip-lines">${lines.slice(1).map(line => `<span>${escapeHtml(line)}</span>`).join("")}</div></div>
          </div>`
        : `<div class="calculation-tooltip-title">${escapeHtml(lines[0])}</div>
          <div class="calculation-tooltip-lines">${lines.slice(1).map(line => `<span>${escapeHtml(line)}</span>`).join("")}</div>`;
      const formulaSourceIcon = sourceIcon
        ? `<img class="calculation-tooltip-mini-source-icon" src="${escapeHtml(sourceIconUrl)}" alt="" onerror="this.onerror=null;this.src='pictures/${escapeHtml(CLASS_LOGOS[selectedClass])}';">`
        : "";
      tooltip.style.setProperty("--tooltip-accent", accent);
      const contextMarkup = isSource
        ? `<div class="calculation-tooltip-head"><span class="calculation-tooltip-icon">ƒ-إ</span>Damage source${damageBadge}</div>
          ${sourceDetailsMarkup}`
        : `<div class="calculation-tooltip-head"><span class="calculation-tooltip-icon">▓'</span>Formula${formulaSourceIcon}${damageBadge}</div>
          <div class="calculation-tooltip-expression">${applicationBreakdownMarkup || lines.map(line => `<span class="calculation-tooltip-expression-line">${escapeHtml(line)}</span>`).join("")}</div>${breakdownMarkup}`;
      tooltip.innerHTML = `${upgradeMarkup}${contextMarkup}`;
      tooltip.classList.add("visible");
      highlightCalculationReferences((value.dataset.calculationRefs || "").split("|"));
      const rect = value.getBoundingClientRect();
      positionCalculationTooltip(clientX ?? rect.right, clientY ?? rect.bottom);
    }

    function hideCalculationTooltip() {
      $("#calculation-tooltip").classList.remove("visible");
      clearCalculationReferences();
    }

    let loadingSharedBuild = false;

    function getSharedConfiguration() {
      const configuration = {};
      const maximumBerserkerStacks = berserkerMaximumStacks();
      if (maximumBerserkerStacks > 0) {
        const stacks = Math.min(maximumBerserkerStacks, Math.max(0, Math.floor(Number(buildOptions.berserkerSoulStacks) || 0)));
        if (stacks !== maximumBerserkerStacks) configuration.berserkerSoulStacks = stacks;
      }
      if (selectedClass === "Spellsword") {
        configuration.spellsword = {
          damageGroup: buildOptions.spellswordDamageGroup === "secondary" ? 1 : 0,
          chargeMode: SPELLSWORD_CHARGE_MODES.indexOf(normalizeSpellswordChargeMode(buildOptions.spellswordChargeMode)),
          customChargeMs: Math.round(clampSpellswordChargeTime(buildOptions.spellswordCustomChargeTime) * 1000),
          bleedChance: null,
          whirlwindHits: normalizeSpellswordWhirlwindHits(buildOptions.spellswordWhirlwindHits)
        };
      } else if (selectedClass === "Twinmage") {
        configuration.twinmage = {
          primary: TWINMAGE_ELEMENTS.findIndex(element => element.id === buildOptions.twinmagePrimary),
          secondary: TWINMAGE_ELEMENTS.findIndex(element => element.id === buildOptions.twinmageSecondary),
          primaryDamage: buildOptions.twinmagePrimaryDamage !== false,
          secondaryDamage: buildOptions.twinmageSecondaryDamage !== false
        };
      } else if (selectedClass === "Gunmancer") {
        configuration.gunmancer = {
          primary: GUNMANCER_ABILITIES.primary.findIndex(ability => ability.id === buildOptions.gunmancerPrimary),
          secondary: GUNMANCER_ABILITIES.secondary.findIndex(ability => ability.id === buildOptions.gunmancerSecondary),
          damageGroup: buildOptions.gunmancerSecondaryDamage === true && buildOptions.gunmancerPrimaryDamage !== true ? 1 : 0,
          airblastTarget: ["none", "primary", "secondary"].indexOf(buildOptions.gunmancerAirblastTarget)
        };
      } else if (selectedClass === "Nekomancer") {
        const minions = normalizeNekomancerMinions(buildOptions.nekomancerMinions);
        configuration.nekomancer = {
          zombie: minions.zombie,
          balloon: minions.balloon,
          ballista: minions.ballista,
          souls: Math.min(5, Math.max(0, Math.floor(Number(buildOptions.nekomancerSouls) || 0)))
        };
      }
      const excludedSources = excludedDamageSourceKeys().map(key => DAMAGE_SOURCE_SHARE_ID.get(key)).filter(Number.isInteger);
      if (excludedSources.length) configuration.excludedDamageSources = excludedSources;
      return configuration;
    }

    function applySharedConfiguration(configuration = {}) {
      resetClassBuildConfiguration(selectedClass);
      buildOptions.berserkerSoulStacks = berserkerMaximumStacks();
      if (selectedClass === "Spellsword" && configuration.spellsword) {
        const value = configuration.spellsword;
        buildOptions.spellswordDamageGroup = value.damageGroup === 1 ? "secondary" : "primary";
        buildOptions.spellswordChargeMode = SPELLSWORD_CHARGE_MODES[value.chargeMode];
        buildOptions.spellswordCustomChargeTime = clampSpellswordChargeTime(value.customChargeMs / 1000);
        buildOptions.spellswordWhirlwindHits = normalizeSpellswordWhirlwindHits(value.whirlwindHits);
      } else if (selectedClass === "Twinmage" && configuration.twinmage) {
        const value = configuration.twinmage;
        buildOptions.twinmagePrimary = TWINMAGE_ELEMENTS[value.primary].id;
        buildOptions.twinmageSecondary = TWINMAGE_ELEMENTS[value.secondary].id;
        buildOptions.twinmagePrimaryDamage = value.primaryDamage;
        buildOptions.twinmageSecondaryDamage = value.secondaryDamage;
      } else if (selectedClass === "Gunmancer" && configuration.gunmancer) {
        const value = configuration.gunmancer;
        buildOptions.gunmancerPrimary = GUNMANCER_ABILITIES.primary[value.primary].id;
        buildOptions.gunmancerSecondary = GUNMANCER_ABILITIES.secondary[value.secondary].id;
        buildOptions.gunmancerPrimaryDamage = value.damageGroup === 0;
        buildOptions.gunmancerSecondaryDamage = value.damageGroup === 1;
        buildOptions.gunmancerAirblastTarget = ["none", "primary", "secondary"][value.airblastTarget];
      } else if (selectedClass === "Nekomancer" && configuration.nekomancer) {
        const value = configuration.nekomancer;
        buildOptions.nekomancerMinions = normalizeNekomancerMinions({
          zombie: value.zombie,
          balloon: value.balloon,
          ballista: value.ballista
        });
        buildOptions.nekomancerSouls = value.souls;
      }
      if (Array.isArray(configuration.excludedDamageSources)) {
        const classPrefix = `${selectedClass.toLowerCase().replaceAll(" ", "")}-`;
        buildOptions.excludedDamageSources[selectedClass] = configuration.excludedDamageSources
          .map(id => DAMAGE_SOURCE_SHARE_KEYS[id])
          .filter(key => key && (key.startsWith(classPrefix) || key.startsWith("status-")));
      }
      if (configuration.berserkerSoulStacks != null && berserkerMaximumStacks() > 0) {
        buildOptions.berserkerSoulStacks = Math.min(berserkerMaximumStacks(), configuration.berserkerSoulStacks);
      }
    }

    function getCurrentBuild() {
      return {
        version: ShareBuildCodec.FORMAT_VERSION,
        characterId: CLASS_FAMILIES.indexOf(selectedClass),
        upgrades: U.filter(upgrade => count(upgrade.id) > 0)
          .map(upgrade => ({ id: upgrade.globalId, count: Math.min(100, Math.max(1, count(upgrade.id))) }))
          .sort((a, b) => a.id - b.id),
        artifacts: ARTIFACTS.map((artifact, id) => ({ id, count: buildOptions.artifacts[artifact.id] || 0 })).filter(entry => entry.count),
        runes: buildOptions.runes.map(id => id == null ? null : RUNES.findIndex(rune => rune.id === id)),
        curses: buildOptions.curses.map(id => id == null ? null : CURSES.findIndex(curse => curse.id === id)),
        configuration: getSharedConfiguration()
      };
    }

    function encodeBuildV1(build) { return ShareBuildCodec.encodeBuildV1(build); }
    function encodeBuild(build) { return ShareBuildCodec.encodeBuild(build); }

    function decodeBuildV1(reader) { return ShareBuildCodec.decodeBuildV1(reader); }
    function decodeBuild(code) {
      return ShareBuildCodec.decodeBuild(code, {
        characterCount: CLASS_FAMILIES.length,
        upgradeCount: U.length,
        isUpgradeAllowed: (upgradeId, characterId) => {
          const upgrade = U[upgradeId];
          const character = CLASS_FAMILIES[characterId];
          return Boolean(upgrade && (upgrade.family === character || DEFAULT_FAMILIES.includes(upgrade.family)));
        },
        artifactCount: ARTIFACTS.length,
        runeCount: RUNES.length,
        curseCount: CURSES.length
      });
    }

    function applyBuild(build) {
      if (!build || !CLASS_FAMILIES[build.characterId]) throw new Error("Unknown character ID");
      loadingSharedBuild = true;
      try {
        selectedClass = CLASS_FAMILIES[build.characterId];
        safeSetStorage("ecliptica-upgrade-explorer-class", selectedClass);
        Object.keys(counts).forEach(id => delete counts[id]);
        for (const entry of build.upgrades) {
          const upgrade = U[entry.id];
          if (upgrade && Number.isInteger(entry.count) && entry.count >= 1 && entry.count <= 100) {
            const importedId = upgrade.id === BERSERKER_SOUL.melee.id ? berserkerVariantForClass()?.id : upgrade.id;
            if (importedId) counts[importedId] = entry.count;
          }
        }
        applySharedConfiguration(build.configuration);
        buildOptions.artifacts = Object.fromEntries((build.artifacts || []).flatMap(entry => {
          const artifact = ARTIFACTS[entry.id];
          return artifact && Number.isInteger(entry.count) && entry.count >= 1 && entry.count <= 100 ? [[artifact.id, entry.count]] : [];
        }));
        buildOptions.runes = RUNE_SLOTS.map((_, index) => RUNES[build.runes?.[index]]?.id || null);
        buildOptions.curses = RUNE_SLOTS.map((_, index) => CURSES[build.curses?.[index]]?.id || null);
        saveCounts();
        saveBuildOptions();
        syncClassUi();
        render();
      } finally {
        loadingSharedBuild = false;
      }
    }

    function createShareUrl() {
      const url = new URL(location.href);
      const parameters = new URLSearchParams(url.hash.slice(1));
      parameters.set("b", encodeBuild(getCurrentBuild()));
      url.hash = parameters.toString();
      return url.href;
    }

    function updateShareWidget() {
      if (loadingSharedBuild) return;
      const shareUrl = createShareUrl();
      $("#share-url").value = shareUrl;
      history.replaceState(null, "", shareUrl);
    }

    function loadBuildFromHash() {
      const code = new URLSearchParams(location.hash.slice(1)).get("b");
      if (!code) { updateShareWidget(); return; }
      try {
        const build = decodeBuild(code);
        applyBuild(build);
        // Preserve the original code (including valid ignored entries) while refreshing the widget.
        $("#share-url").value = location.href;
        $("#copy-status").textContent = build.warnings.length ? `Loaded with ${build.warnings.length} ignored entr${build.warnings.length === 1 ? "y" : "ies"}.` : "";
      } catch (error) {
        console.warn("Could not load shared build:", error);
        $("#copy-status").textContent = "Invalid build link; current build kept.";
        $("#share-url").value = location.href;
      }
    }

    async function copyShareUrl() {
      const input = $("#share-url");
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(input.value);
        else {
          input.select();
          input.setSelectionRange(0, input.value.length);
          if (!document.execCommand("copy")) throw new Error("Copy command failed");
          input.setSelectionRange(0, 0);
        }
        $("#copy-status").textContent = "Copied!";
      } catch {
        $("#copy-status").textContent = "Copy failed ┐?" select the link manually.";
      }
    }

    function setCount(id, next) {
      const previous = rawCount(id);
      next = Math.min(100, Math.max(0, Number(next) || 0));
      const isActiveBerserker = id === berserkerVariantForClass()?.id;
      if (isActiveBerserker && previous !== next) {
        const previousMaximum = berserkerMaximumStacks(previous);
        const nextMaximum = berserkerMaximumStacks(next);
        const stackRatio = previousMaximum > 0 ? clampBerserkerStacks(previous) / previousMaximum : 1;
        buildOptions.berserkerSoulStacks = nextMaximum > 0 ? Math.round(stackRatio * nextMaximum) : 0;
        saveBuildOptions();
      }
      if (next > 0) counts[id] = next;
      else delete counts[id];
      saveCounts();
      render();
    }

    function renderPicked() {
      const selected = U.filter(u => count(u.id));
      const totals = selected.reduce((result, upgrade) => {
        const stacks = count(upgrade.id);
        result.total += stacks;
        const rarity = upgrade.rarity.toLowerCase();
        if (Object.hasOwn(result, rarity)) result[rarity] += stacks;
        return result;
      }, { total: 0, common: 0, rare: 0, legendary: 0 });
      Object.entries(totals).forEach(([rarity, value]) => {
        $(`[data-upgrade-count="${rarity}"]`).textContent = value;
      });
      $("#picked-list").innerHTML = selected.length ? selected.map(u => `
        <div class="picked-item ${u.rarity.toLowerCase()}" title="${escapeHtml(u.effect)}">
          <img src="pictures/${encodeURIComponent(u.icon).replaceAll("%2F", "/")}" alt="">
          <span class="picked-name">${escapeHtml(u.name)}</span>
          <span class="picked-stepper">
            <button type="button" data-action="minus" data-id="${u.id}" aria-label="Remove one ${escapeHtml(u.name)}">┐^'</button>
            <span>${count(u.id)}</span>
            <button type="button" data-action="plus" data-id="${u.id}" aria-label="Add one ${escapeHtml(u.name)}">+</button>
          </span>
        </div>`).join("") : '<span class="empty">No upgrades picked yet.</span>';
    }

    function filteredUpgrades() {
      const query = $("#search").value.trim().toLowerCase();
      const family = $("#family-filter").value;
      const rarity = $("#rarity-filter").value;
      return U.filter(u =>
        isUpgradeAvailable(u) &&
        (!family || u.family === family) &&
        (!rarity || u.rarity === rarity) &&
        (!query || `${u.name} ${u.family} ${u.rarity} ${u.effect}`.toLowerCase().includes(query))
      );
    }

    function renderCatalog() {
      const list = filteredUpgrades().sort((a, b) => {
        const availabilityOrder = Number(isUpgradeConditionallyAvailable(b)) - Number(isUpgradeConditionallyAvailable(a));
        if (availabilityOrder) return availabilityOrder;
        if (!isUpgradeConditionallyAvailable(a)) return a.globalId - b.globalId;
        const familyOrder = family => family === "Mobility Crystal" ? 0 : family === "Endurance Crystal" ? 1 : 2;
        return familyOrder(a.family) - familyOrder(b.family) || a.globalId - b.globalId;
      });
      const availableTotal = U.filter(isUpgradeAvailable).length;
      $("#result-summary").textContent = `${list.length} of ${availableTotal}`;
      $("#catalog").innerHTML = list.length ? list.map(u => `
        <article class="upgrade ${u.rarity.toLowerCase()} ${count(u.id) ? "selected" : ""} ${isUpgradeConditionallyAvailable(u) ? "" : "conditional-unavailable"}"
          data-id="${u.id}" title="Left-click to add ІЗ Right-click to remove">
          ${count(u.id) ? `<span class="count">г-${count(u.id)}</span>` : ""}
          <img src="pictures/${encodeURIComponent(u.icon).replaceAll("%2F", "/")}" alt="">
          <div class="upgrade-copy">
            <h3 class="upgrade-name">${escapeHtml(u.name)}</h3>
            <div class="meta">${escapeHtml(u.rarity)} ІЗ ${escapeHtml(u.family)}</div>
            ${conditionalAvailabilityReason(u) ? `<div class="conditional-note">${escapeHtml(conditionalAvailabilityReason(u))}</div>` : ""}
            <p class="effect">${escapeHtml(u.effect)}</p>
          </div>
        </article>`).join("") : '<div class="no-results">No upgrades match these filters.</div>';
    }

    let dpsRankingRun = 0;
    let dpsRankingVisible = false;
    let dpsRankingFrame = null;
    let dpsRankingSnapshot = null;
    let dpsRankingBuildOptionsSnapshot = null;

    function restoreCounts(snapshot) {
      Object.keys(counts).forEach(id => delete counts[id]);
      Object.assign(counts, snapshot);
    }

    function restoreRankingBuildOptions(snapshot) {
      if (!snapshot) return;
      buildOptions.berserkerSoulStacks = snapshot.berserkerSoulStacks;
    }

    function renderDpsRanking() {
      const listElement = $("#dps-ranking-list");
      const toggleElement = $("#dps-ranking-toggle");
      const rankingSection = listElement?.closest(".dps-ranking");
      if (!listElement || !toggleElement) return;
      if (dpsRankingFrame !== null) {
        cancelAnimationFrame(dpsRankingFrame);
        dpsRankingFrame = null;
      }
      const run = ++dpsRankingRun;
      if (rankingSection) rankingSection.hidden = !dpsRankingVisible;
      listElement.hidden = !dpsRankingVisible;
      toggleElement.textContent = dpsRankingVisible ? "Hide sorted by DPS" : "Show sorted by DPS";
      toggleElement.setAttribute("aria-expanded", String(dpsRankingVisible));

      if (!dpsRankingVisible) {
        if (dpsRankingSnapshot) {
          restoreCounts(dpsRankingSnapshot);
          restoreRankingBuildOptions(dpsRankingBuildOptionsSnapshot);
          latestCalculation = calculateStats();
          dpsRankingSnapshot = null;
          dpsRankingBuildOptionsSnapshot = null;
        }
        listElement.innerHTML = "";
        return;
      }

      if (!["Spellsword", "Twinmage", "Gunmancer", "Thaumaturge", "Nekomancer"].includes(selectedClass)) {
        dpsRankingSnapshot = null;
        listElement.innerHTML = '<div class="dps-ranking-empty">DPS ranking is currently available for Spellsword, Twinmage, Gunmancer, Thaumaturge, and Nekomancer.</div>';
        return;
      }

      const snapshot = { ...counts };
      const buildOptionsSnapshot = { berserkerSoulStacks: buildOptions.berserkerSoulStacks };
      dpsRankingSnapshot = snapshot;
      dpsRankingBuildOptionsSnapshot = buildOptionsSnapshot;
      const results = [];
      const candidates = U.filter(upgrade => isUpgradeAvailable(upgrade) && isUpgradeConditionallyAvailable(upgrade)).filter(upgrade => count(upgrade.id) < 100);
      listElement.innerHTML = `<div class="dps-ranking-loading"><span class="dps-ranking-spinner" aria-hidden="true"></span><span class="dps-ranking-progress">Calculating 0 / ${candidates.length}ƒ?Ý</span></div>`;
      const progressElement = listElement.querySelector(".dps-ranking-progress");
      latestCalculation = calculateStats();
      const baseDps = renderCalculations({ render: false })?.combinedTotalDps || 0;
      let index = 0;

      const processChunk = () => {
        dpsRankingFrame = null;
        if (run !== dpsRankingRun || !dpsRankingVisible) {
          restoreCounts(snapshot);
          restoreRankingBuildOptions(buildOptionsSnapshot);
          latestCalculation = calculateStats();
          return;
        }
        const chunkEnd = Math.min(index + 10, candidates.length);
        for (; index < chunkEnd; index += 1) {
          const upgrade = candidates[index];
          counts[upgrade.id] = (snapshot[upgrade.id] || 0) + 1;
          if (upgrade.id === berserkerVariantForClass()?.id) {
            const previousMaximum = berserkerMaximumStacks(snapshot[upgrade.id] || 0);
            const nextMaximum = berserkerMaximumStacks(counts[upgrade.id]);
            const stackRatio = previousMaximum > 0 ? Math.min(previousMaximum, Math.max(0, Number(buildOptionsSnapshot.berserkerSoulStacks) || 0)) / previousMaximum : 1;
            buildOptions.berserkerSoulStacks = Math.round(stackRatio * nextMaximum);
          }
          latestCalculation = calculateStats();
          const candidateDps = renderCalculations({ render: false })?.combinedTotalDps || 0;
          results.push({ upgrade, delta: candidateDps - baseDps });
          restoreCounts(snapshot);
          restoreRankingBuildOptions(buildOptionsSnapshot);
        }
        if (progressElement) progressElement.textContent = `Calculating ${index} / ${candidates.length}ƒ?Ý`;
        if (index < candidates.length) {
          dpsRankingFrame = requestAnimationFrame(processChunk);
          return;
        }

        restoreCounts(snapshot);
        restoreRankingBuildOptions(buildOptionsSnapshot);
        latestCalculation = calculateStats();
        if (run !== dpsRankingRun || !dpsRankingVisible) return;
        results.sort((a, b) => b.delta - a.delta || a.upgrade.name.localeCompare(b.upgrade.name));
        listElement.innerHTML = results.length ? results.map((result, resultIndex) => {
          const sign = result.delta >= 0 ? "+" : "";
          const state = result.delta < 0 ? " negative" : "";
          return `<button class="dps-ranking-item${state}" type="button" data-dps-upgrade-id="${escapeHtml(result.upgrade.id)}" title="Add one stack of ${escapeHtml(result.upgrade.name)}">
            <span class="dps-ranking-rank">${resultIndex + 1}</span>
            <img src="pictures/${encodeURIComponent(result.upgrade.icon).replaceAll("%2F", "/")}" alt="">
            <span class="dps-ranking-name">${escapeHtml(result.upgrade.name)}</span>
            <span class="dps-ranking-increase">${sign}${Number(result.delta).toFixed(2)} DPS</span>
          </button>`;
        }).join("") : '<div class="dps-ranking-empty">No upgrades are available for another stack.</div>';
      };

      dpsRankingFrame = requestAnimationFrame(processChunk);
    }

    function renderArtifacts() {
      const total = Object.values(buildOptions.artifacts).reduce((sum, value) => sum + value, 0);
      const unique = Object.keys(buildOptions.artifacts).length;
      $("#artifact-summary").textContent = `${total} artifact${total === 1 ? "" : "s"} ¶ú ${unique} unique`;
      $("#artifact-catalog").innerHTML = ARTIFACTS.map(item => `
        <article class="upgrade artifact-card ${buildOptions.artifacts[item.id] ? "selected" : ""}" data-id="${item.id}" title="Left-click to add ¶ú Right-click to remove">
          ${buildOptions.artifacts[item.id] ? `<span class="count">Ç-${buildOptions.artifacts[item.id]}</span>` : ""}
          <div class="item-placeholder"><img class="item-art" src="pictures/${encodeURIComponent(item.image)}" alt="${escapeHtml(item.name)}"></div>
          <div class="upgrade-copy"><h3 class="upgrade-name">${escapeHtml(item.name)}</h3>
            <div class="meta">Party artifact</div><p class="effect">${escapeHtml(item.effect)}</p></div>
        </article>`).join("");
    }

    function gunmancerAbility(id, group) {
      return GUNMANCER_ABILITIES[group].find(ability => ability.id === id) || GUNMANCER_ABILITIES[group][0];
    }

    function gunmancerDpsGroup() {
      return buildOptions.gunmancerSecondaryDamage === true && buildOptions.gunmancerPrimaryDamage !== true ? "secondary" : "primary";
    }

    function spellswordNominalChargeTime() {
      const mode = normalizeSpellswordChargeMode(buildOptions.spellswordChargeMode);
      if (mode === "quick") return SPELLSWORD_SECONDARY.minimumCharge;
      if (mode === "full") return SPELLSWORD_SECONDARY.maximumCharge;
      if (mode === "custom") return clampSpellswordChargeTime(buildOptions.spellswordCustomChargeTime);
      return SPELLSWORD_SECONDARY.optimalCharge;
    }

    function spellswordUsesFullCharge() {
      return spellswordNominalChargeTime() >= SPELLSWORD_SECONDARY.maximumCharge - .0005;
    }

    function renderSpellswordConfiguration(content) {
      const group = buildOptions.spellswordDamageGroup === "secondary" ? "secondary" : "primary";
      const mode = normalizeSpellswordChargeMode(buildOptions.spellswordChargeMode);
      const customCharge = clampSpellswordChargeTime(buildOptions.spellswordCustomChargeTime);
      const fullCharge = spellswordUsesFullCharge();
      const bleedChance = spellswordBleedingChance(spellswordNominalChargeTime());
      const abilityCard = (value, label, ability) => `<label class="ability-option spellsword-attack-option">

    function gunmancerChargedCooldown(stats = latestCalculation?.stats) {
      const cooldownRate = Math.max(0, Number(stats?.utilityCooldownRate || 0)) / 100;

    function berserkerStackControlMarkup() {

      return `<fieldset class="berserker-stack-control">
        <legend>${escapeHtml(upgradeName)} stacks</legend>

          <input type="range" name="berserker-soul-stacks" min="0" max="${maximum}" step="1" value="${stacks}" aria-label="${escapeHtml(upgradeName)} stacks">
          <input type="number" name="berserker-soul-stacks" min="0" max="${maximum}" step="1" value="${stacks}" aria-label="${escapeHtml(upgradeName)} stack count">

    function appendBerserkerStackControl(content) {
      const markup = berserkerStackControlMarkup();
      if (!markup) return;
      content.classList.add("configuration-stack");
      content.insertAdjacentHTML("beforeend", markup);

    function renderConfiguration() {
      const content = $("#configuration-content");
      content.classList.remove("configuration-stack");
      if (selectedClass === "Spellsword") {
        renderSpellswordConfiguration(content);
        appendBerserkerStackControl(content);

      }
      if (selectedClass === "Gunmancer") {
        renderGunmancerConfiguration(content);
        appendBerserkerStackControl(content);
        return;
      }
      if (selectedClass === "Thaumaturge") {
        renderThaumaturgeConfiguration(content);
        appendBerserkerStackControl(content);
        return;
      }
      if (selectedClass === "Nekomancer") {
        renderNekomancerConfiguration(content);
        return;
      }
      if (selectedClass !== "Twinmage") {
        const stackControl = berserkerStackControlMarkup();
        content.innerHTML = `<div class="configuration-empty">${escapeHtml(UNIMPLEMENTED_DPS_MESSAGE)}</div>${stackControl}`;
        if (stackControl) content.classList.add("configuration-stack");
        return;
      }
      const picker = (hand, label, selected, useForDamage) => `
        <fieldset class="element-picker">

          <div class="element-options">
            ${TWINMAGE_ELEMENTS.map(element => `

                <input type="radio" name="twinmage-${hand}" value="${element.id}" ${element.id === selected ? "checked" : ""}>
                <img class="element-icon" src="pictures/${encodeURIComponent(element.image)}" alt="">

      content.innerHTML = `<div class="twinmage-configuration">
        ${picker("primary", "Primary element", buildOptions.twinmagePrimary, buildOptions.twinmagePrimaryDamage)}
        ${picker("secondary", "Secondary element", buildOptions.twinmageSecondary, buildOptions.twinmageSecondaryDamage)}
      </div>`;
      appendBerserkerStackControl(content);
    }

    function effectiveSourceStatusChance(statusId, baseChance, attackSpeedMultiplier) {
      if (!Number.isFinite(baseChance) || attackSpeedMultiplier <= 0) return null;
      const bonus = STATUS_CHANCE_BONUSES[statusId];
      return (baseChance + (bonus ? count(bonus.upgradeId) * bonus.chancePerStack : 0)) / attackSpeedMultiplier;
    }

    function calculationElementMultipliers(stats) {
      return Object.fromEntries(Object.entries(DAMAGE_TYPE_STATS).map(([damageType, stat]) => {
        const value = Number(stats[stat]);
        if (!Number.isFinite(value)) throw new Error(`Missing damage stat: ${stat}`);
        return [damageType, value / 100];
      }));
    }

    function componentProjectileCount(component, mode = "normal") {
      const configured = mode === "charged" && component.chargedProjectiles != null ? component.chargedProjectiles : component.projectiles;
      return Math.max(1, Number(typeof configured === "function" ? configured() : configured) || 1);
    }

    function abilityDamageSourceSpecs(classKey, ability, group, attackSpeedMultiplier) {
      const baseActivationRate = ability.interval > 0 ? 1 / ability.interval : 0;
      const activationRate = baseActivationRate * attackSpeedMultiplier;
      return ability.components.map((component, index) => {
        const projectiles = componentProjectileCount(component);
        const statusChance = index === 0 && ability.status
          ? effectiveSourceStatusChance(ability.status.id, ability.status.chance, attackSpeedMultiplier)
          : null;
        return {
          id: `${classKey}-${ability.id}-${component.id || index}`,
          name: ability.components.length === 1 ? ability.name : component.name,
          position: group,
          sourceIcon: ability.iconUrl,
          element: component.element,
           baseDamage: component.damage,
           canCrit: component.canCrit !== false,
           activationRate,
           baseActivationRate,
           rateMultipliers: [{ label: "Attack Speed", value: attackSpeedMultiplier }],
           rateRefs: ["stat:attackSpeed"],
           instancesPerActivation: projectiles,
           projectiles,
           showProjectiles: true,
          statuses: statusChance == null ? [] : [{ id: ability.status.id, name: ability.status.name, chance: statusChance }]
        };
      });
    }

    function sharedUpgradeSourceSpecs(classKey, primaryActivationRate, attackSpeedMultiplier, primaryRateDetails = {}) {
      const sources = [];
      PRIMARY_TRIGGERED_UPGRADE_SOURCES.forEach(upgrade => {
        const stacks = count(upgrade.upgradeId);
        if (stacks <= 0 || primaryActivationRate <= 0) return;
        const statusChance = effectiveSourceStatusChance(upgrade.statusId, upgrade.statusChance, attackSpeedMultiplier);
        sources.push({
          id: `${classKey}-${upgrade.sourceId}`, name: upgrade.name, position: "Upgrade effect",
          sourceIcon: upgrade.icon, sourceUpgradeId: upgrade.upgradeId,
          element: upgrade.element, baseDamage: upgrade.firstStackDamage + upgrade.additionalStackDamage * Math.max(0, stacks - 1), canCrit: true,
          activationRate: primaryActivationRate, instancesPerActivation: 1, projectiles: 1,
          ...primaryRateDetails,
          ...(upgrade.overallDamageApplies === false ? { overallDamageApplies: false } : {}),
          statuses: statusChance == null ? [] : [{ id: upgrade.statusId, name: upgrade.statusName, chance: statusChance }],
          trigger: { type: "primaryActivation" }
        });
      });
      const chargedStrikeStacks = count("Charged_Strike");
      if (chargedStrikeStacks > 0) sources.push({
        id: `${classKey}-charged-strike`, name: "Charged Strike", position: "Upgrade effect",
        sourceIcon: "Charged_Strike.png", sourceUpgradeId: "Charged_Strike",
        element: "physical", baseDamage: 25 + 10 * Math.max(0, chargedStrikeStacks - 1), canCrit: false,
        trigger: { type: "onCrit", instancesPerTrigger: 1 }, sourceMultiplierStrategy: "weightedCritSources", statuses: []
      });
      return sources;
    }

    function spellswordPiercingDamage(chargeTime) {
      const clampedCharge = clampSpellswordChargeTime(chargeTime);
      return Math.round(170.70 - 97.33 * Math.exp(-.8927 * clampedCharge));
    }

    function spellswordBleedingChance(chargeTime) {
      return .5 * spellswordPiercingDamage(chargeTime) / 170;
    }

    function buildSpellswordSourceModel(stats) {
      const attackSpeedMultiplier = Math.max(0, Number(stats.attackSpeed || 0) / 100);
      const group = buildOptions.spellswordDamageGroup === "secondary" ? "secondary" : "primary";
      const sources = [];
      let primaryActivationRate = 0;
      let primaryRateDetails = {};
      if (group === "primary") {
        const shieldbreakerStacks = count("Spellsword_Shieldbreaker");
        const shieldbreakerMultiplier = 1 + .25 * shieldbreakerStacks;
        const baseDamage = Math.ceil(SPELLSWORD_PRIMARY.damage * shieldbreakerMultiplier);
        primaryActivationRate = SPELLSWORD_PRIMARY.baseActivationRate * attackSpeedMultiplier;
        primaryRateDetails = {
          baseActivationRate: SPELLSWORD_PRIMARY.baseActivationRate,
          rateMultipliers: [{ label: "Attack Speed", value: attackSpeedMultiplier }],
          rateRefs: ["stat:attackSpeed"]
        };
        const bleedingChance = effectiveSourceStatusChance("bleeding", SPELLSWORD_PRIMARY.status.chance, attackSpeedMultiplier);
        sources.push({
          id: "spellsword-telekinetic-strike", name: SPELLSWORD_PRIMARY.name, position: "Primary",
          sourceIcon: SPELLSWORD_PRIMARY.iconUrl, element: SPELLSWORD_PRIMARY.element, baseDamage, canCrit: true,
          baseDamageFormula: shieldbreakerStacks > 0
            ? `ceil(${SPELLSWORD_PRIMARY.damage} ا- (1 + 25% ا- ${shieldbreakerStacks})) = ${baseDamage}`
            : `Base damage per instance = ${baseDamage}`,
          activationRate: primaryActivationRate, instancesPerActivation: 1, projectiles: 1,
          ...primaryRateDetails,
          statuses: bleedingChance == null ? [] : [{ id: "bleeding", name: "Bleeding", chance: bleedingChance }]
        });
      } else {
        const nominalChargeTime = spellswordNominalChargeTime();
        const whirlwindStacks = count("Spellsword_Whirlwind");
        const chargeTimeMultiplier = 1 + .30 * whirlwindStacks;
        const chargeSpeedMultiplier = Math.max(.1, 1 + 1.5 * (attackSpeedMultiplier - 1));
        const effectiveChargeTime = nominalChargeTime * chargeTimeMultiplier / chargeSpeedMultiplier;
        const cycleTime = effectiveChargeTime + SPELLSWORD_SECONDARY.cooldown;
        const activationRate = cycleTime > 0 ? 1 / cycleTime : 0;
        const swiftStabStacks = count("Spellsword_Swift_Stab");
        const movementExcess = Math.max(0, Number(stats.movementSpeed || 0) / 100 - 1);
        const swiftStabMultiplier = 1 + .35 * swiftStabStacks * movementExcess;
        const baseBleedingChance = spellswordBleedingChance(nominalChargeTime);
        const bleedingChance = effectiveSourceStatusChance("bleeding", baseBleedingChance, attackSpeedMultiplier);
        const rateCalculation = `${nominalChargeTime.toFixed(3)}s charge ا- x${chargeTimeMultiplier.toFixed(2)} Whirlwind charge time اْ x${chargeSpeedMultiplier.toFixed(2)} charge speed + ${SPELLSWORD_SECONDARY.cooldown.toFixed(2)}s cooldown = ${cycleTime.toFixed(3)}s cycle; 1 اْ ${cycleTime.toFixed(3)}s = ${activationRate.toFixed(4)} activations/s`;
        const piercing = {
          id: "spellsword-piercing-strike", name: SPELLSWORD_SECONDARY.name, position: "Secondary",
          sourceIcon: SPELLSWORD_SECONDARY.iconUrl, element: SPELLSWORD_SECONDARY.element,
          baseDamage: spellswordPiercingDamage(nominalChargeTime), canCrit: true,
          baseDamageFormula: `${nominalChargeTime.toFixed(3)}s charge on the 87-170 damage curve; rounded damage = ${spellswordPiercingDamage(nominalChargeTime)}`,
          activationRate, instancesPerActivation: 1, projectiles: 1,
          sourceMultiplier: swiftStabMultiplier,
          statusSourceMultiplierApplies: false,
          sourceMultiplierFormula: swiftStabStacks > 0
            ? `1 + (35% ا- ${swiftStabStacks}) ا- ${Math.round(movementExcess * 100)}% Movement Speed above 100% = x${swiftStabMultiplier.toFixed(4)}`
            : "No Piercing Strike source multiplier",
          rateCalculation, rateRefs: ["stat:attackSpeed"],
          statuses: [{ id: "bleeding", name: "Bleeding", chance: bleedingChance }]
        };
        sources.push(piercing);
        if (whirlwindStacks > 0 && spellswordUsesFullCharge()) {
          const hits = normalizeSpellswordWhirlwindHits(buildOptions.spellswordWhirlwindHits);
          sources.push({
            id: "spellsword-whirlwind", name: "Whirlwind", position: "Upgrade effect",
            sourceIcon: "Spellsword_Whirlwind.png", sourceUpgradeId: "Spellsword_Whirlwind",
            element: "physical", baseDamage: 11 + 6 * Math.max(0, whirlwindStacks - 1), canCrit: false,
            activationRate, instancesPerActivation: hits, projectiles: 1, showInstances: true, instanceCountKind: "hits",
            rateCalculation: `Full-charge Piercing Strike rate = ${activationRate.toFixed(4)} casts/s`, rateRefs: ["calc:damage:spellsword-piercing-strike:rate"],
            statuses: [{ id: "bleeding", name: "Bleeding", chance: bleedingChance }],
            trigger: { type: "sourceActivation", sourceId: piercing.id }, linkedSourceId: piercing.id
          });
        }
      }
      sources.push(...sharedUpgradeSourceSpecs("spellsword", primaryActivationRate, attackSpeedMultiplier, primaryRateDetails));
      return { className: "Spellsword", classKey: "spellsword", sources };
    }

    function buildGunmancerSourceModel(stats) {
      const attackSpeedMultiplier = Number(stats.attackSpeed || 0) / 100;
      const group = gunmancerDpsGroup();
      const ability = gunmancerAbility(group === "primary" ? buildOptions.gunmancerPrimary : buildOptions.gunmancerSecondary, group);
      const primary = gunmancerAbility(buildOptions.gunmancerPrimary, "primary");
      const sources = abilityDamageSourceSpecs("gunmancer", ability, group === "primary" ? "Primary" : "Secondary", attackSpeedMultiplier);
      if (buildOptions.gunmancerAirblastTarget !== "none") {
        const chargedGroup = buildOptions.gunmancerAirblastTarget;
        const chargedAbility = gunmancerAbility(chargedGroup === "primary" ? buildOptions.gunmancerPrimary : buildOptions.gunmancerSecondary, chargedGroup);
        const chargedMultiplier = GUNMANCER_AIRBLAST.chargedMultiplier + count("Gunmancer_Mastery") * .5;
        const utilityCooldownMultiplier = Math.max(0, Number(stats.utilityCooldownRate || 0)) / 100;
        const chargedActivationRate = utilityCooldownMultiplier / GUNMANCER_AIRBLAST.cooldown;
        chargedAbility.components.forEach((component, index) => {
          const projectiles = componentProjectileCount(component, "charged");
          const statusChance = index === 0 && chargedAbility.status
            ? effectiveSourceStatusChance(chargedAbility.status.id, chargedAbility.status.chance, attackSpeedMultiplier)
            : null;
          sources.push({
            id: `gunmancer-airblast-${chargedGroup}-${chargedAbility.id}-${component.id || index}`,
            name: chargedAbility.components.length === 1 ? `Charged ${chargedAbility.name}` : `Charged ${component.name}`,
            position: `Charged ${chargedGroup}`,
            sourceIcon: GUNMANCER_AIRBLAST.iconUrl,
            element: component.element,
            baseDamage: component.damage * chargedMultiplier,
            canCrit: component.canCrit !== false,
            activationRate: chargedActivationRate,
            baseActivationRate: 1 / GUNMANCER_AIRBLAST.cooldown,
            rateMultipliers: [{ label: "Utility Cooldown Rate", value: utilityCooldownMultiplier }],
            rateRefs: ["stat:utilityCooldownRate"],
            instancesPerActivation: projectiles,
            projectiles,
            showProjectiles: true,
            statuses: statusChance == null ? [] : [{ id: chargedAbility.status.id, name: chargedAbility.status.name, chance: statusChance }],
            trigger: { type: "cooldown" }
          });
        });
      }
      const primaryActivationRate = group === "primary" && primary.interval > 0 ? attackSpeedMultiplier / primary.interval : 0;
      sources.push(...sharedUpgradeSourceSpecs("gunmancer", primaryActivationRate, attackSpeedMultiplier, {
        baseActivationRate: primary.interval > 0 ? 1 / primary.interval : 0,
        rateMultipliers: [{ label: "Attack Speed", value: attackSpeedMultiplier }],
        rateRefs: ["stat:attackSpeed"]
      }));
      return { className: "Gunmancer", classKey: "gunmancer", sources };
    }

    function buildThaumaturgeSourceModel(stats) {
      const attackSpeedMultiplier = Number(stats.attackSpeed || 0) / 100;
      const primaryActivationRate = THAUMATURGE_PRIMARY.interval > 0 ? attackSpeedMultiplier / THAUMATURGE_PRIMARY.interval : 0;
      return {
        className: "Thaumaturge", classKey: "thaumaturge",
        sources: [
          ...abilityDamageSourceSpecs("thaumaturge", THAUMATURGE_PRIMARY, "Primary", attackSpeedMultiplier),
          ...sharedUpgradeSourceSpecs("thaumaturge", primaryActivationRate, attackSpeedMultiplier, {
            baseActivationRate: THAUMATURGE_PRIMARY.interval > 0 ? 1 / THAUMATURGE_PRIMARY.interval : 0,
            rateMultipliers: [{ label: "Attack Speed", value: attackSpeedMultiplier }],
            rateRefs: ["stat:attackSpeed"]
          })
        ]
      };
    }

    function buildNekomancerSourceModel(stats) {
      const attackSpeedMultiplier = Number(stats.attackSpeed || 0) / 100;
      const primaryActivationRate = NEKOMANCER_PRIMARY.interval > 0 ? attackSpeedMultiplier / NEKOMANCER_PRIMARY.interval : 0;
      const minionCounts = normalizeNekomancerMinions(buildOptions.nekomancerMinions);
      const minionSources = NEKOMANCER_MINIONS.flatMap(minion => {
        const selected = minionCounts[minion.id] || 0;
        if (!selected) return [];
        const statusChance = effectiveSourceStatusChance(minion.status.id, minion.status.chance, attackSpeedMultiplier);
        return [{
          id: `nekomancer-minion-${minion.id}`,
          name: `${minion.name} ا-${selected}`,
          position: "Minion",
          sourceIcon: minion.iconUrl,
          element: minion.element,
          baseDamage: minion.damage,
          canCrit: true,
          activationRate: minion.baseActivationRate * selected * attackSpeedMultiplier,
          baseActivationRate: minion.baseActivationRate,
          rateMultipliers: [
            { label: selected === 1 ? "Minion" : "Minions", value: selected },
            { label: "Attack Speed", value: attackSpeedMultiplier }
          ],
          rateRefs: ["stat:attackSpeed"],
          instancesPerActivation: 1,
          projectiles: 1,
          statuses: statusChance == null ? [] : [{ id: minion.status.id, name: minion.status.name, chance: statusChance }]
        }];
      });
      return {
        className: "Nekomancer",
        classKey: "nekomancer",
        sources: [
          ...abilityDamageSourceSpecs("nekomancer", NEKOMANCER_PRIMARY, "Primary", attackSpeedMultiplier),
          ...minionSources,
          ...sharedUpgradeSourceSpecs("nekomancer", primaryActivationRate, attackSpeedMultiplier, {
            baseActivationRate: NEKOMANCER_PRIMARY.interval > 0 ? 1 / NEKOMANCER_PRIMARY.interval : 0,
            rateMultipliers: [{ label: "Attack Speed", value: attackSpeedMultiplier }],
            rateRefs: ["stat:attackSpeed"]
          })
        ]
      };
    }

    function buildTwinmageSourceModel(stats) {
      const selectedHands = [
        { position: "Primary hand", elementId: buildOptions.twinmagePrimary, enabled: buildOptions.twinmagePrimaryDamage },
        { position: "Secondary hand", elementId: buildOptions.twinmageSecondary, enabled: buildOptions.twinmageSecondaryDamage }
      ].filter(hand => hand.enabled).map(hand => ({ ...hand, element: TWINMAGE_ELEMENTS.find(element => element.id === hand.elementId) })).filter(hand => hand.element);
      if (!selectedHands.length) return { className: "Twinmage", classKey: "twinmage", sources: [], emptyMessage: "Enable at least one hand for damage calculations in Configuration." };
      const attackSpeedMultiplier = Number(stats.attackSpeed || 0) / 100;
      const baseActivationRate = selectedHands.length === 1 ? 1.4 : .8;
      const sinistraStacks = count("Twinmage-Hand-Boost-L");
      const dextraStacks = count("Twinmage-Hand-Boost-R");
      const handMultiplier = position => {
        const positive = position === "Primary hand" ? sinistraStacks : dextraStacks;
        const negative = position === "Primary hand" ? dextraStacks : sinistraStacks;
        return 1 + (positive * 5 - negative * 3) / 100;
      };
      const handSources = selectedHands.map((hand, index) => {
        const sourceMultiplier = handMultiplier(hand.position);
        const statuses = Object.entries(hand.element.statusChances).flatMap(([statusId, chance]) => {
          const effective = effectiveSourceStatusChance(statusId, chance, attackSpeedMultiplier);
          return effective == null ? [] : [{ id: statusId, chance: effective }];
        });
        return {
          id: `twinmage-hand-${index}`, name: hand.element.handName, position: hand.position,
          exclusionKey: `twinmage-hand-${hand.position === "Primary hand" ? "primary" : "secondary"}`,
          sourceIcon: hand.element.image, element: hand.element.id, baseDamage: hand.element.baseDamage, canCrit: true,
           activationRate: baseActivationRate * attackSpeedMultiplier * sourceMultiplier,
           instancesPerActivation: 1, projectiles: 1, sourceMultiplier, statuses,
           handAttackSpeedMultiplier: sourceMultiplier, baseActivationRate,
           rateMultipliers: [
             { label: "Attack Speed", value: attackSpeedMultiplier },
             { label: "Hand Attack Speed", value: sourceMultiplier }
           ],
           rateRefs: ["stat:attackSpeed"]
        };
      });
      const masterySources = count("Twinmage_Mastery") > 0 ? handSources.map((source, index) => ({
        ...source, id: `twinmage-mastery-${index}`, name: `${TWINMAGE_ELEMENTS.find(element => element.id === source.element)?.name || source.name} Blast`,
        exclusionKey: `twinmage-mastery-${source.position === "Primary hand" ? "primary" : "secondary"}`,
        position: "Mastery explosion", sourceUpgradeId: "Twinmage_Mastery", baseDamage: source.baseDamage * .25,
        trigger: { type: "sourceActivation", sourceId: source.id }, linkedSourceId: source.id
      })) : [];
      const primarySource = handSources.find(source => source.position === "Primary hand");
      const sharedSources = primarySource
        ? sharedUpgradeSourceSpecs("twinmage", primarySource.activationRate, attackSpeedMultiplier, {
          baseActivationRate: primarySource.baseActivationRate,
          rateMultipliers: primarySource.rateMultipliers,
          rateRefs: primarySource.rateRefs
        }).map(source => source.trigger?.type === "primaryActivation" ? { ...source, sourceMultiplier: primarySource.sourceMultiplier } : source)
        : sharedUpgradeSourceSpecs("twinmage", 0, attackSpeedMultiplier);
      return { className: "Twinmage", classKey: "twinmage", sources: [...handSources, ...masterySources, ...sharedSources] };
    }

    function buildUnifiedCalculationModel() {
      const stats = latestCalculation.stats;
      const sourceModel = selectedClass === "Spellsword" ? buildSpellswordSourceModel(stats)
        : selectedClass === "Twinmage" ? buildTwinmageSourceModel(stats)
        : selectedClass === "Gunmancer" ? buildGunmancerSourceModel(stats)
          : selectedClass === "Thaumaturge" ? buildThaumaturgeSourceModel(stats)
            : selectedClass === "Nekomancer" ? buildNekomancerSourceModel(stats)
              : null;
      if (!sourceModel) return null;
      const criticalChancePercent = count("Pocket_Abacus") > 0 ? 20 : Number(stats.criticalChance || 0);
      const elementalMultipliers = calculationElementMultipliers(stats);
      const excludedKeys = new Set(excludedDamageSourceKeys());
      const sources = sourceModel.sources.map(source => {
        const exclusionKey = source.exclusionKey || source.id;
        const element = normalizeDamageType(source.element);
        const damageStat = damageStatForType(element);
        return {
          ...source,
          element,
          damageStat,
          exclusionKey,
          excluded: excludedKeys.has(exclusionKey),
          overallMultiplier: Number(stats.overallDamage || 0) / 100,
          elementalMultiplier: elementalMultipliers[element]
        };
      });
      const calculation = EclipticaCalculationEngine.calculate({
        sources,
        criticalChance: Math.max(0, criticalChancePercent) / 100,
        criticalDamageMultiplier: Number(stats.criticalDamage || 0) / 100,
        overallMultiplier: Number(stats.overallDamage || 0) / 100,
        elementalMultipliers,
        statusDefinitions: { ...DAMAGE_STATUS_DEFINITIONS, ...Object.fromEntries(NON_DAMAGE_STATUS_DEFINITIONS.map(status => [status.id, status])) },
        stickyStacks: count("Sticky")
      });
      const damageSources = calculation.damageSources.map(source => {
        const exclusionKey = source.exclusionKey || source.id;
        return { ...source, exclusionKey, excluded: source.excluded === true || excludedKeys.has(exclusionKey) };
      });
      const combinedTotalDps = damageSources.filter(source => !source.excluded)
        .reduce((sum, source) => sum + source.damage.totalDps, 0);
      return { ...sourceModel, ...calculation, damageSources, combinedTotalDps, criticalChancePercent, criticalDamagePercent: Number(stats.criticalDamage || 0) };
    }

    function updateCombinedDpsSummary(value, visible = true) {
      $("#combined-dps-panel").hidden = !visible;
      document.querySelector(".left-rail").classList.toggle("combined-dps-hidden", !visible);
      const summary = $("#combined-dps-summary");
      const combinedDps = Number.isFinite(Number(value)) ? Number(value) : 0;
      summary.textContent = combinedDps.toFixed(2);
      summary.dataset.exactValue = String(combinedDps);
    }

    function renderUnifiedCalculations(options = {}) {
      const { render = true } = options;

          updateCombinedDpsSummary(0, false);

      updateCombinedDpsSummary(model.combinedTotalDps);

      const number = value => Number(value).toFixed(2);

      const hasSourceMultiplier = model.damageSources.some(source => !source.isStatusEffect && Math.abs(source.damage.sourceMultiplier - 1) > .0001);
      const hasMultipleProjectiles = model.attackSources.some(source => source.hitsPerActivation > 1);
      const hasNonProjectileHits = model.attackSources.some(source => source.hitsPerActivation > 1 && source.instanceCountKind === "hits");
      const sourceStatusLines = source => [
        ...source.statuses.map(status => `${status.name || model.statuses.find(item => item.id === status.id)?.name || status.id} chance: ${percent(status.chance)} per instance`),
        ...(source.unknownStatuses || []).map(status => `${status.name || status.id} chance: UNKNOWN`)
      ];
      const sourceFormula = source => [
        source.name,
        `${source.element[0].toUpperCase()}${source.element.slice(1)} ¶ْ Base ${source.baseDamage}`,
        `Crit: ${source.canCrit ? "Yes" : "No"}`,
        ...(source.projectiles > 1 ? [`Projectiles: ${source.projectiles}`] : []),
        ...sourceStatusLines(source)
      ].join("\n");
      const rateFormula = source => {
        if (source.rateCalculation) return source.rateCalculation;
        if (source.rateInterval > 0) return `1 اْ ${number(source.rateInterval)}s ${source.rateIntervalLabel || "interval"} = ${number(source.damage.activationRate)} activations/s`;
        if (source.isStatusEffect) return `1 اْ ${number(1 / source.damage.activationRate)}s tick interval = ${number(source.damage.activationRate)} activations/s`;
        if (source.trigger?.type === "onCrit") {
          return `${number(model.criticalHitsPerSecond)} crits/s = ${number(source.damage.activationRate)} activations/s`;
        }
        if (Number.isFinite(source.baseActivationRate)) {
          const factors = [
            `${number(source.baseActivationRate)} base activations/s`,
            ...(source.rateMultipliers || []).map(factor => `ا- x${number(factor.value)} ${factor.label}`)
          ];
          return `${factors.join(" ")} = ${number(source.damage.activationRate)} activations/s`;
        }
        if (source.trigger?.type === "primaryActivation") return `Primary activation rate = ${number(source.damage.activationRate)} activations/s`;
        if (source.trigger?.type === "cooldown") return `Cooldown trigger rate = ${number(source.damage.activationRate)} activations/s`;
        if (source.trigger?.type === "sourceActivation") return `Source activation rate = ${number(source.damage.activationRate)} activations/s`;
        return `Activation rate = ${number(source.damage.activationRate)} activations/s`;
      };
      const averageDamageFormula = source => {
        const hits = source.hitsPerActivation;

        if (!source.canCrit) return `Non-crit per hit: ${source.damage.nonCriticalDamage}\n${number(source.damage.averageDamagePerHit)} average per hit ا- ${hits} ${hitLabel} = ${number(source.damage.averageDamage)}`;
        return `Non-crit per hit: ${source.damage.nonCriticalDamage}\nCrit per hit: ${source.damage.criticalDamage}\nAverage per hit: ${source.damage.nonCriticalDamage} ا- ${number((1 - model.context.criticalChance) * 100)}% + ${source.damage.criticalDamage} ا- ${number(model.context.criticalChance * 100)}% = ${number(source.damage.averageDamagePerHit)}\n${number(source.damage.averageDamagePerHit)} ا- ${hits} ${hitLabel} = ${number(source.damage.averageDamage)}`;
      };
      const rows = [
        { key: "base", label: "Base Damage", value: source => String(source.baseDamage), exact: source => source.baseDamage, formula: source => source.baseDamageFormula || `Base damage per instance = ${source.baseDamage}`, damageValue: true },
