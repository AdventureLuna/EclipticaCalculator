<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecliptica Build Forge</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f2ff;
      --muted: #ad9ebd;
      --panel: rgba(18, 7, 31, .86);
      --panel-2: rgba(35, 14, 55, .82);
      --class-rgb: 255, 0, 244;
      --class-deep: #170319;
      --class-logo: url("pictures/Class7.png");
      --line: rgba(var(--class-rgb), .19);
      --accent: rgb(var(--class-rgb));
      --physical: #ff5b6e;
      --fire: #ff612f;
      --frost: #42cfff;
      --electric: #ffe31f;
      --luminous: #dbef71;
      --shadow: #b83cff;
      --poison: #ff3fc8;
      --positive: #8ef6b1;
      --negative: #ff8b9c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 11% 18%, rgba(var(--class-rgb), .31), transparent 31rem),
        radial-gradient(circle at 84% 75%, rgba(var(--class-rgb), .17), transparent 38rem),
        linear-gradient(145deg, var(--class-deep), #07030b 66%, var(--class-deep));
      background-attachment: fixed;
    }

    body[data-class="Spellsword"] { --class-rgb: 255, 20, 28; --class-deep: #1c0307; --class-logo: url("pictures/Class1.png"); }
    body[data-class="Twinmage"] { --class-rgb: 0, 204, 24; --class-deep: #031a0a; --class-logo: url("pictures/Class2.png"); }
    body[data-class="Gunmancer"] { --class-rgb: 191, 207, 229; --class-deep: #0a0e16; --class-logo: url("pictures/Class3.png"); }
    body[data-class="Fistmage"] { --class-rgb: 255, 235, 0; --class-deep: #1b1700; --class-logo: url("pictures/Class4.png"); }
    body[data-class="Spellhammer"] { --class-rgb: 255, 126, 0; --class-deep: #211003; --class-logo: url("pictures/Class5.png"); }
    body[data-class="Shield Mage"] { --class-rgb: 0, 229, 239; --class-deep: #021b20; --class-logo: url("pictures/Class6.png"); }
    body[data-class="Thaumaturge"] { --class-rgb: 255, 0, 244; --class-deep: #1c031d; --class-logo: url("pictures/Class7.png"); }
    body[data-class="Nekomancer"] { --class-rgb: 139, 28, 255; --class-deep: #120326; --class-logo: url("pictures/Class8.png"); }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      right: -5vw;
      bottom: -16vh;
      width: min(68vw, 920px);
      height: min(82vh, 920px);
      pointer-events: none;
      opacity: .075;
      background: var(--class-logo) right bottom / contain no-repeat;
      filter: saturate(1.25);
    }

    button, input, select { font: inherit; }
    button { color: inherit; }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: rgb(var(--class-rgb));
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 2rem);
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .class-logo {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      object-fit: contain;
      filter: drop-shadow(0 7px 16px rgba(var(--class-rgb), .28));
    }

    .reset, .clear-search {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.045);
      padding: 9px 13px;
      cursor: pointer;
    }

    .reset:hover, .clear-search:hover { border-color: rgba(217, 164, 255, .55); }

    .top-actions {
      display: flex;
      align-items: end;
      gap: 9px;
    }

    .class-picker {
      display: grid;
      gap: 4px;
      color: #bdaac9;
      font-size: .61rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .class-picker select {
      min-width: 170px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: rgba(12, 4, 20, .82);
      padding: 8px 10px;
      text-transform: none;
    }

    .class-picker select:focus { border-color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: minmax(310px, 390px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(var(--class-rgb), .105), var(--panel));
      box-shadow: 0 24px 70px rgba(0,0,0,.32);
      backdrop-filter: blur(14px);
    }

    .stats-panel {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 20px;
    }

    .panel-title {
      margin: 0;
      font-size: .78rem;
      color: #cbb7da;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .stat-list {
      margin-top: 15px;
      display: grid;
      gap: 3px;
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-stretch: condensed;
      font-size: .94rem;
      font-weight: 800;
      font-style: normal;
      text-transform: none;
    }

    .stat-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: baseline;
      min-height: 20px;
      padding: 1px 5px;
      border-radius: 5px;
      cursor: help;
    }

    .stat-row.element { padding-left: 28px; }
    .stat-row.changed { background: rgba(255,255,255,.045); }
    .stat-row .value { color: #fff; white-space: nowrap; }
    .stat-row .delta { margin-left: 4px; font-size: .7rem; font-style: normal; }
    .delta.up { color: var(--positive); }
    .delta.down { color: var(--negative); }
    .stat-gap { height: 13px; }
    .physical { color: var(--physical); }
    .fire { color: var(--fire); }
    .frost { color: var(--frost); }
    .electric { color: var(--electric); }
    .luminous { color: var(--luminous); }
    .shadow { color: var(--shadow); }
    .poison { color: var(--poison); }

    .stat-tooltip {
      position: fixed;
      z-index: 1000;
      display: none;
      width: min(650px, calc(100vw - 28px));
      max-height: min(440px, calc(100vh - 28px));
      overflow: auto;
      border: 1px solid rgba(221, 177, 255, .58);
      border-radius: 16px;
      color: var(--ink);
      background: radial-gradient(circle at 12% 0, rgba(184, 91, 255, .18), transparent 38%), linear-gradient(145deg, rgba(27, 14, 37, .98), rgba(8, 8, 13, .98));
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 22px 65px rgba(0,0,0,.68), 0 0 24px rgba(183, 91, 255, .14);
      padding: 14px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: .75rem;
      font-style: normal;
      text-transform: none;
      backdrop-filter: blur(16px);
      pointer-events: none;
    }

    .stat-tooltip.visible { display: block; }
    .stat-tooltip h3 { margin: 0 0 11px; color: #f0ceff; font-size: .9rem; letter-spacing: .02em; }
    .stat-tooltip table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .stat-tooltip th {
      color: #d7b8e8;
      font-size: .62rem;
      letter-spacing: .09em;
      text-align: left;
      text-transform: uppercase;
    }
    .stat-tooltip th, .stat-tooltip td {
      padding: 6px 7px;
      border-bottom: 1px solid rgba(224, 198, 255, .11);
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    .stat-tooltip th:nth-child(1) { width: 16%; }
    .stat-tooltip th:nth-child(2) { width: 16%; }
    .stat-tooltip th:nth-child(3) { width: 27%; }
    .stat-tooltip th:nth-child(4) { width: 41%; }
    .stat-tooltip .source-value { color: #fff; font-weight: 800; white-space: nowrap; }
    .stat-tooltip .source-type { color: #d3a8f1; }
    .stat-tooltip tbody tr:hover { background: rgba(215, 151, 255, .07); }
    .cap-calculation {
      margin-top: 10px;
      border: 1px solid rgba(255, 222, 73, .22);
      border-radius: 9px;
      color: #d8cde0;
      background: rgba(255, 211, 45, .055);
      padding: 8px 9px;
      line-height: 1.5;
    }
    .cap-calculation strong { color: #ffe66c; }
    .cap-formula { color: #f6effa; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    .explorer {
      padding: 18px;
      min-width: 0;
    }

    .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 18px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .tab-button { border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: rgba(255,255,255,.03); padding: 9px 13px; cursor: pointer; }
    .tab-button[aria-selected="true"] { border-color: rgba(var(--class-rgb), .55); color: var(--ink); background: rgba(var(--class-rgb), .14); }
    .tab-pane[hidden] { display: none; }
    .placeholder-pane { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .configuration-empty { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .twinmage-configuration { display: grid; gap: 24px; }
    .gunmancer-configuration { display: grid; gap: 22px; }
    .gunmancer-configuration-note { margin: 0; border: 1px solid rgba(var(--class-rgb), .28); border-radius: 10px; color: var(--muted); background: rgba(var(--class-rgb), .06); padding: 10px 12px; font-size: .72rem; line-height: 1.5; }
    .gunmancer-configuration-note strong { color: var(--ink); }
    .ability-picker { border: 0; margin: 0; padding: 0; }
    .ability-picker legend { width: 100%; margin-bottom: 10px; color: var(--ink); }
    .ability-picker-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
    .ability-picker-title { font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .ability-picker-subtitle { color: var(--muted); font-size: .68rem; }
    .ability-options { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 10px; }
    .ability-option { position: relative; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; min-width: 0; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.025); padding: 9px; cursor: pointer; transition: border-color .15s, background .15s, color .15s, transform .15s; }
    .ability-option:hover { border-color: rgba(var(--class-rgb), .45); color: var(--ink); transform: translateY(-1px); }
    .ability-option:has(input:focus-visible) { outline: 2px solid rgba(var(--class-rgb), .8); outline-offset: 2px; }
    .ability-option:has(input:checked) { border-color: rgba(var(--class-rgb), .8); color: var(--ink); background: rgba(var(--class-rgb), .16); box-shadow: inset 0 0 0 1px rgba(var(--class-rgb), .3), 0 0 18px rgba(var(--class-rgb), .13); }
    .ability-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .ability-icon { width: 58px; height: 58px; display: block; object-fit: contain; border-radius: 9px; background: rgba(0,0,0,.2); }
    .ability-option:has(input:checked) .ability-icon { filter: saturate(1.16) drop-shadow(0 0 7px rgba(var(--class-rgb), .4)); }
    .ability-copy { min-width: 0; }
    .ability-name { display: block; overflow: hidden; color: inherit; font-size: .76rem; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
    .ability-effect { display: block; margin-top: 4px; color: var(--muted); font-size: .65rem; line-height: 1.35; }
    .airblast-options { display: grid; grid-template-columns: repeat(3, minmax(130px, 1fr)); gap: 8px; }
    .airblast-option { position: relative; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: rgba(255,255,255,.025); padding: 8px 9px; font-size: .7rem; cursor: pointer; }
    .airblast-option:has(input:checked) { border-color: rgba(var(--class-rgb), .75); color: var(--ink); background: rgba(var(--class-rgb), .13); }
    .airblast-option input { accent-color: rgb(var(--class-rgb)); }
    .gunmancer-unknown { color: #ffd36a; font-weight: 850; }
    .gunmancer-source-note { color: var(--muted); font-size: .66rem; line-height: 1.4; }
    .gunmancer-dps-picker { border: 1px solid rgba(var(--class-rgb), .28); border-radius: 10px; margin: 0; padding: 10px 12px 12px; }
    .gunmancer-dps-picker legend { padding: 0 5px; color: var(--ink); font-size: .78rem; font-weight: 850; }
    .gunmancer-dps-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .gunmancer-dps-option { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: rgba(255,255,255,.025); padding: 8px 9px; font-size: .7rem; cursor: pointer; }
    .gunmancer-dps-option:has(input:checked) { border-color: rgba(var(--class-rgb), .75); color: var(--ink); background: rgba(var(--class-rgb), .13); }
    .gunmancer-dps-option:has(input:focus-visible) { outline: 2px solid rgba(var(--class-rgb), .8); outline-offset: 2px; }
    .gunmancer-dps-option input { width: 16px; height: 16px; margin: 0; accent-color: rgb(var(--class-rgb)); }
    .gunmancer-dps-help { margin: 8px 0 0; color: var(--muted); font-size: .65rem; line-height: 1.4; }
    .element-picker { border: 0; margin: 0; padding: 0; }
    .element-picker legend { width: 100%; margin-bottom: 10px; color: var(--ink); }
    .element-picker-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .element-picker-title { font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .damage-calculation-toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .72rem; font-weight: 700; text-transform: none; letter-spacing: 0; cursor: pointer; }
    .damage-calculation-toggle input { width: 16px; height: 16px; margin: 0; accent-color: rgb(var(--class-rgb)); cursor: pointer; }
    .element-options { display: grid; grid-template-columns: repeat(6, minmax(76px, 1fr)); gap: 10px; }
    .element-option { position: relative; display: grid; justify-items: center; gap: 7px; min-width: 0; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.025); padding: 11px 7px 9px; cursor: pointer; transition: border-color .15s, background .15s, color .15s, transform .15s; }
    .element-option:hover { border-color: rgba(var(--class-rgb), .45); color: var(--ink); transform: translateY(-1px); }
    .element-option:has(input:focus-visible) { outline: 2px solid rgba(var(--class-rgb), .8); outline-offset: 2px; }
    .element-option:has(input:checked) { border-color: rgba(var(--class-rgb), .8); color: var(--ink); background: rgba(var(--class-rgb), .16); box-shadow: inset 0 0 0 1px rgba(var(--class-rgb), .3), 0 0 18px rgba(var(--class-rgb), .13); }
    .element-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .element-icon { width: 64px; height: 64px; display: block; object-fit: contain; filter: saturate(.88); }
    .element-option:has(input:checked) .element-icon { filter: saturate(1.16) drop-shadow(0 0 7px rgba(var(--class-rgb), .4)); }
    .element-name { overflow: hidden; max-width: 100%; font-size: .72rem; font-weight: 800; text-transform: uppercase; text-overflow: ellipsis; }
    .calculation-empty { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .calculation-stack { display: grid; gap: 12px; align-items: start; justify-items: start; }
    .calculation-secondary { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; max-width: 100%; }
    .damage-calculation { width: 100%; }
    .damage-table-wrap { width: max-content; max-width: 100%; overflow-x: auto; border: 1px solid rgba(var(--class-rgb), .58); border-radius: 12px; background: linear-gradient(135deg, rgba(255,255,255,.025), rgba(0,0,0,.22)); box-shadow: inset 0 0 18px rgba(0,0,0,.22), 0 0 12px rgba(var(--class-rgb), .08); }
    .damage-table { width: auto; min-width: 0; border-collapse: collapse; table-layout: fixed; }
    .damage-table .damage-label-col { width: 120px; }
    .damage-table .damage-data-col { width: 72px; }
    .damage-table th, .damage-table td { border-right: 1px solid rgba(255,255,255,.13); border-bottom: 1px solid rgba(255,255,255,.13); padding: 6px 9px; }
    .damage-table tr > :last-child { border-right: 0; }
    .damage-table tbody tr:last-child > * { border-bottom: 0; }
    .damage-table thead th { height: 42px; background: rgba(0,0,0,.18); }
    .damage-table .damage-label { width: 120px; min-width: 120px; color: #e8e8ec; font-size: .66rem; font-weight: 650; text-align: left; white-space: nowrap; }
    .damage-column { --damage-color: #d8dde5; width: 72px; min-width: 72px; color: var(--damage-color); text-align: center; }
    .damage-column[data-element="fire"] { --damage-color: #ff8717; }
    .damage-column[data-element="frost"] { --damage-color: #59b8ff; }
    .damage-column[data-element="lightning"] { --damage-color: #ffe45e; }
    .damage-column[data-element="electric"] { --damage-color: var(--electric); }
    .damage-column[data-element="physical"] { --damage-color: var(--physical); }
    .damage-column[data-element="luminous"] { --damage-color: #fff3a0; }
    .damage-column[data-element="shadow"] { --damage-color: #c77dff; }
    .damage-column[data-element="burning"] { --damage-color: #ff8717; }
    .damage-column[data-element="bleeding"] { --damage-color: var(--physical); }
    .damage-column.status-effect-column { background: rgba(255, 135, 23, .035); }
    .damage-column.status-group-start { border-left: 3px solid rgba(var(--class-rgb), .72); }
    .damage-hand-position { display: block; margin-bottom: 2px; color: #9d93a4; font-size: .46rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }

    .damage-value { color: var(--damage-color); font-size: .72rem; font-variant-numeric: tabular-nums; font-weight: 800; }
    .damage-value-unknown { color: #aaa6af; font-size: .82rem; }
    .damage-section-break > * { border-top: 3px solid rgba(255,255,255,.11); }
    .damage-total-row .damage-label, .damage-total-row .damage-value { font-size: .93rem; font-weight: 950; }
    .damage-combined-row > * { border-top: 4px solid rgba(var(--class-rgb), .5); border-bottom: 0; background: linear-gradient(90deg, rgba(var(--class-rgb), .14), rgba(var(--class-rgb), .045)); padding-top: 10px; padding-bottom: 10px; }
    .damage-combined-label { color: #f1f3f4; font-size: .78rem; font-weight: 950; letter-spacing: .035em; text-align: left; text-transform: uppercase; }
    .damage-combined-value { display: inline-block; min-width: 82px; color: rgb(var(--class-rgb)); font-size: 1.34rem; font-variant-numeric: tabular-nums; font-weight: 950; line-height: 1; text-shadow: 0 0 14px rgba(var(--class-rgb), .42); }
    .crit-table-wrap { width: max-content; max-width: 100%; overflow-x: auto; border: 1px soli…47490 tokens truncated…gUptime, formula: bleedingRawUptime > 1 ? `${twoDecimals(bleedingDuration)}s اْ ${twoDecimals(bleedingInterval)}s = ${twoDecimals(bleedingRawUptime * 100)}% ƒإ' capped at 100%` : `${twoDecimals(bleedingDuration)}s اْ ${twoDecimals(bleedingInterval)}s = ${twoDecimals(bleedingUptime * 100)}%`, refs: ["calc:bleeding:duration", "calc:bleeding:interval"] }
      ];
      const nonDamageStatusRows = status => {
        const rateTerms = status.sources.map(hand => `${twoDecimals(hand.damage.instancesPerSecond)} ا- (${twoDecimals(hand.baseStatusChances[status.id] * 100)}% اْ ${twoDecimals(attackSpeedMultiplier * 100)}% AS)`);
        return [
          { key: `${status.id}:interval`, label: "Average time between applications", value: `${twoDecimals(status.applicationInterval)} s`, exact: status.applicationInterval, formula: `1 اْ ((${rateTerms.join(" + ")}) اْ ${status.bossApplicationPenalty}) = ${twoDecimals(status.applicationInterval)}s`, refs: ["stat:attackSpeed", ...status.sources.map(hand => `calc:${damageKey(hand, "rate")}`)] },
          { key: `${status.id}:stacks`, label: "Stacks per application", value: "?", exact: "unknown", formula: "Not configured yet", refs: [], unknown: true },
          { key: `${status.id}:uptime`, label: "Uptime", value: "?", exact: "unknown", formula: "Not configured yet", refs: [], unknown: true }
        ];
      };

      content.innerHTML = `<div class="calculation-stack">
        <section class="damage-calculation">
          <div class="damage-table-wrap">
            <table class="damage-table ${calculatedHands.length === 1 ? "single-hand" : "dual-hand"}">
              <colgroup><col class="damage-label-col"><col class="damage-data-col" span="${damageColumns.length}"></colgroup>
              <thead><tr><th scope="col"><span class="damage-hand-position">Current build</span></th>${damageColumns.map(hand => `
                <th scope="col" class="damage-column ${hand.isStatusEffect ? "status-effect-column" : ""} ${hand.isStatusGroupStart ? "status-group-start" : ""}" data-element="${hand.element.id}" ${calculationAttributes(`source:${hand.columnKey}`, sourceFormula(hand))} ${sourceUpgradeAttributes(hand)} ${sourceIconAttributes(hand)}>
                  <span class="damage-hand-position">${escapeHtml(hand.position)}</span>
                  <span class="damage-hand-title">${escapeHtml(hand.element.handName)}</span>
                </th>`).join("")}</tr></thead>
              <tbody>${rows.map(row => `<tr class="${row.sectionBreak ? "damage-section-break " : ""}${row.total ? "damage-total-row" : ""}">
                <th scope="row" class="damage-label">${escapeHtml(row.label)}</th>
                ${damageColumns.map(hand => `<td class="damage-column ${hand.isStatusEffect ? "status-effect-column" : ""} ${hand.isStatusGroupStart ? "status-group-start" : ""}" data-element="${hand.element.id}">
                  <span class="damage-value ${row.value(hand) === "-" ? "damage-value-unknown" : ""}" data-exact-value="${escapeHtml(String(row.exact(hand)))}" ${calculationAttributes(damageKey(hand, row.key), row.formula(hand), row.refs(hand))} ${row.damageValue ? damageTypeAttributes(hand) : ""} ${sourceUpgradeAttributes(hand)} ${sourceIconAttributes(hand)}>${escapeHtml(row.value(hand))}</span>
                </td>`).join("")}
              </tr>`).join("")}</tbody>
              <tfoot><tr class="damage-combined-row">
                <th scope="row" class="damage-combined-label">Combined DPS</th>
                <td colspan="${damageColumns.length}" class="damage-column">
                  <span class="damage-combined-value" data-exact-value="${escapeHtml(String(combinedTotalDps))}" data-calculation-breakdown="${escapeHtml(JSON.stringify(combinedDpsBreakdown))}" ${calculationAttributes("damage:combined:total-dps", `${damageColumns.map(hand => twoDecimals(hand.damage.totalDps)).join(" + ")} = ${twoDecimals(combinedTotalDps)}`, damageColumns.map(hand => `calc:${damageKey(hand, "total-dps")}`))}>${twoDecimals(combinedTotalDps)}</span>
                </td>
              </tr></tfoot>
            </table>
          </div>
        </section>
        <div class="calculation-secondary">
          <section class="crit-table-wrap">
            <table class="crit-table">
              <thead><tr><th colspan="2">Critical hits</th></tr></thead>
              <tbody>${criticalRows.map(row => `<tr>
                <th scope="row" class="crit-label">${escapeHtml(row.label)}</th>
                <td class="crit-value" data-exact-value="${escapeHtml(String(row.exact))}" ${calculationAttributes(row.key, row.formula, row.refs)}>${escapeHtml(row.value)}</td>
              </tr>`).join("")}</tbody>
            </table>
          </section>
          ${burningHands.length ? `<section class="status-table-wrap" data-status="burning">
            <table class="status-table">
              <thead><tr><th colspan="2">Status: Burning</th></tr></thead>
              <tbody>${burningRows.map(row => `<tr>
                <th scope="row" class="status-label">${escapeHtml(row.label)}</th>
                <td class="status-value" data-exact-value="${escapeHtml(String(row.exact))}" ${calculationAttributes(row.key, row.formula, row.refs)}>${row.valueHtml || escapeHtml(row.value)}</td>
              </tr>`).join("")}</tbody>
            </table>
          </section>` : ""}
          ${bleedingHands.length ? `<section class="status-table-wrap" data-status="bleeding">
            <table class="status-table">
              <thead><tr><th colspan="2">Status: Bleeding</th></tr></thead>
              <tbody>${bleedingRows.map(row => `<tr>
                <th scope="row" class="status-label">${escapeHtml(row.label)}</th>
                <td class="status-value" data-exact-value="${escapeHtml(String(row.exact))}" ${calculationAttributes(row.key, row.formula, row.refs)}>${row.valueHtml || escapeHtml(row.value)}</td>
              </tr>`).join("")}</tbody>
            </table>
          </section>` : ""}
          ${nonDamageStatuses.map(status => {
            const statusRows = nonDamageStatusRows(status);
            return `<section class="status-table-wrap" data-status="${escapeHtml(status.id)}">
              <table class="status-table">
                <thead><tr><th colspan="2">Status: ${escapeHtml(status.name)}</th></tr></thead>
                <tbody>${statusRows.map(row => `<tr>
                  <th scope="row" class="status-label">${escapeHtml(row.label)}</th>
                  <td class="status-value ${row.unknown ? "status-value-unknown" : ""}" data-exact-value="${escapeHtml(String(row.exact))}" ${calculationAttributes(row.key, row.formula, row.refs)}>${escapeHtml(row.value)}</td>
                </tr>`).join("")}</tbody>
                ${status.note ? `<tfoot><tr><td class="status-note" colspan="2">${escapeHtml(status.note)}</td></tr></tfoot>` : ""}
              </table>
            </section>`;
          }).join("")}
        </div>
      </div>`;
    }

    function renderRunes() {
      const curseOptions = `<option value="">No curse selected</option>${CURSES.map(curse =>
        `<option value="${curse.id}">Runic Curse: ${escapeHtml(curse.name)}</option>`).join("")}`;
      $("#rune-slots").innerHTML = RUNE_SLOTS.map((slot, index) => {
        const rune = RUNES.find(item => item.id === buildOptions.runes[index]);
        return `<div class="rune-slot ${activeRuneSlot === index ? "active" : ""}" data-slot="${index}" role="button" tabindex="0">
          <span class="slot-name">${slot}</span>
          ${rune ? `<button class="remove-rune" type="button" data-remove-rune="${index}" aria-label="Remove ${escapeHtml(rune.name)} from ${slot}">ا-</button>` : ""}
          ${rune ? `<img class="slot-rune-art" src="pictures/${encodeURIComponent(rune.image)}" alt="">` : `<span class="slot-rune-empty" aria-hidden="true">ƒ-خ</span>`}
          <span class="slot-rune">${rune ? escapeHtml(rune.name) : "Choose a runeƒ?ف"}</span>
          <div class="curse-row">${buildOptions.curses[index] ? `<img class="curse-art" src="pictures/Runic_Curse.png" alt="Runic Curse">` : ""}<select class="curse-select" data-curse-slot="${index}" aria-label="${slot} Runic Curse">${curseOptions}</select></div>
        </div>`;
      }).join("");
      buildOptions.curses.forEach((curse, index) => { $(`[data-curse-slot="${index}"]`).value = curse || ""; });
      $("#rune-catalog").innerHTML = RUNES.map(item => {
        const selectedSlot = buildOptions.runes.indexOf(item.id);
        return `<article class="upgrade rune-card ${selectedSlot >= 0 ? "selected" : ""}" data-id="${item.id}">
          ${selectedSlot >= 0 ? `<span class="count">${selectedSlot + 1}</span>` : ""}
          <div class="item-placeholder"><img class="item-art" src="pictures/${encodeURIComponent(item.image)}" alt="${escapeHtml(item.name)}"></div>
          <div class="upgrade-copy"><h3 class="upgrade-name">${escapeHtml(item.name)}</h3>
            <div class="meta">Rune</div><p class="effect">${escapeHtml(item.effect)}</p></div>
        </article>`;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function render() {
      renderStats();
      renderConfiguration();
      renderCalculations();
      renderPicked();
      renderCatalog();
      renderDpsRanking();
      renderArtifacts();
      renderRunes();
      updateShareWidget();
    }

    $("#stats").addEventListener("mouseover", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row) showStatTooltip(row);
    });

    $("#stats").addEventListener("mouseout", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row && !row.contains(event.relatedTarget)) hideStatTooltip();
    });

    $("#stats").addEventListener("focusin", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row) showStatTooltip(row);
    });

    $("#stats").addEventListener("focusout", hideStatTooltip);

    $("#calculation-content").addEventListener("mouseover", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value) showCalculationTooltip(value, event.clientX, event.clientY);
    });

    $("#calculation-content").addEventListener("mousemove", event => {
      if (event.target.closest("[data-calculation-formula]")) positionCalculationTooltip(event.clientX, event.clientY);
    });

    $("#calculation-content").addEventListener("mouseout", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value && !value.contains(event.relatedTarget)) hideCalculationTooltip();
    });

    $("#calculation-content").addEventListener("focusin", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value) showCalculationTooltip(value);
    });

    $("#calculation-content").addEventListener("focusout", hideCalculationTooltip);

    $("#catalog").addEventListener("click", event => {
      const card = event.target.closest(".upgrade");
      const upgrade = card && upgradeIndex.get(card.dataset.id);
      if (upgrade && isUpgradeConditionallyAvailable(upgrade)) setCount(card.dataset.id, count(card.dataset.id) + 1);
    });

    $("#dps-ranking-list").addEventListener("click", event => {
      const row = event.target.closest("[data-dps-upgrade-id]");
      if (row) setCount(row.dataset.dpsUpgradeId, count(row.dataset.dpsUpgradeId) + 1);
    });

    $("#dps-ranking-toggle").addEventListener("click", () => {
      dpsRankingVisible = !dpsRankingVisible;
      renderDpsRanking();
    });

    $("#catalog").addEventListener("contextmenu", event => {
      const card = event.target.closest(".upgrade");
      const upgrade = card && upgradeIndex.get(card.dataset.id);
      if (!upgrade || !isUpgradeConditionallyAvailable(upgrade)) return;
      event.preventDefault();
      setCount(card.dataset.id, count(card.dataset.id) - 1);
    });

    $("#picked-list").addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;
      setCount(button.dataset.id, count(button.dataset.id) + (button.dataset.action === "plus" ? 1 : -1));
    });

    ["search", "family-filter", "rarity-filter"].forEach(id => {
      $(`#${id}`).addEventListener(id === "search" ? "input" : "change", renderCatalog);
    });

    document.querySelector(".explorer").addEventListener("keydown", event => {
      const search = $("#search");
      if (event.code !== "Space" || event.target === search || event.defaultPrevented) return;
      event.preventDefault();
      if (search.value) {
        search.value = "";
        renderCatalog();
      }
      search.focus();
    });

    document.querySelector(".tabs").addEventListener("click", event => {
      const button = event.target.closest("[data-tab]");
      if (!button) return;
      document.querySelectorAll("[data-tab]").forEach(tab => tab.setAttribute("aria-selected", String(tab === button)));
      document.querySelectorAll(".tab-pane").forEach(pane => { pane.hidden = pane.id !== `tab-${button.dataset.tab}`; });
    });

    $("#configuration-content").addEventListener("change", event => {
      const gunmancerDpsToggle = event.target.closest('input[type="checkbox"][name="gunmancer-dps"]');
      if (gunmancerDpsToggle) {
        const group = gunmancerDpsToggle.value;
        if (group !== "primary" && group !== "secondary") return;
        if (gunmancerDpsToggle.checked) {
          buildOptions.gunmancerPrimaryDamage = group === "primary";
          buildOptions.gunmancerSecondaryDamage = group === "secondary";
        } else {
          gunmancerDpsToggle.checked = true;
        }
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderCatalog();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const damageToggle = event.target.closest('input[type="checkbox"][name$="-damage"]');
      if (damageToggle) {
        if (damageToggle.name === "twinmage-primary-damage") buildOptions.twinmagePrimaryDamage = damageToggle.checked;
        else if (damageToggle.name === "twinmage-secondary-damage") buildOptions.twinmageSecondaryDamage = damageToggle.checked;
        if (!buildOptions.twinmagePrimaryDamage && !buildOptions.twinmageSecondaryDamage) {
          if (damageToggle.name === "twinmage-primary-damage") buildOptions.twinmageSecondaryDamage = true;
          else buildOptions.twinmagePrimaryDamage = true;
        }
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderCatalog();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const gunmancerChoice = event.target.closest('input[type="radio"][name^="gunmancer-"]');
      if (gunmancerChoice) {
        if (gunmancerChoice.name === "gunmancer-primary" && GUNMANCER_ABILITIES.primary.some(ability => ability.id === gunmancerChoice.value)) buildOptions.gunmancerPrimary = gunmancerChoice.value;
        else if (gunmancerChoice.name === "gunmancer-secondary" && GUNMANCER_ABILITIES.secondary.some(ability => ability.id === gunmancerChoice.value)) buildOptions.gunmancerSecondary = gunmancerChoice.value;
        else if (gunmancerChoice.name === "gunmancer-airblast" && ["none", "primary", "secondary"].includes(gunmancerChoice.value)) buildOptions.gunmancerAirblastTarget = gunmancerChoice.value;
        else return;
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderCatalog();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const choice = event.target.closest('input[type="radio"][name^="twinmage-"]');
      if (!choice || !TWINMAGE_ELEMENTS.some(element => element.id === choice.value)) return;
      if (choice.name === "twinmage-primary") buildOptions.twinmagePrimary = choice.value;
      else if (choice.name === "twinmage-secondary") buildOptions.twinmageSecondary = choice.value;
      saveBuildOptions();
      renderConfiguration();
      renderCalculations();
      renderCatalog();
      renderDpsRanking();
      updateShareWidget();
    });

    $("#artifact-catalog").addEventListener("click", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      buildOptions.artifacts[card.dataset.id] = Math.min(100, (buildOptions.artifacts[card.dataset.id] || 0) + 1);
      saveBuildOptions();
      render();
    });
    $("#artifact-catalog").addEventListener("contextmenu", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      event.preventDefault();
      const next = (buildOptions.artifacts[card.dataset.id] || 0) - 1;
      if (next > 0) buildOptions.artifacts[card.dataset.id] = next;
      else delete buildOptions.artifacts[card.dataset.id];
      saveBuildOptions();
      render();
    });

    $("#rune-slots").addEventListener("click", event => {
      if (event.target.closest("select")) return;
      const remove = event.target.closest("[data-remove-rune]");
      if (remove) {
        activeRuneSlot = Number(remove.dataset.removeRune);
        buildOptions.runes[activeRuneSlot] = null;
        saveBuildOptions();
        render();
        return;
      }
      const slot = event.target.closest("[data-slot]");
      if (!slot) return;
      activeRuneSlot = Number(slot.dataset.slot);
      renderRunes();
    });
    $("#rune-slots").addEventListener("change", event => {
      const select = event.target.closest("[data-curse-slot]");
      if (!select) return;
      buildOptions.curses[Number(select.dataset.curseSlot)] = select.value || null;
      saveBuildOptions();
      render();
    });
    $("#rune-catalog").addEventListener("click", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      const existing = buildOptions.runes.indexOf(card.dataset.id);
      if (existing >= 0) {
        buildOptions.runes[existing] = null;
        activeRuneSlot = existing;
      } else {
        buildOptions.runes[activeRuneSlot] = card.dataset.id;
        const next = buildOptions.runes.findIndex((id, index) => !id && index > activeRuneSlot);
        const wrapped = buildOptions.runes.findIndex(id => !id);
        if (next >= 0 || wrapped >= 0) activeRuneSlot = next >= 0 ? next : wrapped;
      }
      saveBuildOptions();
      render();
    });

    $("#class-select").addEventListener("change", event => {
      selectedClass = CLASS_FAMILIES.includes(event.target.value) ? event.target.value : "Thaumaturge";
      safeSetStorage("ecliptica-upgrade-explorer-class", selectedClass);
      syncClassUi();
      render();
    });

    $("#reset-build").addEventListener("click", () => {
      Object.keys(counts).forEach(id => delete counts[id]);
      buildOptions.artifacts = {};
      buildOptions.runes = RUNE_SLOTS.map(() => null);
      buildOptions.curses = RUNE_SLOTS.map(() => null);
      buildOptions.twinmagePrimary = "fire";
      buildOptions.twinmageSecondary = "lightning";
      buildOptions.twinmagePrimaryDamage = true;
      buildOptions.twinmageSecondaryDamage = true;
      buildOptions.gunmancerPrimary = "va11";
      buildOptions.gunmancerSecondary = "photon";
      buildOptions.gunmancerPrimaryDamage = true;
      buildOptions.gunmancerSecondaryDamage = false;
      buildOptions.gunmancerAirblastTarget = "none";
      activeRuneSlot = 0;
      saveCounts();
      saveBuildOptions();
      render();
    });

    $("#copy-link").addEventListener("click", copyShareUrl);
    window.addEventListener("hashchange", loadBuildFromHash);

    syncClassUi();
    if (new URLSearchParams(location.hash.slice(1)).has("b")) loadBuildFromHash();
    else render();
  </script>
</body>
</html>
