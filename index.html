<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdventureLuna's Ecliptica Build Forge</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f2ff;
      --muted: #ad9ebd;
      --panel: rgba(18, 7, 31, .86);
      --panel-2: rgba(35, 14, 55, .82);
      --class-rgb: 255, 0, 244;
      --class-deep: #170319;
      --class-logo: url("pictures/Class7.png");
      --line: rgba(var(--class-rgb), .19);
      --accent: rgb(var(--class-rgb));
      --physical: #ff5b6e;
      --fire: #ff612f;
      --frost: #42cfff;
      --electric: #ffe31f;
      --luminous: #dbef71;
      --shadow: #b83cff;
      --poison: #ff3fc8;
      --positive: #8ef6b1;
      --negative: #ff8b9c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 11% 18%, rgba(var(--class-rgb), .31), transparent 31rem),
        radial-gradient(circle at 84% 75%, rgba(var(--class-rgb), .17), transparent 38rem),
        linear-gradient(145deg, var(--class-deep), #07030b 66%, var(--class-deep));
      background-attachment: fixed;
    }

    body[data-class="Spellsword"] { --class-rgb: 255, 20, 28; --class-deep: #1c0307; --class-logo: url("pictures/Class1.png"); }
    body[data-class="Twinmage"] { --class-rgb: 0, 204, 24; --class-deep: #031a0a; --class-logo: url("pictures/Class2.png"); }
    body[data-class="Gunmancer"] { --class-rgb: 191, 207, 229; --class-deep: #0a0e16; --class-logo: url("pictures/Class3.png"); }
    body[data-class="Fistmage"] { --class-rgb: 255, 235, 0; --class-deep: #1b1700; --class-logo: url("pictures/Class4.png"); }
    body[data-class="Spellhammer"] { --class-rgb: 255, 126, 0; --class-deep: #211003; --class-logo: url("pictures/Class5.png"); }
    body[data-class="Shield Mage"] { --class-rgb: 0, 229, 239; --class-deep: #021b20; --class-logo: url("pictures/Class6.png"); }
    body[data-class="Thaumaturge"] { --class-rgb: 255, 0, 244; --class-deep: #1c031d; --class-logo: url("pictures/Class7.png"); }
    body[data-class="Nekomancer"] { --class-rgb: 139, 28, 255; --class-deep: #120326; --class-logo: url("pictures/Class8.png"); }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      right: -5vw;
      bottom: -16vh;
      width: min(68vw, 920px);
      height: min(82vh, 920px);
      pointer-events: none;
      opacity: .075;
      background: var(--class-logo) right bottom / contain no-repeat;
      filter: saturate(1.25);
    }

    button, input, select { font: inherit; }
    button { color: inherit; }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: rgb(var(--class-rgb));
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 2rem);
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .class-logo {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      object-fit: contain;
      filter: drop-shadow(0 7px 16px rgba(var(--class-rgb), .28));
    }

    .reset, .clear-search {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.045);
      padding: 9px 13px;
      cursor: pointer;
    }

    .reset:hover, .clear-search:hover { border-color: rgba(217, 164, 255, .55); }

    .top-actions {
      display: flex;
      align-items: end;
      gap: 9px;
    }

    .class-picker {
      display: grid;
      gap: 4px;
      color: #bdaac9;
      font-size: .61rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .class-picker select {
      min-width: 170px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: rgba(12, 4, 20, .82);
      padding: 8px 10px;
      text-transform: none;
    }

    .class-picker select:focus { border-color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: minmax(310px, 390px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(var(--class-rgb), .105), var(--panel));
      box-shadow: 0 24px 70px rgba(0,0,0,.32);
      backdrop-filter: blur(14px);
    }

    .left-rail {
      position: sticky;
      top: 18px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      max-height: calc(100vh - 36px);
    }
    .left-rail.combined-dps-hidden { grid-template-rows: minmax(0, 1fr); }

    .combined-dps-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 20px;
      border-color: rgba(var(--class-rgb), .45);
    }
    .combined-dps-panel[hidden] { display: none; }

    .combined-dps-panel .panel-title { color: var(--muted); }
    .combined-dps-summary {
      color: rgb(var(--class-rgb));
      font-size: 1.55rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .stats-panel {
      min-height: 0;
      overflow: auto;
      padding: 20px;
    }

    .panel-title {
      margin: 0;
      font-size: .78rem;
      color: #cbb7da;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .stat-list {
      margin-top: 15px;
      display: grid;
      gap: 3px;
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-stretch: condensed;
      font-size: .94rem;
      font-weight: 800;
      font-style: normal;
      text-transform: none;
    }

    .stat-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: baseline;
      min-height: 20px;
      padding: 1px 5px;
      border-radius: 5px;
      cursor: help;
    }

    .stat-row.element { padding-left: 28px; }
    .stat-row.changed { background: rgba(255,255,255,.045); }
    .stat-row .value { color: #fff; white-space: nowrap; }
    .stat-row .health-regeneration-rate { display: block; margin-top: 1px; color: #aaa8af; font-size: .68rem; font-weight: 650; line-height: 1.05; text-align: right; }
    .stat-row .delta { margin-left: 4px; font-size: .7rem; font-style: normal; }
    .delta.up { color: var(--positive); }
    .delta.down { color: var(--negative); }
    .stat-gap { height: 13px; }
    .physical { color: var(--physical); }
    .fire { color: var(--fire); }
    .frost { color: var(--frost); }
    .electric { color: var(--electric); }
    .luminous { color: var(--luminous); }
    .shadow { color: var(--shadow); }
    .poison { color: var(--poison); }

    .stat-tooltip {
      position: fixed;
      z-index: 1000;
      display: none;
      width: min(650px, calc(100vw - 28px));
      max-height: min(440px, calc(100vh - 28px));
      overflow: auto;
      border: 1px solid rgba(221, 177, 255, .58);
      border-radius: 16px;
      color: var(--ink);
      background: radial-gradient(circle at 12% 0, rgba(184, 91, 255, .18), transparent 38%), linear-gradient(145deg, rgba(27, 14, 37, .98), rgba(8, 8, 13, .98));
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 22px 65px rgba(0,0,0,.68), 0 0 24px rgba(183, 91, 255, .14);
      padding: 14px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: .75rem;
      font-style: normal;
      text-transform: none;
      backdrop-filter: blur(16px);
      pointer-events: none;
    }

    .stat-tooltip.visible { display: block; }
    .stat-tooltip h3 { margin: 0 0 11px; color: #f0ceff; font-size: .9rem; letter-spacing: .02em; }
    .stat-tooltip table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .stat-tooltip th {
      color: #d7b8e8;
      font-size: .62rem;
      letter-spacing: .09em;
      text-align: left;
      text-transform: uppercase;
    }
    .stat-tooltip th, .stat-tooltip td {
      padding: 6px 7px;
      border-bottom: 1px solid rgba(224, 198, 255, .11);
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    .stat-tooltip th:nth-child(1) { width: 16%; }
    .stat-tooltip th:nth-child(2) { width: 16%; }
    .stat-tooltip th:nth-child(3) { width: 27%; }
    .stat-tooltip th:nth-child(4) { width: 41%; }
    .stat-tooltip .source-value { color: #fff; font-weight: 800; white-space: nowrap; }
    .stat-tooltip .source-type { color: #d3a8f1; }
    .stat-tooltip tbody tr:hover { background: rgba(215, 151, 255, .07); }
    .cap-calculation {
      margin-top: 10px;
      border: 1px solid rgba(255, 222, 73, .22);
      border-radius: 9px;
      color: #d8cde0;
      background: rgba(255, 211, 45, .055);
      padding: 8px 9px;
      line-height: 1.5;
    }
    .cap-calculation strong { color: #ffe66c; }
    .health-regeneration-calculation { margin-top: 10px; border: 1px solid rgba(184, 221, 190, .22); border-radius: 9px; color: #cfced3; background: rgba(184, 221, 190, .045); padding: 8px 9px; line-height: 1.5; }
    .health-regeneration-calculation strong { color: #d9f0dd; }
    .cap-formula { color: #f6effa; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    .explorer {
      padding: 18px;
      min-width: 0;
    }

    .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 18px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .tab-button { border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: rgba(255,255,255,.03); padding: 9px 13px; cursor: pointer; }
    .tab-button[aria-selected="true"] { border-color: rgba(var(--class-rgb), .55); color: var(--ink); background: rgba(var(--class-rgb), .14); }
    .tab-pane[hidden] { display: none; }
    .placeholder-pane { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .configuration-empty { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .configuration-actions { display: flex; justify-content: flex-end; margin: 0 0 18px; }
    .configuration-stack { display: grid; gap: 24px; }
    .berserker-stack-control { border: 1px solid rgba(var(--class-rgb), .34); border-radius: 12px; margin: 0; padding: 12px; background: rgba(var(--class-rgb), .06); }
    .berserker-stack-control legend { padding: 0 6px; color: var(--ink); font-size: .78rem; font-weight: 850; }
    .berserker-stack-inputs { display: grid; grid-template-columns: minmax(160px, 1fr) 92px; gap: 12px; align-items: center; }
    .berserker-stack-inputs input[type="range"] { width: 100%; accent-color: rgb(var(--class-rgb)); }
    .berserker-stack-inputs input[type="number"] { width: 100%; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: rgba(0,0,0,.22); padding: 7px 8px; font: inherit; font-variant-numeric: tabular-nums; }
    .berserker-stack-summary { display: block; margin-top: 8px; color: var(--muted); font-size: .68rem; }
    .twinmage-configuration { display: grid; gap: 24px; }
    .gunmancer-configuration { display: grid; gap: 22px; }
    .ability-picker { border: 0; margin: 0; padding: 0; }
    .ability-picker legend { width: 100%; margin-bottom: 10px; color: var(--ink); }
    .ability-picker-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
    .ability-picker-title { font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .ability-picker-subtitle { color: var(--muted); font-size: .68rem; }
    .ability-options { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 10px; }
    .ability-option { position: relative; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; min-width: 0; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.025); padding: 9px; cursor: pointer; transition: border-color .15s, background .15s, color .15s, transform .15s; }
    .ability-option:hover { border-color: rgba(var(--class-rgb), .45); color: var(--ink); transform: translateY(-1px); }
    .ability-option:has(input:focus-visible) { outline: 2px solid rgba(var(--class-rgb), .8); outline-offset: 2px; }
    .ability-option:has(input:checked) { border-color: rgba(var(--class-rgb), .8); color: var(--ink); background: rgba(var(--class-rgb), .16); box-shadow: inset 0 0 0 1px rgba(var(--class-rgb), .3), 0 0 18px rgba(var(--class-rgb), .13); }
    .ability-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .ability-icon { width: 58px; height: 58px; display: block; object-fit: contain; border-radius: 9px; background: rgba(0,0,0,.2); }
    .ability-option:has(input:checked) .ability-icon { filter: saturate(1.16) drop-shadow(0 0 7px rgba(var(--class-rgb), .4)); }
    .ability-copy { min-width: 0; }
    .ability-name { display: block; overflow: hidden; color: inherit; font-size: .76rem; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
    .ability-effect { display: block; margin-top: 4px; color: var(--muted); font-size: .65rem; line-height: 1.35; }
    .gunmancer-configuration .ability-picker-heading { align-items: center; }
    .gunmancer-configuration .ability-options { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .airblast-options { display: grid; grid-template-columns: repeat(3, minmax(130px, 1fr)); gap: 8px; }
    .airblast-option { position: relative; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: rgba(255,255,255,.025); padding: 8px 9px; font-size: .7rem; cursor: pointer; }
    .airblast-option:has(input:checked) { border-color: rgba(var(--class-rgb), .75); color: var(--ink); background: rgba(var(--class-rgb), .13); }
    .airblast-option input { accent-color: rgb(var(--class-rgb)); }
    .gunmancer-source-note { color: var(--muted); font-size: .66rem; line-height: 1.4; }
    .nekomancer-configuration { display: grid; gap: 22px; }
    .nekomancer-configuration .ability-options { grid-template-columns: minmax(180px, 360px); }
    .nekomancer-configuration .ability-option { cursor: default; }
    .nekomancer-configuration .ability-option:hover { transform: none; }
    .nekomancer-minion-options { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 10px; }
    .nekomancer-minion-card { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.025); padding: 9px; }
    .nekomancer-minion-card[data-count]:not([data-count="0"]) { border-color: rgba(var(--class-rgb), .7); color: var(--ink); background: rgba(var(--class-rgb), .12); }
    .nekomancer-minion-controls { display: grid; grid-template-columns: 30px minmax(24px, 1fr) 30px; gap: 5px; align-items: center; margin-top: 8px; }
    .nekomancer-minion-controls button { width: 30px; height: 28px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: rgba(255,255,255,.045); cursor: pointer; font: inherit; font-weight: 900; }
    .nekomancer-minion-controls button:hover:not(:disabled), .nekomancer-minion-controls button:focus-visible { border-color: rgba(var(--class-rgb), .72); background: rgba(var(--class-rgb), .18); outline: none; }
    .nekomancer-minion-controls button:disabled { opacity: .32; cursor: default; }
    .nekomancer-minion-count { color: var(--ink); font-size: .78rem; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
    .nekomancer-souls-control { display: flex; align-items: center; gap: 10px; }
    .nekomancer-souls-control input { width: 82px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: rgba(0,0,0,.22); padding: 7px 8px; font: inherit; font-variant-numeric: tabular-nums; }
    .spellsword-configuration { display: grid; gap: 22px; }
    .spellsword-configuration .ability-options { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
    .spellsword-attack-option input { position: absolute; opacity: 0; pointer-events: none; }
    .spellsword-charge-options { display: grid; grid-template-columns: repeat(4, minmax(90px, 1fr)); gap: 8px; }
    .spellsword-charge-option { position: relative; display: flex; justify-content: center; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: rgba(255,255,255,.025); padding: 8px 9px; font-size: .7rem; font-weight: 800; cursor: pointer; }
    .spellsword-charge-option input { position: absolute; opacity: 0; pointer-events: none; }
    .spellsword-charge-option:has(input:checked) { border-color: rgba(var(--class-rgb), .75); color: var(--ink); background: rgba(var(--class-rgb), .13); }
    .spellsword-charge-control { display: grid; grid-template-columns: minmax(160px, 1fr) 92px; gap: 12px; align-items: center; margin-top: 10px; }
    .spellsword-charge-control input[type="range"] { width: 100%; accent-color: rgb(var(--class-rgb)); }
    .spellsword-charge-control input[type="number"], .spellsword-compact-input input { width: 100%; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: rgba(0,0,0,.22); padding: 7px 8px; font: inherit; font-variant-numeric: tabular-nums; }
    .spellsword-secondary-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
    .spellsword-compact-input { display: grid; grid-template-columns: minmax(0, 1fr) 82px; gap: 10px; align-items: center; color: var(--muted); font-size: .7rem; }
    .element-picker { border: 0; margin: 0; padding: 0; }
    .element-picker legend { width: 100%; margin-bottom: 10px; color: var(--ink); }
    .element-picker-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .element-picker-title { font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .damage-calculation-toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .72rem; font-weight: 700; text-transform: none; letter-spacing: 0; cursor: pointer; }
    .damage-calculation-toggle input { width: 16px; height: 16px; margin: 0; accent-color: rgb(var(--class-rgb)); cursor: pointer; }
    .element-options { display: grid; grid-template-columns: repeat(6, minmax(76px, 1fr)); gap: 10px; }
    .element-option { position: relative; display: grid; justify-items: center; gap: 7px; min-width: 0; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.025); padding: 11px 7px 9px; cursor: pointer; transition: border-color .15s, background .15s, color .15s, transform .15s; }
    .element-option:hover { border-color: rgba(var(--class-rgb), .45); color: var(--ink); transform: translateY(-1px); }
    .element-option:has(input:focus-visible) { outline: 2px solid rgba(var(--class-rgb), .8); outline-offset: 2px; }
    .element-option:has(input:checked) { border-color: rgba(var(--class-rgb), .8); color: var(--ink); background: rgba(var(--class-rgb), .16); box-shadow: inset 0 0 0 1px rgba(var(--class-rgb), .3), 0 0 18px rgba(var(--class-rgb), .13); }
    .element-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .element-icon { width: 64px; height: 64px; display: block; object-fit: contain; filter: saturate(.88); }
    .element-option:has(input:checked) .element-icon { filter: saturate(1.16) drop-shadow(0 0 7px rgba(var(--class-rgb), .4)); }
    .element-name { overflow: hidden; max-width: 100%; font-size: .72rem; font-weight: 800; text-transform: uppercase; text-overflow: ellipsis; }
    .calculation-empty { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .calculation-stack { display: grid; gap: 12px; align-items: start; justify-items: start; }
    .calculation-secondary { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; max-width: 100%; }
    .damage-calculation { width: 100%; }
    .damage-table-wrap { width: max-content; max-width: 100%; overflow-x: auto; border: 1px solid rgba(var(--class-rgb), .58); border-radius: 12px; background: linear-gradient(135deg, rgba(255,255,255,.025), rgba(0,0,0,.22)); box-shadow: inset 0 0 18px rgba(0,0,0,.22), 0 0 12px rgba(var(--class-rgb), .08); }
    .damage-table { width: auto; min-width: 0; border-collapse: collapse; table-layout: fixed; }
    .damage-table .damage-label-col { width: 120px; }
    .damage-table .damage-data-col { width: 72px; }
    .damage-table.shared-ability-table .damage-data-col { width: 120px; }
    .damage-table th, .damage-table td { border-right: 1px solid rgba(255,255,255,.13); border-bottom: 1px solid rgba(255,255,255,.13); padding: 6px 9px; }
    .damage-table tr > :last-child { border-right: 0; }

      height: 22px;

      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255,255,255,.06);
      cursor: pointer;
    }
    .picked-stepper span { min-width: 16px; text-align: center; font-size: .75rem; font-weight: 800; }

    .tools {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 160px 150px;
      gap: 8px;
      margin: 11px 0 14px;
    }

    .control {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: rgba(5, 1, 10, .5);
      padding: 10px 11px;
    }
    .control:focus { border-color: var(--accent); }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }

    .upgrade {
      position: relative;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 11px;
      min-height: 116px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.032);
      padding: 11px;
      text-align: left;
      cursor: pointer;
      transition: transform .13s ease, border-color .13s ease, background .13s ease;
      user-select: none;
    }

    .upgrade:hover {
      z-index: 2;
      transform: translateY(-2px);
      border-color: rgba(205, 147, 255, .55);
      background: rgba(129, 67, 164, .1);
    }

    .upgrade.rare { border-top-color: #4ea2ff; }
    .upgrade.legendary { border-top-color: #ff9d38; }
    .upgrade.selected { box-shadow: inset 0 0 0 1px rgba(205, 147, 255, .38); }
    .upgrade img { width: 58px; height: 58px; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(0,0,0,.4)); }
    .upgrade-copy { min-width: 0; }
    .upgrade-name { margin: 1px 28px 2px 0; font-size: .84rem; line-height: 1.15; }
    .meta { color: var(--muted); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; }
    .upgrade.rare .meta { color: #83bdff; }
    .upgrade.legendary .meta { color: #ffb86f; }
    .effect { margin: 7px 0 0; color: #c9bdcf; font-size: .69rem; line-height: 1.35; }
    .count {
      position: absolute;
      top: 8px;
      right: 8px;
      display: grid;
      place-items: center;
      min-width: 25px;
      height: 25px;
      border-radius: 999px;
      color: #190523;
      background: #e6b6ff;
      font-size: .7rem;
      font-weight: 900;
    }

    .no-results {
      grid-column: 1 / -1;
      padding: 34px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .shell { padding: 14px; }
      .layout { grid-template-columns: 1fr; }
      .left-rail { position: relative; top: 0; max-height: none; }
      .stats-panel { max-height: none; }
      .tools { grid-template-columns: 1fr 1fr; }
      .tools input { grid-column: 1 / -1; }
      .slot-grid { width: 100%; }
    }

    .share-build {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .share-build .panel-title { grid-column: 1 / -1; }
    .share-url {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      color: var(--muted);
      background: rgba(5, 2, 9, .62);
      padding: 8px 9px;
      font-size: .72rem;
    }
    .share-url:focus { border-color: var(--accent); }
    .copy-link {
      border: 1px solid rgba(var(--class-rgb), .38);
      border-radius: 9px;
      background: rgba(var(--class-rgb), .13);
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .copy-link:hover { border-color: var(--accent); }
    .copy-status {
      grid-column: 1 / -1;
      min-height: 1em;
      color: var(--positive);
      font-size: .7rem;
      text-align: right;
    }

    @media (max-width: 520px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions { width: 100%; align-items: end; }
      .class-picker { flex: 1; }
      .class-picker select { width: 100%; min-width: 0; }
      .explorer, .stats-panel { padding: 14px; }
      .picked-head { align-items: flex-start; flex-direction: column; }
      .upgrade-counts { width: 100%; justify-content: flex-start; }
      .tools { grid-template-columns: 1fr; }
      .tools input { grid-column: auto; }
      .catalog { grid-template-columns: 1fr; }
      .element-options { grid-template-columns: repeat(3, minmax(76px, 1fr)); }
      .ability-options, .airblast-options, .nekomancer-minion-options, .spellsword-configuration .ability-options, .spellsword-charge-options { grid-template-columns: 1fr; }
      .element-picker-heading { align-items: flex-start; flex-direction: column; gap: 7px; }
      .damage-table th, .damage-table td { padding: 6px 8px; }
      .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; aspect-ratio: auto; }
      .slot-grid::before, .slot-grid::after { display: none; }
      .rune-slot, .rune-slot:nth-child(n) { position: relative; inset: auto; width: auto; min-height: 0; border-width: 2px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="class-logo" id="class-logo" src="pictures/Class7.png" alt="">
        <div>
          <p class="eyebrow" id="active-class-label">Thaumaturge</p>
          <h1>AdventureLuna's Ecliptica Build Forge</h1>
        </div>
      </div>

            <option>Fistmage</option>
            <option>Spellhammer</option>
            <option>Shield Mage</option>
            <option>Thaumaturge</option>
            <option>Nekomancer</option>

      </div>
    </header>

    <div class="layout">
      <div class="left-rail">

          <strong class="combined-dps-summary" id="combined-dps-summary" data-exact-value="0" aria-live="polite">0.00</strong>
        </section>
        <aside class="panel stats-panel">
          <h2 class="panel-title">Current statistics</h2>
          <div class="stat-list" id="stats"></div>
          <div class="share-build" aria-labelledby="share-build-title">

            <input class="share-url" id="share-url" type="text" readonly aria-label="Share build URL">
            <button class="copy-link" id="copy-link" type="button">Copy link</button>
            <span class="copy-status" id="copy-status" role="status" aria-live="polite"></span>
          </div>
        </aside>
      </div>

      <section class="panel explorer">
        <nav class="tabs" role="tablist" aria-label="Build sections">
          <button class="tab-button" role="tab" aria-selected="false" data-tab="configuration">Configuration</button>
          <button class="tab-button" role="tab" aria-selected="true" data-tab="upgrades">Upgrades</button>
          <button class="tab-button" role="tab" aria-selected="false" data-tab="artifacts">Artifacts</button>
          <button class="tab-button" role="tab" aria-selected="false" data-tab="runes">Runes</button>
          <button class="tab-button" role="tab" aria-selected="false" data-tab="calculations">Calculations</button>
        </nav>
        <div class="tab-pane" id="tab-configuration" role="tabpanel" hidden>
          <div class="configuration-actions"><button class="reset" id="reset-configuration" type="button">Reset configuration</button></div>
          <div id="configuration-content"></div>
        </div>
        <div class="tab-pane" id="tab-upgrades" role="tabpanel">
        <div class="picked-head">
          <h2 class="section-title">Picked upgrades</h2>
          <div class="upgrade-counts" id="picked-summary" aria-label="Picked upgrade counts" aria-live="polite">
            <span class="upgrade-count total"><strong data-upgrade-count="total">0</strong> Total</span>
            <span class="upgrade-count common"><strong data-upgrade-count="common">0</strong> Common</span>
            <span class="upgrade-count rare"><strong data-upgrade-count="rare">0</strong> Rare</span>
            <span class="upgrade-count legendary"><strong data-upgrade-count="legendary">0</strong> Legendary</span>
          </div>
        </div>
        <div class="picked-list" id="picked-list"></div>

        <div class="catalog-head">
          <h2 class="section-title">Upgrade explorer</h2>
          <div class="catalog-head">
            <span class="summary" id="result-summary"></span>
            <button class="dps-ranking-toggle" id="dps-ranking-toggle" type="button" aria-controls="dps-ranking-list" aria-expanded="false">Show sorted by DPS</button>
          </div>
        </div>
        <div class="tools">
          <input class="control" id="search" type="search" placeholder="Search upgradesƒ?İ" autocomplete="off">
          <select class="control" id="family-filter" aria-label="Filter by family">
            <option value="">All families</option>
            <option>Thaumaturge</option>
            <option>Endurance Crystal</option>
            <option>Mobility Crystal</option>
            <option>Chronowizard</option>
          </select>
          <select class="control" id="rarity-filter" aria-label="Filter by rarity">
            <option value="">All rarities</option>
            <option>Common</option>
            <option>Rare</option>
            <option>Legendary</option>
          </select>
        </div>
        <section class="dps-ranking" aria-label="DPS sorted upgrades" hidden>
          <div class="dps-ranking-list" id="dps-ranking-list" hidden></div>
        </section>
        <div class="catalog" id="catalog"></div>
        </div>
        <div class="tab-pane" id="tab-artifacts" role="tabpanel" hidden>
          <div class="catalog-head"><h2 class="section-title">Artifacts</h2><span class="summary" id="artifact-summary"></span></div>
          <div class="catalog" id="artifact-catalog"></div>
        </div>
        <div class="tab-pane" id="tab-runes" role="tabpanel" hidden>
          <div class="catalog-head"><h2 class="section-title">Rune loadout</h2><span class="summary">Four phase slots</span></div>
          <div class="slot-grid" id="rune-slots"></div>
          <div class="catalog" id="rune-catalog"></div>
        </div>
        <div class="tab-pane" id="tab-calculations" role="tabpanel" hidden>
          <div id="calculation-content"></div>
        </div>
      </section>
    </div>
  </main>
  <div class="stat-tooltip" id="stat-tooltip" role="tooltip"></div>
  <div class="calculation-tooltip" id="calculation-tooltip" role="tooltip"></div>

      familyFilter.innerHTML = `<option value="">All available upgrades</option>${availableFamilies
        .map(family => `<option>${escapeHtml(family)}</option>`).join("")}`;
      familyFilter.value = availableFamilies.includes(previous) ? previous : "";
    }

    const STAT_EFFECTS = [
      ["health", "Fluffy", 10], ["health", "Big_and_Round", 30],
      ["health", "Glass_Cannon", -50], ["health", "Mass_Aspect", 75],
      ["healingReceived", "Gluttonous", 5], ["healingReceived", "Adrenaline_Fiend", -15],
      ["healingReceived", "Life_Leech", -20, { once: true, notes: "This penalty only applies once." }],
      ["healingReceived", "Poison_Aspect", -5], ["healingReceived", "Flaming_Spirit", -5],
      ["healingReceived", "Frozen_Heart", -5],
      ["healthRegeneration", "Vitality", 80], ["healthRegeneration", "Life_Leech", -50],
      ["healthRegeneration", "Spellsword_Mastery", -100],
      ["healthRegeneration", "Flaming_Spirit", -20], ["healthRegeneration", "Frozen_Heart", -20],

      ["overallDefense", "Swarm_Enforcer", 1.5, { notes: "With 1 enemy in presence." }],
      ["overallDefense", "Iron_Skin", 8], ["overallDefense", "Big_and_Speedy", -20],
      ["overallDefense", "Featherweight", -20], ["overallDefense", "Benison_of_Purification", -5],
      ["physicalDefense", "Conductive_Armor", 20], ["physicalDefense", "Cutting_Edge", -5],
      ["physicalDefense", "Masochist", n => -10 - 15 * (n - 1), { notes: "First stack: ƒ^'10%. Each additional stack: ƒ^'15%." }],
      ...["fireDefense","frostDefense","electricDefense","luminousDefense","shadowDefense","poisonDefense"]
        .map(stat => [stat, "Conductive_Armor", -5]),
      ["frostDefense", "Cold_Blooded", 15], ["fireDefense", "Cold_Blooded", -15],
      ["fireDefense", "Fire_Aspect", 15], ["frostDefense", "Fire_Aspect", -10],
      ["frostDefense", "Frost_Aspect", 15], ["fireDefense", "Frost_Aspect", -10],
      ["electricDefense", "Masochist", 15], ["poisonDefense", "Poison_Aspect", 15],
      ["luminousDefense", "Holy_Blessing", 15], ["shadowDefense", "Holy_Blessing", 15],
      ["shadowDefense", "Benison_of_Purification", 10], ["luminousDefense", "Curse_of_Wrath", -20],
      ["shadowDefense", "Luminous_Aspect", 10, { notes: "Net result of the listed +15% and ƒ^'5% Shadow Defence modifiers." }],
      ["luminousDefense", "Shadow_Aspect", -10],

      ["overallDamage", "Thaumaturge_Splitshot", -30], ["overallDamage", "Iron_Skin", -2],

      ["overallDamage", "Glass_Cannon", 30], ["overallDamage", "Heavy_Hand", 30],

      ...["fireDamage","frostDamage","electricDamage","luminousDamage","shadowDamage","poisonDamage"]
        .flatMap(stat => [[stat, "Sorcerer's_Mastery", 8], [stat, "An_IQ_Too_High_", 25]]),
      ["fireDamage", "Fire_Aspect", 15], ["frostDamage", "Frost_Aspect", 15],
      ["luminousDamage", "Luminous_Aspect", 15], ["poisonDamage", "Poison_Aspect", 15],
      ["shadowDamage", "Shadow_Aspect", 15],

      ["fireDamage", "Gunmancer_Proficiency_Firebomb", 7, { notes: "Firebomb variant." }],
