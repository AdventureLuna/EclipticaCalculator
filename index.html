    function renderConfiguration() {
      const content = $("#configuration-content");
      if (selectedClass !== "Twinmage") {
        content.innerHTML = '<div class="configuration-empty">No configuration options are available for this class yet.</div>';
        return;
      }
      const picker = (hand, label, selected, useForDamage) => `
        <fieldset class="element-picker">
          <legend><span class="element-picker-heading">
            <span class="element-picker-title">${label}</span>
            <label class="damage-calculation-toggle">
              <input type="checkbox" name="twinmage-${hand}-damage" ${useForDamage ? "checked" : ""}>
              <span>Use for damage calculations</span>
            </label>
          </span></legend>
          <div class="element-options">
            ${TWINMAGE_ELEMENTS.map(element => `
              <label class="element-option">
                <input type="radio" name="twinmage-${hand}" value="${element.id}" ${element.id === selected ? "checked" : ""}>
                <img class="element-icon" src="pictures/${encodeURIComponent(element.image)}" alt="">
                <span class="element-name">${element.name}</span>
              </label>`).join("")}
          </div>
        </fieldset>`;
      content.innerHTML = `<div class="twinmage-configuration">
        ${picker("primary", "Primary element", buildOptions.twinmagePrimary, buildOptions.twinmagePrimaryDamage)}
        ${picker("secondary", "Secondary element", buildOptions.twinmageSecondary, buildOptions.twinmageSecondaryDamage)}
      </div>`;
    }

    function renderCalculations() {
      const content = $("#calculation-content");
      if (selectedClass !== "Twinmage") {
        content.innerHTML = '<div class="calculation-empty">Damage calculations are currently available for Twinmage only.</div>';
        return;
      }

      const hands = [
        { position: "Primary hand", elementId: buildOptions.twinmagePrimary, enabled: buildOptions.twinmagePrimaryDamage },
        { position: "Secondary hand", elementId: buildOptions.twinmageSecondary, enabled: buildOptions.twinmageSecondaryDamage }
      ].filter(hand => hand.enabled).map(hand => ({
        ...hand,
        element: TWINMAGE_ELEMENTS.find(element => element.id === hand.elementId)
      })).filter(hand => hand.element);

      if (!hands.length) {
        content.innerHTML = '<div class="calculation-empty">Enable at least one hand for damage calculations in Configuration.</div>';
        return;
      }

      const twoDecimals = value => Number(value).toFixed(2);
      const uptimePercent = value => {
        const formatted = Number(value * 100).toFixed(2);
        return `${formatted.endsWith(".00") ? formatted.slice(0, -3) : formatted}%`;
      };
      const criticalChancePercent = Number(latestCalculation.stats.criticalChance || 0);
      const criticalDamagePercent = Number(latestCalculation.stats.criticalDamage || 0);
      const criticalChance = Math.max(0, criticalChancePercent) / 100;
      const appliedCriticalChancePercent = criticalChance * 100;
      const criticalDamageMultiplier = criticalDamagePercent / 100;
      const effectiveCriticalMultiplier = (criticalDamageMultiplier - 1) * criticalChance + 1;
      const attackSpeedBase = hands.length === 1 ? 1.4 : 0.8;
      const attackSpeedMultiplier = Number(latestCalculation.stats.attackSpeed || 0) / 100;
      const calculatedHands = hands.map((hand, handIndex) => {
        const overallMultiplier = Number(latestCalculation.stats.overallDamage || 0) / 100;
        const elementalMultiplier = Number(latestCalculation.stats[hand.element.damageStat] || 0) / 100;
        const criticalMultiplier = hand.element.canCrit ? effectiveCriticalMultiplier : 1;
        const unroundedDamage = hand.element.baseDamage * overallMultiplier * elementalMultiplier * criticalMultiplier;
        const totalDamage = Math.round(unroundedDamage);
        const instancesPerSecond = attackSpeedBase * attackSpeedMultiplier;
        const baseStatusChances = Object.fromEntries(Object.entries(hand.element.statusChances).map(([status, chance]) => {
          const bonus = STATUS_CHANCE_BONUSES[status];
          return [status, chance + (bonus ? count(bonus.upgradeId) * bonus.chancePerStack : 0)];
        }));
        const effectiveStatusChances = Object.fromEntries(Object.entries(baseStatusChances).map(([status, chance]) =>
          [status, attackSpeedMultiplier > 0 ? chance / attackSpeedMultiplier : 0]
        ));
        const dps = totalDamage * instancesPerSecond;
        const uptime = DAMAGE_PLACEHOLDERS.uptime;
        const totalDps = dps * uptime;
        return { ...hand, columnKey: `hand-${handIndex}`, sourceIcon: hand.element.image, baseStatusChances, effectiveStatusChances, damage: { overallMultiplier, elementalMultiplier, criticalMultiplier, unroundedDamage, totalDamage, instancesPerSecond, dps, uptime, totalDps } };
      });
      const masteryColumns = count("Twinmage_Mastery") > 0 ? calculatedHands.map((hand, handIndex) => {
        const element = { ...hand.element, handName: `${hand.element.name} Blast`, baseDamage: hand.element.baseDamage * 0.25 };
        const overallMultiplier = hand.damage.overallMultiplier;
        const elementalMultiplier = hand.damage.elementalMultiplier;
        const criticalMultiplier = hand.damage.criticalMultiplier;
        const unroundedDamage = element.baseDamage * overallMultiplier * elementalMultiplier * criticalMultiplier;
        const totalDamage = Math.round(unroundedDamage);
        const instancesPerSecond = hand.damage.instancesPerSecond;
        const dps = totalDamage * instancesPerSecond;
        const uptime = DAMAGE_PLACEHOLDERS.uptime;
        const totalDps = dps * uptime;
        return { position: "Mastery explosion", columnKey: `mastery-${handIndex}`, linkedHandKey: hand.columnKey, originHandName: hand.element.handName, sourceBaseDamage: hand.element.baseDamage, sourceUpgradeId: "Twinmage_Mastery", element, isMasteryExplosion: true, baseStatusChances: { ...hand.baseStatusChances }, effectiveStatusChances: { ...hand.effectiveStatusChances }, damage: { overallMultiplier, elementalMultiplier, criticalMultiplier, unroundedDamage, totalDamage, instancesPerSecond, dps, uptime, totalDps } };
      }) : [];
      const attackSources = [...calculatedHands, ...masteryColumns];
      const criticalInstanceRate = attackSources
        .filter(hand => hand.element.canCrit)
        .reduce((sum, hand) => sum + hand.damage.instancesPerSecond, 0);
      const criticalHitsPerSecond = criticalInstanceRate * criticalChance;
      const chargedStrikeStacks = count("Charged_Strike");
      const chargedStrikeColumn = chargedStrikeStacks > 0 ? (() => {
        const element = { id: "physical", name: "Physical", handName: "Charged Strike", baseDamage: 15 + Math.max(0, chargedStrikeStacks - 1) * 10, damageStat: "physicalDamage", canCrit: false, statusChances: {} };
        const overallMultiplier = Number(latestCalculation.stats.overallDamage || 0) / 100;
        const elementalMultiplier = Number(latestCalculation.stats.physicalDamage || 0) / 100;
        const criticalMultiplier = 1;
        const unroundedDamage = element.baseDamage * overallMultiplier * elementalMultiplier * criticalMultiplier;
        const totalDamage = Math.round(unroundedDamage);
        const instancesPerSecond = criticalHitsPerSecond;
        const dps = totalDamage * instancesPerSecond;
        const uptime = DAMAGE_PLACEHOLDERS.uptime;
        const totalDps = dps * uptime;
        return { position: "Upgrade effect", columnKey: "charged-strike", sourceUpgradeId: "Charged_Strike", element, isTriggeredEffect: true, chargedStrikeStacks, baseStatusChances: {}, effectiveStatusChances: {}, damage: { overallMultiplier, elementalMultiplier, criticalMultiplier, unroundedDamage, totalDamage, instancesPerSecond, dps, uptime, totalDps } };
      })() : null;
      const burningHands = attackSources.filter(hand => Number(hand.effectiveStatusChances.burning) > 0);
      const bossAdjustedBurningRate = burningHands.reduce((sum, hand) =>
        sum + hand.damage.instancesPerSecond * hand.effectiveStatusChances.burning, 0
      ) / BURNING.bossApplicationPenalty;
      const burningInterval = bossAdjustedBurningRate > 0 ? 1 / bossAdjustedBurningRate : Infinity;
      const burningStacks = BURNING.baseStacks + count("Sticky") * BURNING.stacksPerSticky;
      const burningDuration = burningStacks * BURNING.durationPerStack;
      const burningRawUptime = bossAdjustedBurningRate > 0 ? burningDuration / burningInterval : 0;
      const burningUptime = Math.min(1, burningRawUptime);
      const bleedingHands = attackSources.filter(hand => Number(hand.effectiveStatusChances.bleeding) > 0);
      const bossAdjustedBleedingRate = bleedingHands.reduce((sum, hand) =>
        sum + hand.damage.instancesPerSecond * hand.effectiveStatusChances.bleeding, 0
      ) / BLEEDING.bossApplicationPenalty;
      const bleedingInterval = bossAdjustedBleedingRate > 0 ? 1 / bossAdjustedBleedingRate : Infinity;
      const bleedingStacks = BLEEDING.baseStacks + count("Sticky") * BLEEDING.stacksPerSticky;
      const bleedingDuration = bleedingStacks * BLEEDING.durationPerStack;
      const bleedingRawUptime = bossAdjustedBleedingRate > 0 ? bleedingDuration / bleedingInterval : 0;
      const bleedingUptime = Math.min(1, bleedingRawUptime);
      const nonDamageStatuses = NON_DAMAGE_STATUS_DEFINITIONS.map(definition => {
        const sources = attackSources.filter(hand => Number(hand.effectiveStatusChances[definition.id]) > 0);
        const bossAdjustedApplicationRate = sources.reduce((sum, hand) =>
          sum + hand.damage.instancesPerSecond * hand.effectiveStatusChances[definition.id], 0
        ) / definition.bossApplicationPenalty;
        const applicationInterval = bossAdjustedApplicationRate > 0 ? 1 / bossAdjustedApplicationRate : Infinity;
        return { ...definition, sources, bossAdjustedApplicationRate, applicationInterval };
      }).filter(status => status.sources.length);
      const burningColumn = burningHands.length ? (() => {
        const element = { id: "burning", handName: "Burning", baseDamage: 25, damageStat: "fireDamage", canCrit: false, statusChances: {} };
        const overallMultiplier = Number(latestCalculation.stats.overallDamage || 0) / 100;
        const elementalMultiplier = Number(latestCalculation.stats.fireDamage || 0) / 100;
        const criticalMultiplier = 1;
        const unroundedDamage = element.baseDamage * overallMultiplier * elementalMultiplier * criticalMultiplier;
        const totalDamage = Math.round(unroundedDamage);
        const instancesPerSecond = 0.5;
        const dps = totalDamage * instancesPerSecond;
        const uptime = burningUptime;
        const totalDps = dps * uptime;
        return { position: "Status effect", columnKey: "burning", statusId: "burning", statusDuration: burningDuration, statusInterval: burningInterval, element, isStatusEffect: true, effectiveStatusChances: {}, damage: { overallMultiplier, elementalMultiplier, criticalMultiplier, unroundedDamage, totalDamage, instancesPerSecond, dps, uptime, totalDps } };
      })() : null;
      const bleedingColumn = bleedingHands.length ? (() => {
        const element = { id: "bleeding", name: "Physical", handName: "Bleeding", baseDamage: 25, damageStat: "physicalDamage", canCrit: false, statusChances: {} };
        const overallMultiplier = Number(latestCalculation.stats.overallDamage || 0) / 100;
        const elementalMultiplier = Number(latestCalculation.stats.physicalDamage || 0) / 100;
        const criticalMultiplier = 1;
        const unroundedDamage = element.baseDamage * overallMultiplier * elementalMultiplier * criticalMultiplier;
        const totalDamage = Math.round(unroundedDamage);
        const instancesPerSecond = 0.8;
        const dps = totalDamage * instancesPerSecond;
        const uptime = bleedingUptime;
        const totalDps = dps * uptime;
        return { position: "Status effect", columnKey: "bleeding", statusId: "bleeding", statusDuration: bleedingDuration, statusInterval: bleedingInterval, element, isStatusEffect: true, effectiveStatusChances: {}, damage: { overallMultiplier, elementalMultiplier, criticalMultiplier, unroundedDamage, totalDamage, instancesPerSecond, dps, uptime, totalDps } };
      })() : null;
      const statusColumns = [burningColumn, bleedingColumn].filter(Boolean).map((column, index) => ({ ...column, isStatusGroupStart: index === 0 }));
      const triggeredColumns = [chargedStrikeColumn].filter(Boolean);
      const damageColumns = [...attackSources, ...triggeredColumns, ...statusColumns];
      const combinedTotalDps = damageColumns.reduce((sum, hand) => sum + hand.damage.totalDps, 0);
      const damageTypeId = hand => hand.element.damageStat.replace(/Damage$/, "").toLowerCase();
      const damageTypeName = hand => hand.element.name || `${damageTypeId(hand)[0].toUpperCase()}${damageTypeId(hand).slice(1)}`;
      const combinedDpsBreakdown = Object.values(damageColumns.reduce((groups, hand) => {
        const id = damageTypeId(hand);
        groups[id] ||= { id, name: damageTypeName(hand), exact: 0 };
        groups[id].exact += hand.damage.totalDps;
        return groups;
      }, {})).map(item => ({ ...item, value: twoDecimals(item.exact) }));
      const calculationAttributes = (key, formula, refs = []) => `data-calculation-key="${escapeHtml(key)}" data-calculation-formula="${escapeHtml(formula)}" data-calculation-refs="${escapeHtml(refs.join("|"))}" tabindex="0"`;
      const damageTypeAttributes = hand => `data-calculation-damage-type="${escapeHtml(damageTypeName(hand))}" data-calculation-damage-id="${escapeHtml(damageTypeId(hand))}"`;
      const sourceUpgradeAttributes = hand => hand.sourceUpgradeId ? `data-calculation-source-upgrade="${escapeHtml(hand.sourceUpgradeId)}"` : "";
      const sourceIconAttributes = hand => hand.sourceIcon ? `data-calculation-source-icon="${escapeHtml(hand.sourceIcon)}"` : "";
      const damageKey = (hand, rowKey) => `damage:${hand.columnKey}:${rowKey}`;
      const sourceFormula = hand => {
        const statusLines = Object.entries(hand.baseStatusChances || {}).map(([status, chance]) =>
          `${status[0].toUpperCase()}${status.slice(1)}: ${twoDecimals(chance * 100)}% ÷ ${twoDecimals(attackSpeedMultiplier * 100)}% AS = ${twoDecimals(hand.effectiveStatusChances[status] * 100)}%`
        );
        const masteryLine = hand.isMasteryExplosion ? `\n${hand.originHandName} × 25%` : "";
        const triggerLine = hand.isTriggeredEffect ? `\nTriggers on crit · ${twoDecimals(hand.damage.instancesPerSecond)}/s` : "";
        return `${hand.element.handName}\n${hand.element.name || "Fire"} · Base ${hand.element.baseDamage}${masteryLine}${triggerLine}\nCrit: ${hand.element.canCrit ? "Yes" : "No"}\n${statusLines.length ? statusLines.join("\n") : "Status chance: —"}`;
      };
      const rows = [
        { key: "base", label: "Base Damage", value: hand => String(hand.element.baseDamage), exact: hand => hand.element.baseDamage, formula: hand => hand.isMasteryExplosion ? `${hand.sourceBaseDamage} × 25% = ${hand.element.baseDamage}` : hand.isTriggeredEffect ? `15 + (${Math.max(0, hand.chargedStrikeStacks - 1)} × 10) = ${hand.element.baseDamage}` : `Base = ${hand.element.baseDamage}`, refs: hand => hand.isMasteryExplosion ? [`calc:damage:${hand.linkedHandKey}:base`] : hand.isTriggeredEffect ? ["upgrade:Charged_Strike"] : [], damageValue: true },
        { key: "overall", label: "Overall Damage", value: hand => twoDecimals(hand.damage.overallMultiplier), exact: hand => hand.damage.overallMultiplier, formula: hand => `${twoDecimals(hand.damage.overallMultiplier * 100)}% ÷ 100 = ${twoDecimals(hand.damage.overallMultiplier)}`, refs: () => ["stat:overallDamage"] },
        { key: "elemental", label: "Elemental Damage", value: hand => twoDecimals(hand.damage.elementalMultiplier), exact: hand => hand.damage.elementalMultiplier, formula: hand => `${twoDecimals(hand.damage.elementalMultiplier * 100)}% ÷ 100 = ${twoDecimals(hand.damage.elementalMultiplier)}`, refs: hand => [`stat:${hand.element.damageStat}`] },
        { key: "crit", label: "Eff. Crit Multiplier", value: hand => hand.element.canCrit ? twoDecimals(hand.damage.criticalMultiplier) : "-", exact: hand => hand.damage.criticalMultiplier, formula: hand => hand.element.canCrit ? `Crit box = ${twoDecimals(hand.damage.criticalMultiplier)}` : "Cannot crit = × 1", refs: hand => hand.element.canCrit ? ["calc:crit:effective"] : [] },
        { key: "total", label: "Total Damage", value: hand => String(hand.damage.totalDamage), exact: hand => hand.damage.totalDamage, formula: hand => {
          const bareDamage = hand.element.baseDamage * hand.damage.overallMultiplier * hand.damage.elementalMultiplier;
          const nonCriticalDamage = Math.round(bareDamage);
          const fullCriticalDamage = Math.round(bareDamage * criticalDamageMultiplier);
          const averageLine = `Average: ${hand.element.baseDamage} × ${twoDecimals(hand.damage.overallMultiplier)} × ${twoDecimals(hand.damage.elementalMultiplier)} × ${twoDecimals(hand.damage.criticalMultiplier)} ≈ ${hand.damage.totalDamage}`;
          return hand.element.canCrit
            ? `${averageLine}\nNon-crit: ${hand.element.baseDamage} × ${twoDecimals(hand.damage.overallMultiplier)} × ${twoDecimals(hand.damage.elementalMultiplier)} ≈ ${nonCriticalDamage}\nCrit: ${twoDecimals(bareDamage)} × ${twoDecimals(criticalDamageMultiplier)} ≈ ${fullCriticalDamage}`
            : `${hand.element.baseDamage} × ${twoDecimals(hand.damage.overallMultiplier)} × ${twoDecimals(hand.damage.elementalMultiplier)} ≈ ${hand.damage.totalDamage}`;
        }, refs: hand => ["base", "overall", "elemental", "crit"].map(key => `calc:${damageKey(hand, key)}`).concat(hand.element.canCrit ? ["calc:crit:damage", "stat:criticalDamage"] : []), sectionBreak: true, damageValue: true },
        { key: "rate", label: "Instance Rate", value: hand => twoDecimals(hand.damage.instancesPerSecond), exact: hand => hand.damage.instancesPerSecond, formula: hand => hand.isStatusEffect ? `Fixed = ${twoDecimals(hand.damage.instancesPerSecond)}/s` : hand.isMasteryExplosion ? `Matches ${hand.originHandName} = ${twoDecimals(hand.damage.instancesPerSecond)}/s` : hand.isTriggeredEffect ? `Crits per second = ${twoDecimals(hand.damage.instancesPerSecond)}/s` : `${twoDecimals(attackSpeedBase)} × ${twoDecimals(attackSpeedMultiplier)} = ${twoDecimals(hand.damage.instancesPerSecond)}/s`, refs: hand => hand.isStatusEffect ? [] : hand.isMasteryExplosion ? [`calc:damage:${hand.linkedHandKey}:rate`] : hand.isTriggeredEffect ? ["calc:crit:rate"] : ["stat:attackSpeed"] },
        { key: "dps", label: "DPS", value: hand => twoDecimals(hand.damage.dps), exact: hand => hand.damage.dps, formula: hand => `${hand.damage.totalDamage} × ${twoDecimals(hand.damage.instancesPerSecond)} = ${twoDecimals(hand.damage.dps)}`, refs: hand => [`calc:${damageKey(hand, "total")}`, `calc:${damageKey(hand, "rate")}`], damageValue: true },
        { key: "uptime", label: "Uptime", value: hand => uptimePercent(hand.damage.uptime), exact: hand => hand.damage.uptime, formula: hand => hand.isStatusEffect ? `${twoDecimals(hand.statusDuration)}s ÷ ${twoDecimals(hand.statusInterval)}s = ${twoDecimals(hand.damage.uptime * 100)}%` : hand.isTriggeredEffect ? "Matches primary/secondary attacks = 100%" : "Always active = 100%", refs: hand => hand.isStatusEffect ? [`calc:${hand.statusId}:duration`, `calc:${hand.statusId}:interval`] : hand.isTriggeredEffect ? calculatedHands.map(source => `calc:${damageKey(source, "uptime")}`) : [], },
        { key: "total-dps", label: "Total DPS", value: hand => twoDecimals(hand.damage.totalDps), exact: hand => hand.damage.totalDps, formula: hand => `${twoDecimals(hand.damage.dps)} × ${twoDecimals(hand.damage.uptime * 100)}% = ${twoDecimals(hand.damage.totalDps)}`, refs: hand => [`calc:${damageKey(hand, "dps")}`, `calc:${damageKey(hand, "uptime")}`], sectionBreak: true, total: true, damageValue: true }
      ];
      const criticalRows = [
        { key: "crit:chance", label: "Crit Chance", value: `${twoDecimals(criticalChancePercent)}%`, exact: criticalChancePercent, formula: criticalChancePercent < 0 ? `Stats = ${twoDecimals(criticalChancePercent)}% · used = 0.00%` : `Stats = ${twoDecimals(criticalChancePercent)}%`, refs: ["stat:criticalChance"] },
        { key: "crit:damage", label: "Crit Damage", value: `${twoDecimals(criticalDamagePercent)}%`, exact: criticalDamagePercent, formula: `Stats = ${twoDecimals(criticalDamagePercent)}%`, refs: ["stat:criticalDamage"] },
        { key: "crit:rate", label: "Crits per second", value: twoDecimals(criticalHitsPerSecond), exact: criticalHitsPerSecond, formula: `(${attackSources.filter(hand => hand.element.canCrit).map(hand => twoDecimals(hand.damage.instancesPerSecond)).join(" + ")}) × ${twoDecimals(appliedCriticalChancePercent)}% = ${twoDecimals(criticalHitsPerSecond)}`, refs: ["calc:crit:chance", ...attackSources.filter(hand => hand.element.canCrit).map(hand => `calc:${damageKey(hand, "rate")}`)] },
        { key: "crit:effective", label: "Eff. Crit Multiplier", value: twoDecimals(effectiveCriticalMultiplier), exact: effectiveCriticalMultiplier, formula: `(${twoDecimals(criticalDamagePercent)}% − 100%) × ${twoDecimals(appliedCriticalChancePercent)}% + 100% = ${twoDecimals(effectiveCriticalMultiplier)}`, refs: ["calc:crit:chance", "calc:crit:damage"] }
      ];
      const burningRateTerms = burningHands.map(hand => `${twoDecimals(hand.damage.instancesPerSecond)} × (${twoDecimals(hand.baseStatusChances.burning * 100)}% ÷ ${twoDecimals(attackSpeedMultiplier * 100)}% AS)`);
      const burningRows = [
        { key: "burning:interval", label: "Average time between applications", value: `${twoDecimals(burningInterval)} s`, exact: burningInterval, formula: `1 ÷ ((${burningRateTerms.join(" + ")}) ÷ ${BURNING.bossApplicationPenalty}) = ${twoDecimals(burningInterval)}s`, refs: ["stat:attackSpeed", ...burningHands.map(hand => `calc:${damageKey(hand, "rate")}`)] },
        { key: "burning:stacks", label: "Stacks per application", value: String(burningStacks), exact: burningStacks, formula: `${BURNING.baseStacks} + (${count("Sticky")} × ${BURNING.stacksPerSticky}) = ${burningStacks}`, refs: ["upgrade:Sticky"] },
        { key: "burning:duration", label: "Burn duration", value: `${twoDecimals(burningDuration)} s`, exact: burningDuration, formula: `${burningStacks} × ${twoDecimals(BURNING.durationPerStack)}s = ${twoDecimals(burningDuration)}s`, refs: ["calc:burning:stacks"] },
        { key: "burning:uptime", label: "Uptime", value: `${twoDecimals(burningUptime * 100)}%`, valueHtml: burningRawUptime > 1 ? `100% <span class="status-uncapped-uptime">(${twoDecimals(burningRawUptime * 100)}%)</span>` : null, exact: burningUptime, formula: burningRawUptime > 1 ? `${twoDecimals(burningDuration)}s ÷ ${twoDecimals(burningInterval)}s = ${twoDecimals(burningRawUptime * 100)}% → capped at 100%` : `${twoDecimals(burningDuration)}s ÷ ${twoDecimals(burningInterval)}s = ${twoDecimals(burningUptime * 100)}%`, refs: ["calc:burning:duration", "calc:burning:interval"] }
      ];
      const bleedingRateTerms = bleedingHands.map(hand => `${twoDecimals(hand.damage.instancesPerSecond)} × (${twoDecimals(hand.baseStatusChances.bleeding * 100)}% ÷ ${twoDecimals(attackSpeedMultiplier * 100)}% AS)`);
      const bleedingRows = [
        { key: "bleeding:interval", label: "Average time between applications", value: `${twoDecimals(bleedingInterval)} s`, exact: bleedingInterval, formula: `1 ÷ ((${bleedingRateTerms.join(" + ")}) ÷ ${BLEEDING.bossApplicationPenalty}) = ${twoDecimals(bleedingInterval)}s`, refs: ["stat:attackSpeed", ...bleedingHands.map(hand => `calc:${damageKey(hand, "rate")}`)] },
        { key: "bleeding:stacks", label: "Stacks per application", value: String(bleedingStacks), exact: bleedingStacks, formula: `${BLEEDING.baseStacks} + (${count("Sticky")} × ${BLEEDING.stacksPerSticky}) = ${bleedingStacks}`, refs: ["upgrade:Sticky"] },
        { key: "bleeding:duration", label: "Bleed duration", value: `${twoDecimals(bleedingDuration)} s`, exact: bleedingDuration, formula: `${bleedingStacks} × ${twoDecimals(BLEEDING.durationPerStack)}s = ${twoDecimals(bleedingDuration)}s`, refs: ["calc:bleeding:stacks"] },
        { key: "bleeding:uptime", label: "Uptime", value: `${twoDecimals(bleedingUptime * 100)}%`, valueHtml: bleedingRawUptime > 1 ? `100% <span class="status-uncapped-uptime">(${twoDecimals(bleedingRawUptime * 100)}%)</span>` : null, exact: bleedingUptime, formula: bleedingRawUptime > 1 ? `${twoDecimals(bleedingDuration)}s ÷ ${twoDecimals(bleedingInterval)}s = ${twoDecimals(bleedingRawUptime * 100)}% → capped at 100%` : `${twoDecimals(bleedingDuration)}s ÷ ${twoDecimals(bleedingInterval)}s = ${twoDecimals(bleedingUptime * 100)}%`, refs: ["calc:bleeding:duration", "calc:bleeding:interval"] }
      ];
      const nonDamageStatusRows = status => {
        const rateTerms = status.sources.map(hand => `${twoDecimals(hand.damage.instancesPerSecond)} × (${twoDecimals(hand.baseStatusChances[status.id] * 100)}% ÷ ${twoDecimals(attackSpeedMultiplier * 100)}% AS)`);
        return [
          { key: `${status.id}:interval`, label: "Average time between applications", value: `${twoDecimals(status.applicationInterval)} s`, exact: status.applicationInterval, formula: `1 ÷ ((${rateTerms.join(" + ")}) ÷ ${status.bossApplicationPenalty}) = ${twoDecimals(status.applicationInterval)}s`, refs: ["stat:attackSpeed", ...status.sources.map(hand => `calc:${damageKey(hand, "rate")}`)] },
          { key: `${status.id}:stacks`, label: "Stacks per application", value: "?", exact: "unknown", formula: "Not configured yet", refs: [], unknown: true },
          { key: `${status.id}:uptime`, label: "Uptime", value: "?", exact: "unknown", formula: "Not configured yet", refs: [], unknown: true }
        ];
      };

      content.innerHTML = `<div class="calculation-stack">
        <section class="damage-calculation">
          <div class="damage-table-wrap">
            <table class="damage-table ${calculatedHands.length === 1 ? "single-hand" : "dual-hand"}">
              <colgroup><col class="damage-label-col"><col class="damage-data-col" span="${damageColumns.length}"></colgroup>
              <thead><tr><th scope="col"><span class="damage-hand-position">Current build</span></th>${damageColumns.map(hand => `
                <th scope="col" class="damage-column ${hand.isStatusEffect ? "status-effect-column" : ""} ${hand.isStatusGroupStart ? "status-group-start" : ""}" data-element="${hand.element.id}" ${calculationAttributes(`source:${hand.columnKey}`, sourceFormula(hand))} ${sourceUpgradeAttributes(hand)} ${sourceIconAttributes(hand)}>
                  <span class="damage-hand-position">${escapeHtml(hand.position)}</span>
                  <span class="damage-hand-title">${escapeHtml(hand.element.handName)}</span>
                </th>`).join("")}</tr></thead>
              <tbody>${rows.map(row => `<tr class="${row.sectionBreak ? "damage-section-break " : ""}${row.total ? "damage-total-row" : ""}">
                <th scope="row" class="damage-label">${escapeHtml(row.label)}</th>
                ${damageColumns.map(hand => `<td class="damage-column ${hand.isStatusEffect ? "status-effect-column" : ""} ${hand.isStatusGroupStart ? "status-group-start" : ""}" data-element="${hand.element.id}">
                  <span class="damage-value" data-exact-value="${escapeHtml(String(row.exact(hand)))}" ${calculationAttributes(damageKey(hand, row.key), row.formula(hand), row.refs(hand))} ${row.damageValue ? damageTypeAttributes(hand) : ""} ${sourceUpgradeAttributes(hand)} ${sourceIconAttributes(hand)}>${escapeHtml(row.value(hand))}</span>
                </td>`).join("")}
              </tr>`).join("")}</tbody>
              <tfoot><tr class="damage-combined-row">
                <th scope="row" class="damage-combined-label">Combined DPS</th>
                <td colspan="${damageColumns.length}" class="damage-column">
                  <span class="damage-combined-value" data-exact-value="${escapeHtml(String(combinedTotalDps))}" data-calculation-breakdown="${escapeHtml(JSON.stringify(combinedDpsBreakdown))}" ${calculationAttributes("damage:combined:total-dps", `${damageColumns.map(hand => twoDecimals(hand.damage.totalDps)).join(" + ")} = ${twoDecimals(combinedTotalDps)}`, damageColumns.map(hand => `calc:${damageKey(hand, "total-dps")}`))}>${twoDecimals(combinedTotalDps)}</span>
                </td>
              </tr></tfoot>
            </table>
          </div>
        </section>
        <div class="calculation-secondary">
          <section class="crit-table-wrap">
            <table class="crit-table">
              <thead><tr><th colspan="2">Critical hits</th></tr></thead>
              <tbody>${criticalRows.map(row => `<tr>
                <th scope="row" class="crit-label">${escapeHtml(row.label)}</th>
                <td class="crit-value" data-exact-value="${escapeHtml(String(row.exact))}" ${calculationAttributes(row.key, row.formula, row.refs)}>${escapeHtml(row.value)}</td>
              </tr>`).join("")}</tbody>
            </table>
          </section>
          ${burningHands.length ? `<section class="status-table-wrap" data-status="burning">
            <table class="status-table">
              <thead><tr><th colspan="2">Status: Burning</th></tr></thead>
              <tbody>${burningRows.map(row => `<tr>
                <th scope="row" class="status-label">${escapeHtml(row.label)}</th>
                <td class="status-value" data-exact-value="${escapeHtml(String(row.exact))}" ${calculationAttributes(row.key, row.formula, row.refs)}>${row.valueHtml || escapeHtml(row.value)}</td>
              </tr>`).join("")}</tbody>
            </table>
          </section>` : ""}
          ${bleedingHands.length ? `<section class="status-table-wrap" data-status="bleeding">
            <table class="status-table">
              <thead><tr><th colspan="2">Status: Bleeding</th></tr></thead>
              <tbody>${bleedingRows.map(row => `<tr>
                <th scope="row" class="status-label">${escapeHtml(row.label)}</th>
                <td class="status-value" data-exact-value="${escapeHtml(String(row.exact))}" ${calculationAttributes(row.key, row.formula, row.refs)}>${row.valueHtml || escapeHtml(row.value)}</td>
              </tr>`).join("")}</tbody>
            </table>
          </section>` : ""}
          ${nonDamageStatuses.map(status => {
            const statusRows = nonDamageStatusRows(status);
            return `<section class="status-table-wrap" data-status="${escapeHtml(status.id)}">
              <table class="status-table">
                <thead><tr><th colspan="2">Status: ${escapeHtml(status.name)}</th></tr></thead>
                <tbody>${statusRows.map(row => `<tr>
                  <th scope="row" class="status-label">${escapeHtml(row.label)}</th>
                  <td class="status-value ${row.unknown ? "status-value-unknown" : ""}" data-exact-value="${escapeHtml(String(row.exact))}" ${calculationAttributes(row.key, row.formula, row.refs)}>${escapeHtml(row.value)}</td>
                </tr>`).join("")}</tbody>
                ${status.note ? `<tfoot><tr><td class="status-note" colspan="2">${escapeHtml(status.note)}</td></tr></tfoot>` : ""}
              </table>
            </section>`;
          }).join("")}
        </div>
      </div>`;
    }

    function renderRunes() {
      const curseOptions = `<option value="">No curse selected</option>${CURSES.map(curse =>
        `<option value="${curse.id}">Runic Curse: ${escapeHtml(curse.name)}</option>`).join("")}`;
      $("#rune-slots").innerHTML = RUNE_SLOTS.map((slot, index) => {
        const rune = RUNES.find(item => item.id === buildOptions.runes[index]);
        return `<div class="rune-slot ${activeRuneSlot === index ? "active" : ""}" data-slot="${index}" role="button" tabindex="0">
          <span class="slot-name">${slot}</span>
          ${rune ? `<button class="remove-rune" type="button" data-remove-rune="${index}" aria-label="Remove ${escapeHtml(rune.name)} from ${slot}">×</button>` : ""}
          ${rune ? `<img class="slot-rune-art" src="pictures/${encodeURIComponent(rune.image)}" alt="">` : `<span class="slot-rune-empty" aria-hidden="true">◇</span>`}
          <span class="slot-rune">${rune ? escapeHtml(rune.name) : "Choose a rune…"}</span>
          <div class="curse-row">${buildOptions.curses[index] ? `<img class="curse-art" src="pictures/Runic_Curse.png" alt="Runic Curse">` : ""}<select class="curse-select" data-curse-slot="${index}" aria-label="${slot} Runic Curse">${curseOptions}</select></div>
        </div>`;
      }).join("");
      buildOptions.curses.forEach((curse, index) => { $(`[data-curse-slot="${index}"]`).value = curse || ""; });
      $("#rune-catalog").innerHTML = RUNES.map(item => {
        const selectedSlot = buildOptions.runes.indexOf(item.id);
        return `<article class="upgrade rune-card ${selectedSlot >= 0 ? "selected" : ""}" data-id="${item.id}">
          ${selectedSlot >= 0 ? `<span class="count">${selectedSlot + 1}</span>` : ""}
          <div class="item-placeholder"><img class="item-art" src="pictures/${encodeURIComponent(item.image)}" alt="${escapeHtml(item.name)}"></div>
          <div class="upgrade-copy"><h3 class="upgrade-name">${escapeHtml(item.name)}</h3>
            <div class="meta">Rune</div><p class="effect">${escapeHtml(item.effect)}</p></div>
        </article>`;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function render() {
      renderStats();
      renderConfiguration();
      renderCalculations();
      renderPicked();
      renderCatalog();
      renderArtifacts();
      renderRunes();
      updateShareWidget();
    }

    $("#stats").addEventListener("mouseover", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row) showStatTooltip(row);
    });

    $("#stats").addEventListener("mouseout", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row && !row.contains(event.relatedTarget)) hideStatTooltip();
    });

    $("#stats").addEventListener("focusin", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row) showStatTooltip(row);
    });

    $("#stats").addEventListener("focusout", hideStatTooltip);

    $("#calculation-content").addEventListener("mouseover", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value) showCalculationTooltip(value, event.clientX, event.clientY);
    });

    $("#calculation-content").addEventListener("mousemove", event => {
      if (event.target.closest("[data-calculation-formula]")) positionCalculationTooltip(event.clientX, event.clientY);
    });

    $("#calculation-content").addEventListener("mouseout", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value && !value.contains(event.relatedTarget)) hideCalculationTooltip();
    });

    $("#calculation-content").addEventListener("focusin", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value) showCalculationTooltip(value);
    });

    $("#calculation-content").addEventListener("focusout", hideCalculationTooltip);

    $("#catalog").addEventListener("click", event => {
      const card = event.target.closest(".upgrade");
      if (card) setCount(card.dataset.id, count(card.dataset.id) + 1);
    });

    $("#catalog").addEventListener("contextmenu", event => {
      const card = event.target.closest(".upgrade");
      if (!card) return;
      event.preventDefault();
      setCount(card.dataset.id, count(card.dataset.id) - 1);
    });

    $("#picked-list").addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;
      setCount(button.dataset.id, count(button.dataset.id) + (button.dataset.action === "plus" ? 1 : -1));
    });

    ["search", "family-filter", "rarity-filter"].forEach(id => {
      $(`#${id}`).addEventListener(id === "search" ? "input" : "change", renderCatalog);
    });

    document.querySelector(".explorer").addEventListener("keydown", event => {
      const search = $("#search");
      if (event.code !== "Space" || event.target === search || event.defaultPrevented) return;
      event.preventDefault();
      if (search.value) {
        search.value = "";
        renderCatalog();
      }
      search.focus();
    });

    document.querySelector(".tabs").addEventListener("click", event => {
      const button = event.target.closest("[data-tab]");
      if (!button) return;
      document.querySelectorAll("[data-tab]").forEach(tab => tab.setAttribute("aria-selected", String(tab === button)));
      document.querySelectorAll(".tab-pane").forEach(pane => { pane.hidden = pane.id !== `tab-${button.dataset.tab}`; });
    });

    $("#configuration-content").addEventListener("change", event => {
      const damageToggle = event.target.closest('input[type="checkbox"][name$="-damage"]');
      if (damageToggle) {
        if (damageToggle.name === "twinmage-primary-damage") buildOptions.twinmagePrimaryDamage = damageToggle.checked;
        else if (damageToggle.name === "twinmage-secondary-damage") buildOptions.twinmageSecondaryDamage = damageToggle.checked;
        if (!buildOptions.twinmagePrimaryDamage && !buildOptions.twinmageSecondaryDamage) {
          if (damageToggle.name === "twinmage-primary-damage") buildOptions.twinmageSecondaryDamage = true;
          else buildOptions.twinmagePrimaryDamage = true;
        }
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        updateShareWidget();
        return;
      }
      const choice = event.target.closest('input[type="radio"][name^="twinmage-"]');
      if (!choice || !TWINMAGE_ELEMENTS.some(element => element.id === choice.value)) return;
      if (choice.name === "twinmage-primary") buildOptions.twinmagePrimary = choice.value;
      else if (choice.name === "twinmage-secondary") buildOptions.twinmageSecondary = choice.value;
      saveBuildOptions();
      renderConfiguration();
      renderCalculations();
      updateShareWidget();
    });

    $("#artifact-catalog").addEventListener("click", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      buildOptions.artifacts[card.dataset.id] = Math.min(100, (buildOptions.artifacts[card.dataset.id] || 0) + 1);
      saveBuildOptions();
      render();
    });
    $("#artifact-catalog").addEventListener("contextmenu", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      event.preventDefault();
      const next = (buildOptions.artifacts[card.dataset.id] || 0) - 1;
      if (next > 0) buildOptions.artifacts[card.dataset.id] = next;
      else delete buildOptions.artifacts[card.dataset.id];
      saveBuildOptions();
      render();
    });

    $("#rune-slots").addEventListener("click", event => {
      if (event.target.closest("select")) return;
      const remove = event.target.closest("[data-remove-rune]");
      if (remove) {
        activeRuneSlot = Number(remove.dataset.removeRune);
        buildOptions.runes[activeRuneSlot] = null;
        saveBuildOptions();
        render();
        return;
      }
      const slot = event.target.closest("[data-slot]");
      if (!slot) return;
      activeRuneSlot = Number(slot.dataset.slot);
      renderRunes();
    });
    $("#rune-slots").addEventListener("change", event => {
      const select = event.target.closest("[data-curse-slot]");
      if (!select) return;
      buildOptions.curses[Number(select.dataset.curseSlot)] = select.value || null;
      saveBuildOptions();
      render();
    });
    $("#rune-catalog").addEventListener("click", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      const existing = buildOptions.runes.indexOf(card.dataset.id);
      if (existing >= 0) {
        buildOptions.runes[existing] = null;
        activeRuneSlot = existing;
      } else {
        buildOptions.runes[activeRuneSlot] = card.dataset.id;
        const next = buildOptions.runes.findIndex((id, index) => !id && index > activeRuneSlot);
        const wrapped = buildOptions.runes.findIndex(id => !id);
        if (next >= 0 || wrapped >= 0) activeRuneSlot = next >= 0 ? next : wrapped;
      }
      saveBuildOptions();
      render();
    });

    $("#class-select").addEventListener("change", event => {
      selectedClass = CLASS_FAMILIES.includes(event.target.value) ? event.target.value : "Thaumaturge";
      localStorage.setItem("ecliptica-upgrade-explorer-class", selectedClass);
      syncClassUi();
      render();
    });

    $("#reset-build").addEventListener("click", () => {
      Object.keys(counts).forEach(id => delete counts[id]);
      buildOptions.artifacts = {};
      buildOptions.runes = RUNE_SLOTS.map(() => null);
      buildOptions.curses = RUNE_SLOTS.map(() => null);
      buildOptions.twinmagePrimary = "fire";
      buildOptions.twinmageSecondary = "lightning";
      buildOptions.twinmagePrimaryDamage = true;
      buildOptions.twinmageSecondaryDamage = true;
      activeRuneSlot = 0;
      saveCounts();
      saveBuildOptions();
      render();
    });

    $("#copy-link").addEventListener("click", copyShareUrl);
    window.addEventListener("hashchange", loadBuildFromHash);

    syncClassUi();
    if (new URLSearchParams(location.hash.slice(1)).has("b")) loadBuildFromHash();
    else render();
  </script>
</body>
</html>
