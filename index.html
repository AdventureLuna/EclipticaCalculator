        { key: "elemental", label: "Elemental Damage", value: source => `x${number(source.damage.elementalMultiplier)}`, exact: source => source.damage.elementalMultiplier, formula: source => source.damageScaling === .75 ? `1 + (elemental multiplier - 1) ا- 75% = ${number(source.damage.elementalMultiplier)}` : `${number(source.damage.elementalMultiplier * 100)}% اْ 100`, refs: source => [`stat:${source.damageStat}`] },
        { key: "crit", label: "Eff. Crit Multiplier", value: source => source.canCrit ? `x${number(source.damage.effectiveCriticalMultiplier)}` : "-", exact: source => source.damage.effectiveCriticalMultiplier, formula: source => source.canCrit ? `Effective crit multiplier = ${number(source.damage.effectiveCriticalMultiplier)}` : "This damage cannot crit", refs: source => source.canCrit ? ["calc:crit:effective"] : [] },
        ...(hasSourceMultiplier ? [{ key: "source-multiplier", label: model.classKey === "twinmage" ? "Hand Damage" : "Source Damage", value: source => source.isStatusEffect || Math.abs(source.damage.sourceMultiplier - 1) < .0001 ? "-" : `x${number(source.damage.sourceMultiplier)}`, exact: source => source.damage.sourceMultiplier, formula: source => source.isStatusEffect || Math.abs(source.damage.sourceMultiplier - 1) < .0001 ? "Does not apply to this damage source" : source.sourceMultiplierFormula || `Source multiplier = ${number(source.damage.sourceMultiplier)}` }] : []),
        ...(hasMultipleProjectiles ? [{ key: "projectiles", label: hasNonProjectileHits ? "Hits / Activation" : "Projectiles / Shot", value: source => source.isStatusEffect || (source.trigger && source.showProjectiles !== true && source.showInstances !== true) ? "-" : String(source.hitsPerActivation), exact: source => source.hitsPerActivation, formula: source => source.isStatusEffect || (source.trigger && source.showProjectiles !== true && source.showInstances !== true) ? "Not hit-count based" : `${source.hitsPerActivation} damage ${source.hitsPerActivation === 1 ? "instance" : "instances"} per activation` }] : []),
        { key: "average", label: "Average Damage", value: source => number(source.damage.averageDamage), exact: source => source.damage.averageDamage, formula: averageDamageFormula, refs: source => ["base", "overall", "elemental", "crit"].map(key => `calc:${damageKey(source, key)}`), sectionBreak: true, damageValue: true },
        { key: "rate", label: "Instance Rate", value: source => number(source.damage.activationRate), exact: source => source.damage.activationRate, formula: rateFormula, refs: source => source.trigger?.type === "onCrit" ? ["calc:crit:rate"] : source.isStatusEffect ? [] : (source.rateRefs || ["stat:attackSpeed"]) },
        { key: "dps", label: "DPS", value: source => number(source.damage.dps), exact: source => source.damage.dps, formula: source => `${number(source.damage.averageDamage)} ا- ${number(source.damage.activationRate)} = ${number(source.damage.dps)}`, refs: source => [`calc:${damageKey(source, "average")}`, `calc:${damageKey(source, "rate")}`], damageValue: true },
        { key: "uptime", label: "Uptime", value: source => percent(source.damage.uptime), exact: source => source.damage.uptime, formula: source => source.isStatusEffect ? `${number(source.statusDuration)}s duration اْ ${number(source.statusInterval)}s interval = ${percent(source.damage.uptime)}` : "Always active = 100%" },
        { key: "total-dps", label: "Total DPS", value: source => number(source.damage.totalDps), exact: source => source.damage.totalDps, formula: source => `${number(source.damage.dps)} ا- ${percent(source.damage.uptime)} = ${number(source.damage.totalDps)}`, refs: source => [`calc:${damageKey(source, "dps")}`, `calc:${damageKey(source, "uptime")}`], sectionBreak: true, total: true, damageValue: true }
      ];
      const statusRows = status => {

          sources: status.sources.map(source => ({

            chanceCalculation: source.bossApplicationPenalty > 1
              ? `${percent(source.baseApplicationChance)} اْ ${rateNumber(source.bossApplicationPenalty)}ا- boss penalty = ${percent(source.applicationChance)}`
              : percent(source.applicationChance),
            applicationsPerSecond: rateNumber(source.applicationsPerSecond)
          })),
          total: rateNumber(status.applicationsPerSecond), interval: number(status.applicationInterval)
        };
        const rowsForStatus = [{
          key: `${status.id}:interval`, label: "Average time between applications", value: `${number(status.applicationInterval)} s`, exact: status.applicationInterval,
          formula: `1 اْ ${rateNumber(status.applicationsPerSecond)} applications/s = ${number(status.applicationInterval)}s`, applicationBreakdown: breakdown
        }];
        if (status.stacksPerApplication == null) {

          rowsForStatus.push({ key: `${status.id}:uptime`, label: "Uptime", value: "?", exact: "unknown", formula: "Not configured yet", unknown: true });
        } else {

          rowsForStatus.push({ key: `${status.id}:duration`, label: `${status.name} duration`, value: `${number(status.duration)} s`, exact: status.duration, formula: `${status.stacksPerApplication} stacks ا- ${number(status.durationPerStack)}s` });
          rowsForStatus.push({ key: `${status.id}:uptime`, label: "Uptime", value: percent(status.uptime), valueHtml: status.rawUptime > 1 ? `100% <span class="status-uncapped-uptime">(${percent(status.rawUptime)})</span>` : null, exact: status.uptime, formula: `${number(status.duration)}s اْ ${number(status.applicationInterval)}s = ${percent(status.rawUptime)}${status.rawUptime > 1 ? "; capped at 100%" : ""}` });

      };

      }).join("");
      const criticalRows = [
        ["crit:chance", "Crit Chance", `${number(model.criticalChancePercent)}%`, count("Pocket_Abacus") > 0 ? "Pocket Abacus guarantees every fifth damage instance: effective 20%" : `Stats = ${number(model.criticalChancePercent)}%`],
        ["crit:damage", "Crit Damage", `${number(model.criticalDamagePercent)}%`, `Stats = ${number(model.criticalDamagePercent)}%`],

        ["crit:effective", "Eff. Crit Multiplier", number(1 + (model.context.criticalDamageMultiplier - 1) * model.context.criticalChance), "Weighted critical multiplier"]
      ];
      const includedSources = model.damageSources.filter(source => !source.excluded);
      const combinedBreakdown = Object.values(includedSources.reduce((groups, source) => {

        groups[source.element].exact += source.damage.totalDps;

      }, {})).map(item => ({ ...item, value: number(item.exact) }));
      const columns = model.damageSources;
      content.innerHTML = `<div class="calculation-stack"><section class="damage-calculation"><div class="damage-table-wrap"><table class="damage-table ${model.classKey === "twinmage" && model.attackSources.filter(source => source.position?.includes("hand")).length > 1 ? "dual-hand" : "single-hand"} shared-ability-table"><colgroup><col class="damage-label-col"><col class="damage-data-col" span="${columns.length}"></colgroup><thead><tr><th scope="col"><span class="damage-hand-position">Current build</span><span class="damage-hand-title">${escapeHtml(model.className)}</span></th>${columns.map(source => `<th scope="col" class="damage-column ${sourceColumnClasses(source)}" data-element="${escapeHtml(source.element)}">${sourceColumnToggle(source)}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr class="${row.sectionBreak ? "damage-section-break " : ""}${row.total ? "damage-total-row" : ""}"><th scope="row" class="damage-label">${escapeHtml(row.label)}</th>${columns.map(source => `<td class="damage-column ${sourceColumnClasses(source)}" data-element="${escapeHtml(source.element)}"><span class="damage-value ${row.value(source) === "-" ? "damage-value-unknown" : ""}" data-exact-value="${escapeHtml(String(row.exact(source)))}" ${calculationAttributes(damageKey(source, row.key), row.formula(source), row.refs ? row.refs(source) : [])} ${row.damageValue ? damageTypeAttributes(source) : ""} ${sourceIconAttributes(source)} ${sourceUpgradeAttributes(source)}>${escapeHtml(row.value(source))}</span></td>`).join("")}</tr>`).join("")}</tbody><tfoot><tr class="damage-combined-row"><th scope="row" class="damage-combined-label">Combined DPS</th><td colspan="${columns.length}" class="damage-column"><span class="damage-combined-value" data-exact-value="${escapeHtml(String(model.combinedTotalDps))}" data-calculation-breakdown="${escapeHtml(JSON.stringify(combinedBreakdown))}" ${calculationAttributes("damage:combined:total-dps", `${includedSources.length ? includedSources.map(source => number(source.damage.totalDps)).join(" + ") : "0.00"} = ${number(model.combinedTotalDps)}`)}>${number(model.combinedTotalDps)}</span></td></tr></tfoot></table></div></section><div class="calculation-secondary"><section class="crit-table-wrap"><table class="crit-table"><thead><tr><th colspan="2">Critical hits</th></tr></thead><tbody>${criticalRows.map(row => `<tr><th scope="row" class="crit-label">${escapeHtml(row[1])}</th><td class="crit-value" ${calculationAttributes(row[0], row[3])}>${escapeHtml(row[2])}</td></tr>`).join("")}</tbody></table></section>${statusMarkup}</div></div>`;
      return { combinedTotalDps: model.combinedTotalDps };
    }

    function renderCalculations(options = {}) {
      return renderUnifiedCalculations(options);
    }

    window.EclipticaBuildForge = {
      buildUnifiedCalculationModel,
      renderCalculations
    };

    function renderRunes() {
      const curseOptions = `<option value="">No curse selected</option>${CURSES.map(curse =>
        `<option value="${curse.id}">Runic Curse: ${escapeHtml(curse.name)}</option>`).join("")}`;
      $("#rune-slots").innerHTML = RUNE_SLOTS.map((slot, index) => {
        const rune = RUNES.find(item => item.id === buildOptions.runes[index]);
        return `<div class="rune-slot ${activeRuneSlot === index ? "active" : ""}" data-slot="${index}" role="button" tabindex="0">
          <span class="slot-name">${slot}</span>
          ${rune ? `<button class="remove-rune" type="button" data-remove-rune="${index}" aria-label="Remove ${escapeHtml(rune.name)} from ${slot}">ا-</button>` : ""}
          ${rune ? `<img class="slot-rune-art" src="pictures/${encodeURIComponent(rune.image)}" alt="">` : `<span class="slot-rune-empty" aria-hidden="true">ƒ-خ</span>`}
          <span class="slot-rune">${rune ? escapeHtml(rune.name) : "Choose a runeƒ?ف"}</span>
          <div class="curse-row">${buildOptions.curses[index] ? `<img class="curse-art" src="pictures/Runic_Curse.png" alt="Runic Curse">` : ""}<select class="curse-select" data-curse-slot="${index}" aria-label="${slot} Runic Curse">${curseOptions}</select></div>
        </div>`;
      }).join("");
      buildOptions.curses.forEach((curse, index) => { $(`[data-curse-slot="${index}"]`).value = curse || ""; });
      $("#rune-catalog").innerHTML = RUNES.map(item => {
        const selectedSlot = buildOptions.runes.indexOf(item.id);
        return `<article class="upgrade rune-card ${selectedSlot >= 0 ? "selected" : ""}" data-id="${item.id}">
          ${selectedSlot >= 0 ? `<span class="count">${selectedSlot + 1}</span>` : ""}
          <div class="item-placeholder"><img class="item-art" src="pictures/${encodeURIComponent(item.image)}" alt="${escapeHtml(item.name)}"></div>
          <div class="upgrade-copy"><h3 class="upgrade-name">${escapeHtml(item.name)}</h3>
            <div class="meta">Rune</div><p class="effect">${escapeHtml(item.effect)}</p></div>
        </article>`;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function render() {
      renderStats();
      renderConfiguration();
      renderCalculations();
      renderPicked();
      renderCatalog();
      renderDpsRanking();
      renderArtifacts();
      renderRunes();
      updateShareWidget();
    }

    function changeClass(nextClass) {
      if (!CLASS_FAMILIES.includes(nextClass) || nextClass === selectedClass) return;
      dpsRankingRun += 1;
      if (dpsRankingFrame !== null) {
        cancelAnimationFrame(dpsRankingFrame);
        dpsRankingFrame = null;
      }
      if (dpsRankingSnapshot) {
        restoreCounts(dpsRankingSnapshot);
        restoreRankingBuildOptions(dpsRankingBuildOptionsSnapshot);
        dpsRankingSnapshot = null;
        dpsRankingBuildOptionsSnapshot = null;
      }
      hideCalculationTooltip();
      selectedClass = nextClass;
      buildOptions.berserkerSoulStacks = berserkerMaximumStacks(rawCount(berserkerVariantForClass()?.id));
      safeSetStorage("ecliptica-upgrade-explorer-class", selectedClass);
      saveBuildOptions();
      syncClassUi();
      $("#configuration-content").replaceChildren();
      $("#calculation-content").replaceChildren();
      renderStats();
      renderConfiguration();
      renderCalculations();
      renderPicked();
      renderCatalog();
      renderDpsRanking();
      renderArtifacts();
      renderRunes();
      updateShareWidget();
    }

    $("#stats").addEventListener("mouseover", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row) showStatTooltip(row);
    });

    $("#stats").addEventListener("mouseout", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row && !row.contains(event.relatedTarget)) hideStatTooltip();
    });

    $("#stats").addEventListener("focusin", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row) showStatTooltip(row);
    });

    $("#stats").addEventListener("focusout", hideStatTooltip);

    $("#calculation-content").addEventListener("click", event => {
      const button = event.target.closest("[data-source-exclusion]");
      if (!button) return;
      const key = button.dataset.sourceExclusion;
      if (!DAMAGE_SOURCE_SHARE_ID.has(key)) return;
      const excluded = excludedDamageSourceKeys();
      buildOptions.excludedDamageSources[selectedClass] = excluded.includes(key)
        ? excluded.filter(value => value !== key)
        : [...excluded, key];
      saveBuildOptions();
      hideCalculationTooltip();
      renderCalculations();
      renderDpsRanking();
      updateShareWidget();
    });

    $("#calculation-content").addEventListener("mouseover", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value) showCalculationTooltip(value, event.clientX, event.clientY);
    });

    $("#calculation-content").addEventListener("mousemove", event => {
      if (event.target.closest("[data-calculation-formula]")) positionCalculationTooltip(event.clientX, event.clientY);
    });

    $("#calculation-content").addEventListener("mouseout", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value && !value.contains(event.relatedTarget)) hideCalculationTooltip();
    });

    $("#calculation-content").addEventListener("focusin", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value) showCalculationTooltip(value);
    });

    $("#calculation-content").addEventListener("focusout", hideCalculationTooltip);

    $("#catalog").addEventListener("click", event => {
      const card = event.target.closest(".upgrade");
      const upgrade = card && upgradeIndex.get(card.dataset.id);
      if (upgrade && document.activeElement === $("#search")) $("#search").blur();
      if (upgrade && isUpgradeConditionallyAvailable(upgrade)) setCount(card.dataset.id, count(card.dataset.id) + 1);
    });

    $("#dps-ranking-list").addEventListener("click", event => {
      const row = event.target.closest("[data-dps-upgrade-id]");
      if (row) setCount(row.dataset.dpsUpgradeId, count(row.dataset.dpsUpgradeId) + 1);
    });

    $("#dps-ranking-toggle").addEventListener("click", () => {
      dpsRankingVisible = !dpsRankingVisible;
      renderDpsRanking();
    });

    $("#catalog").addEventListener("contextmenu", event => {
      const card = event.target.closest(".upgrade");
      const upgrade = card && upgradeIndex.get(card.dataset.id);
      if (!upgrade || !isUpgradeConditionallyAvailable(upgrade)) return;
      event.preventDefault();
      setCount(card.dataset.id, count(card.dataset.id) - 1);
    });

    $("#picked-list").addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;
      setCount(button.dataset.id, count(button.dataset.id) + (button.dataset.action === "plus" ? 1 : -1));
    });

    ["search", "family-filter", "rarity-filter"].forEach(id => {
      $(`#${id}`).addEventListener(id === "search" ? "input" : "change", renderCatalog);
    });

    document.addEventListener("keydown", event => {
      const search = $("#search");
      const interactiveTarget = event.target instanceof Element
        ? event.target.closest('input, textarea, select, button, a[href], [contenteditable]:not([contenteditable="false"])')
        : null;
      if (event.code !== "Space" || event.defaultPrevented || event.repeat || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if ($("#tab-upgrades").hidden || interactiveTarget) return;
      event.preventDefault();
      search.value = "";
      renderCatalog();
      search.focus();
    });

    document.querySelector(".tabs").addEventListener("click", event => {
      const button = event.target.closest("[data-tab]");
      if (!button) return;
      document.querySelectorAll("[data-tab]").forEach(tab => tab.setAttribute("aria-selected", String(tab === button)));
      document.querySelectorAll(".tab-pane").forEach(pane => { pane.hidden = pane.id !== `tab-${button.dataset.tab}`; });
    });

    $("#configuration-content").addEventListener("click", event => {
      const button = event.target.closest("button[data-nekomancer-minion-action]");
      if (!button || selectedClass !== "Nekomancer") return;
      const minion = NEKOMANCER_MINIONS.find(item => item.id === button.dataset.minionId);
      if (!minion) return;
      const countsByType = normalizeNekomancerMinions(buildOptions.nekomancerMinions);
      const total = Object.values(countsByType).reduce((sum, value) => sum + value, 0);
      const direction = button.dataset.nekomancerMinionAction === "add" ? 1 : -1;
      if (direction > 0 && total >= NEKOMANCER_MINION_LIMIT) return;
      countsByType[minion.id] = Math.min(NEKOMANCER_MINION_LIMIT, Math.max(0, countsByType[minion.id] + direction));
      buildOptions.nekomancerMinions = normalizeNekomancerMinions(countsByType);
      saveBuildOptions();
      renderConfiguration();
      renderCalculations();
      renderDpsRanking();
      updateShareWidget();
    });

    $("#configuration-content").addEventListener("change", event => {
      const spellswordDpsToggle = event.target.closest('input[type="checkbox"][name="spellsword-dps"]');
      if (spellswordDpsToggle) {
        if (spellswordDpsToggle.checked) buildOptions.spellswordDamageGroup = spellswordDpsToggle.value === "secondary" ? "secondary" : "primary";
        else spellswordDpsToggle.checked = true;
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const spellswordChargeMode = event.target.closest('input[type="radio"][name="spellsword-charge-mode"]');
      if (spellswordChargeMode) {
        buildOptions.spellswordChargeMode = normalizeSpellswordChargeMode(spellswordChargeMode.value);
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const spellswordChargeInput = event.target.closest('input[name="spellsword-custom-charge"]');
      if (spellswordChargeInput) {
        buildOptions.spellswordCustomChargeTime = clampSpellswordChargeTime(spellswordChargeInput.value);
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const spellswordWhirlwindHits = event.target.closest('input[name="spellsword-whirlwind-hits"]');
      if (spellswordWhirlwindHits) {
        buildOptions.spellswordWhirlwindHits = normalizeSpellswordWhirlwindHits(spellswordWhirlwindHits.value);
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const nekomancerSoulsInput = event.target.closest('input[name="nekomancer-souls"]');
      if (nekomancerSoulsInput) {
        buildOptions.nekomancerSouls = Math.min(5, Math.max(0, Math.floor(Number(nekomancerSoulsInput.value) || 0)));
        saveBuildOptions();
        render();
        return;
      }
      const berserkerStacksInput = event.target.closest('input[name="berserker-soul-stacks"]');
      if (berserkerStacksInput) {
        buildOptions.berserkerSoulStacks = Math.min(berserkerMaximumStacks(), Math.max(0, Math.floor(Number(berserkerStacksInput.value) || 0)));
        saveBuildOptions();
        render();
        return;
      }
      const gunmancerDpsToggle = event.target.closest('input[type="checkbox"][name="gunmancer-dps"]');
      if (gunmancerDpsToggle) {
        const group = gunmancerDpsToggle.value;
        if (group !== "primary" && group !== "secondary") return;
        if (gunmancerDpsToggle.checked) {
          buildOptions.gunmancerPrimaryDamage = group === "primary";
          buildOptions.gunmancerSecondaryDamage = group === "secondary";
        } else {
          gunmancerDpsToggle.checked = true;
        }
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderCatalog();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const damageToggle = event.target.closest('input[type="checkbox"][name$="-damage"]');
      if (damageToggle) {
        if (damageToggle.name === "twinmage-primary-damage") buildOptions.twinmagePrimaryDamage = damageToggle.checked;
        else if (damageToggle.name === "twinmage-secondary-damage") buildOptions.twinmageSecondaryDamage = damageToggle.checked;
        if (!buildOptions.twinmagePrimaryDamage && !buildOptions.twinmageSecondaryDamage) {
          if (damageToggle.name === "twinmage-primary-damage") buildOptions.twinmageSecondaryDamage = true;
          else buildOptions.twinmagePrimaryDamage = true;
        }
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderCatalog();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const gunmancerChoice = event.target.closest('input[type="radio"][name^="gunmancer-"]');
      if (gunmancerChoice) {
        if (gunmancerChoice.name === "gunmancer-primary" && GUNMANCER_ABILITIES.primary.some(ability => ability.id === gunmancerChoice.value)) buildOptions.gunmancerPrimary = gunmancerChoice.value;
        else if (gunmancerChoice.name === "gunmancer-secondary" && GUNMANCER_ABILITIES.secondary.some(ability => ability.id === gunmancerChoice.value)) buildOptions.gunmancerSecondary = gunmancerChoice.value;
        else if (gunmancerChoice.name === "gunmancer-airblast" && ["none", "primary", "secondary"].includes(gunmancerChoice.value)) buildOptions.gunmancerAirblastTarget = gunmancerChoice.value;
        else return;
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderCatalog();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const choice = event.target.closest('input[type="radio"][name^="twinmage-"]');
      if (!choice || !TWINMAGE_ELEMENTS.some(element => element.id === choice.value)) return;
      if (choice.name === "twinmage-primary") buildOptions.twinmagePrimary = choice.value;
      else if (choice.name === "twinmage-secondary") buildOptions.twinmageSecondary = choice.value;
      saveBuildOptions();
      renderConfiguration();
      renderCalculations();
      renderCatalog();
      renderDpsRanking();
      updateShareWidget();
    });

    $("#configuration-content").addEventListener("input", event => {
      const spellswordChargeInput = event.target.closest('input[name="spellsword-custom-charge"]');
      if (spellswordChargeInput) {
        buildOptions.spellswordCustomChargeTime = clampSpellswordChargeTime(spellswordChargeInput.value);
        $("#configuration-content").querySelectorAll('input[name="spellsword-custom-charge"]').forEach(input => { input.value = buildOptions.spellswordCustomChargeTime; });
        saveBuildOptions();
        renderCalculations();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const berserkerStacksInput = event.target.closest('input[name="berserker-soul-stacks"]');
      if (!berserkerStacksInput) return;
      buildOptions.berserkerSoulStacks = Math.min(berserkerMaximumStacks(), Math.max(0, Math.floor(Number(berserkerStacksInput.value) || 0)));
      $("#configuration-content").querySelectorAll('input[name="berserker-soul-stacks"]').forEach(input => { input.value = buildOptions.berserkerSoulStacks; });
      const summary = $("#configuration-content").querySelector(".berserker-stack-summary");
      if (summary) summary.textContent = `${buildOptions.berserkerSoulStacks} / ${berserkerMaximumStacks()}`;
      saveBuildOptions();
      renderStats();
      renderCalculations();
      renderDpsRanking();
      updateShareWidget();
    });

    $("#artifact-catalog").addEventListener("click", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      buildOptions.artifacts[card.dataset.id] = Math.min(100, (buildOptions.artifacts[card.dataset.id] || 0) + 1);
      saveBuildOptions();
      render();
    });
    $("#artifact-catalog").addEventListener("contextmenu", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      event.preventDefault();
      const next = (buildOptions.artifacts[card.dataset.id] || 0) - 1;
      if (next > 0) buildOptions.artifacts[card.dataset.id] = next;
      else delete buildOptions.artifacts[card.dataset.id];
      saveBuildOptions();
      render();
    });

    $("#rune-slots").addEventListener("click", event => {
      if (event.target.closest("select")) return;
      const remove = event.target.closest("[data-remove-rune]");
      if (remove) {
        activeRuneSlot = Number(remove.dataset.removeRune);
        buildOptions.runes[activeRuneSlot] = null;
        saveBuildOptions();
        render();
        return;
      }
      const slot = event.target.closest("[data-slot]");
      if (!slot) return;
      activeRuneSlot = Number(slot.dataset.slot);
      renderRunes();
    });
    $("#rune-slots").addEventListener("change", event => {
      const select = event.target.closest("[data-curse-slot]");
      if (!select) return;
      buildOptions.curses[Number(select.dataset.curseSlot)] = select.value || null;
      saveBuildOptions();
      render();
    });
    $("#rune-catalog").addEventListener("click", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      const existing = buildOptions.runes.indexOf(card.dataset.id);
      if (existing >= 0) {
        buildOptions.runes[existing] = null;
        activeRuneSlot = existing;
      } else {
        buildOptions.runes[activeRuneSlot] = card.dataset.id;
        const next = buildOptions.runes.findIndex((id, index) => !id && index > activeRuneSlot);
        const wrapped = buildOptions.runes.findIndex(id => !id);
        if (next >= 0 || wrapped >= 0) activeRuneSlot = next >= 0 ? next : wrapped;
      }
      saveBuildOptions();
      render();
    });

    $("#class-select").addEventListener("change", event => {
      changeClass(event.target.value);
    });

    $("#reset-build").addEventListener("click", () => {
      Object.keys(counts).forEach(id => delete counts[id]);
      buildOptions.artifacts = {};
      buildOptions.runes = RUNE_SLOTS.map(() => null);
      buildOptions.curses = RUNE_SLOTS.map(() => null);
      activeRuneSlot = 0;
      saveCounts();
      saveBuildOptions();
      render();
    });

    $("#reset-configuration").addEventListener("click", () => {
      resetClassBuildConfiguration(selectedClass);
      buildOptions.berserkerSoulStacks = berserkerMaximumStacks();
      saveBuildOptions();
      render();
    });

    $("#copy-link").addEventListener("click", copyShareUrl);
    window.addEventListener("hashchange", loadBuildFromHash);

    syncClassUi();
    if (new URLSearchParams(location.hash.slice(1)).has("b")) loadBuildFromHash();
    else render();
  </script>
</body>
</html>
