      const ability = gunmancerAbility(group === "primary" ? buildOptions.gunmancerPrimary : buildOptions.gunmancerSecondary, group);
      const primary = gunmancerAbility(buildOptions.gunmancerPrimary, "primary");
      const sources = abilityDamageSourceSpecs("gunmancer", ability, group === "primary" ? "Primary" : "Secondary", attackSpeedMultiplier);
      if (buildOptions.gunmancerAirblastTarget === group) {
        const chargedMultiplier = GUNMANCER_AIRBLAST.chargedMultiplier + count("Gunmancer_Mastery") * .5;
        const additionalDamage = ability.components.reduce((sum, component) => sum + component.damage * (Number(typeof component.projectiles === "function" ? component.projectiles() : component.projectiles) || 1), 0) * (chargedMultiplier - 1);
        sources.push({
          id: "gunmancer-airblast", name: `Charged ${ability.name}`, position: "Airblast charge",
          sourceIcon: GUNMANCER_AIRBLAST.iconUrl, element: ability.components[0].element,
          baseDamage: additionalDamage, canCrit: true, instanceRate: 1 / GUNMANCER_AIRBLAST.cooldown,
          statuses: [], trigger: { type: "cooldown" }
        });
      }
      const primaryActivationRate = primary.interval > 0 ? attackSpeedMultiplier / primary.interval : 0;
      sources.push(...sharedUpgradeSourceSpecs("gunmancer", primaryActivationRate, attackSpeedMultiplier));
      return { className: "Gunmancer", classKey: "gunmancer", sources };
    }

    function buildThaumaturgeSourceModel(stats) {
      const attackSpeedMultiplier = Number(stats.attackSpeed || 0) / 100;
      const primaryActivationRate = THAUMATURGE_PRIMARY.interval > 0 ? attackSpeedMultiplier / THAUMATURGE_PRIMARY.interval : 0;
      return {
        className: "Thaumaturge", classKey: "thaumaturge",
        sources: [
          ...abilityDamageSourceSpecs("thaumaturge", THAUMATURGE_PRIMARY, "Primary", attackSpeedMultiplier),
          ...sharedUpgradeSourceSpecs("thaumaturge", primaryActivationRate, attackSpeedMultiplier)
        ]
      };
    }

    function buildTwinmageSourceModel(stats) {
      const selectedHands = [
        { position: "Primary hand", elementId: buildOptions.twinmagePrimary, enabled: buildOptions.twinmagePrimaryDamage },
        { position: "Secondary hand", elementId: buildOptions.twinmageSecondary, enabled: buildOptions.twinmageSecondaryDamage }
      ].filter(hand => hand.enabled).map(hand => ({ ...hand, element: TWINMAGE_ELEMENTS.find(element => element.id === hand.elementId) })).filter(hand => hand.element);
      if (!selectedHands.length) return { className: "Twinmage", classKey: "twinmage", sources: [], emptyMessage: "Enable at least one hand for damage calculations in Configuration." };
      const attackSpeedMultiplier = Number(stats.attackSpeed || 0) / 100;
      const baseActivationRate = selectedHands.length === 1 ? 1.4 : .8;
      const sinistraStacks = count("Twinmage-Hand-Boost-L");
      const dextraStacks = count("Twinmage-Hand-Boost-R");
      const handMultiplier = position => {
        const positive = position === "Primary hand" ? sinistraStacks : dextraStacks;
        const negative = position === "Primary hand" ? dextraStacks : sinistraStacks;
        return 1 + (positive * 5 - negative * 3) / 100;
      };
      const handSources = selectedHands.map((hand, index) => {
        const sourceMultiplier = handMultiplier(hand.position);
        const statuses = Object.entries(hand.element.statusChances).flatMap(([statusId, chance]) => {
          const effective = effectiveSourceStatusChance(statusId, chance, attackSpeedMultiplier);
          return effective == null ? [] : [{ id: statusId, chance: effective }];
        });
        return {
          id: `twinmage-hand-${index}`, name: hand.element.handName, position: hand.position,
          sourceIcon: hand.element.image, element: hand.element.id, baseDamage: hand.element.baseDamage, canCrit: true,
          activationRate: baseActivationRate * attackSpeedMultiplier * sourceMultiplier,
          instancesPerActivation: 1, projectiles: 1, sourceMultiplier, statuses,
          handAttackSpeedMultiplier: sourceMultiplier, baseActivationRate
        };
      });
      const masterySources = count("Twinmage_Mastery") > 0 ? handSources.map((source, index) => ({
        ...source, id: `twinmage-mastery-${index}`, name: `${TWINMAGE_ELEMENTS.find(element => element.id === source.element)?.name || source.name} Blast`,
        position: "Mastery explosion", sourceUpgradeId: "Twinmage_Mastery", baseDamage: source.baseDamage * .25,
        trigger: { type: "sourceActivation", sourceId: source.id }, linkedSourceId: source.id
      })) : [];
      const primarySource = handSources.find(source => source.position === "Primary hand");
      const sharedSources = primarySource
        ? sharedUpgradeSourceSpecs("twinmage", primarySource.activationRate, attackSpeedMultiplier).map(source => source.id.endsWith("flaming-spirit") ? { ...source, sourceMultiplier: primarySource.sourceMultiplier } : source)
        : sharedUpgradeSourceSpecs("twinmage", 0, attackSpeedMultiplier);
      return { className: "Twinmage", classKey: "twinmage", sources: [...handSources, ...masterySources, ...sharedSources] };
    }

    function buildUnifiedCalculationModel() {
      const stats = latestCalculation.stats;
      const sourceModel = selectedClass === "Twinmage" ? buildTwinmageSourceModel(stats)
        : selectedClass === "Gunmancer" ? buildGunmancerSourceModel(stats)
          : selectedClass === "Thaumaturge" ? buildThaumaturgeSourceModel(stats)
            : null;
      if (!sourceModel) return null;
      const criticalChancePercent = count("Pocket_Abacus") > 0 ? 20 : Number(stats.criticalChance || 0);
      const elementalMultipliers = calculationElementMultipliers(stats);
      const sources = sourceModel.sources.map(source => ({
        ...source,
        overallMultiplier: Number(stats.overallDamage || 0) / 100,
        elementalMultiplier: elementalMultipliers[source.element] || 1
      }));
      const calculation = EclipticaCalculationEngine.calculate({
        sources,
        criticalChance: Math.max(0, criticalChancePercent) / 100,
        criticalDamageMultiplier: Number(stats.criticalDamage || 0) / 100,
        overallMultiplier: Number(stats.overallDamage || 0) / 100,
        elementalMultipliers,
        statusDefinitions: { ...DAMAGE_STATUS_DEFINITIONS, ...Object.fromEntries(NON_DAMAGE_STATUS_DEFINITIONS.map(status => [status.id, status])) },
        stickyStacks: count("Sticky")
      });
      return { ...sourceModel, ...calculation, criticalChancePercent, criticalDamagePercent: Number(stats.criticalDamage || 0) };
    }

    function renderUnifiedCalculations(options = {}) {
      const { render = true } = options;
      const content = $("#calculation-content");
      const model = buildUnifiedCalculationModel();
      if (!model) {
        if (render) content.innerHTML = '<div class="calculation-empty">Damage calculations are currently available for Twinmage, Gunmancer, and Thaumaturge.</div>';
        return { combinedTotalDps: 0 };
      }
      if (model.emptyMessage) {
        if (render) content.innerHTML = `<div class="calculation-empty">${escapeHtml(model.emptyMessage)}</div>`;
        return { combinedTotalDps: 0 };
      }
      if (!render) return { combinedTotalDps: model.combinedTotalDps };

      const number = value => Number(value).toFixed(2);
      const rateNumber = value => Number(value).toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
      const percent = value => `${Number(value * 100).toFixed(2).replace(/\.00$/, "")}%`;
      const calculationAttributes = (key, formula, refs = []) => `data-calculation-key="${escapeHtml(key)}" data-calculation-formula="${escapeHtml(formula)}" data-calculation-refs="${escapeHtml(refs.join("|"))}" tabindex="0"`;
      const damageKey = (source, rowKey) => `damage:${source.id}:${rowKey}`;
      const sourceIconAttributes = source => source.sourceIcon ? `data-calculation-source-icon="${escapeHtml(source.sourceIcon)}"` : "";
      const sourceUpgradeAttributes = source => source.sourceUpgradeId ? `data-calculation-source-upgrade="${escapeHtml(source.sourceUpgradeId)}"` : "";
      const damageTypeAttributes = source => `data-calculation-damage-type="${escapeHtml(source.element)}" data-calculation-damage-id="${escapeHtml(source.element)}"`;
      const hasSourceMultiplier = model.damageSources.some(source => !source.isStatusEffect && Math.abs(source.damage.sourceMultiplier - 1) > .0001);
      const hasMultipleProjectiles = model.attackSources.some(source => source.projectiles > 1);
      const sourceStatusLines = source => source.statuses.map(status => `${status.name || model.statuses.find(item => item.id === status.id)?.name || status.id} chance: ${percent(status.chance)} per instance`);
      const sourceFormula = source => [
        source.name,
        `${source.element[0].toUpperCase()}${source.element.slice(1)} · Base ${source.baseDamage}`,
        `Crit: ${source.canCrit ? "Yes" : "No"}`,
        ...(source.projectiles > 1 ? [`Projectiles: ${source.projectiles}`] : []),
        ...sourceStatusLines(source)
      ].join("\n");
      const rateFormula = source => {
        if (source.isStatusEffect) return `1 ÷ ${number(1 / source.damage.instancesPerSecond)}s = ${number(source.damage.instancesPerSecond)}/s`;
        if (source.trigger?.type === "onCrit") return `Crits per second = ${number(model.criticalHitsPerSecond)}/s`;
        if (source.trigger?.type === "primaryActivation") return `Matches primary activations = ${number(source.damage.instancesPerSecond)}/s`;
        if (source.trigger?.type === "cooldown") return `Cooldown trigger = ${number(source.damage.instancesPerSecond)}/s`;
        if (source.trigger?.type === "sourceActivation") return `Matches source activations = ${number(source.damage.instancesPerSecond)}/s`;
        return `${number(source.activationRate || 0)} activations/s × ${source.instancesPerActivation} instances = ${number(source.damage.instancesPerSecond)}/s`;
      };
      const rows = [
        { key: "base", label: "Base Damage", value: source => String(source.baseDamage), exact: source => source.baseDamage, formula: source => `Base damage per instance = ${source.baseDamage}`, damageValue: true },
        { key: "overall", label: "Overall Damage", value: source => source.damage.overallDamageApplies ? number(source.damage.overallMultiplier) : "-", exact: source => source.damage.overallDamageApplies ? source.damage.overallMultiplier : null, formula: source => source.damage.overallDamageApplies ? `${number(source.damage.overallMultiplier * 100)}% ÷ 100` : "Does not apply to this damage source", refs: source => source.damage.overallDamageApplies ? ["stat:overallDamage"] : [] },
        { key: "elemental", label: "Elemental Damage", value: source => number(source.damage.elementalMultiplier), exact: source => source.damage.elementalMultiplier, formula: source => source.damageScaling === .75 ? `1 + (elemental multiplier - 1) × 75% = ${number(source.damage.elementalMultiplier)}` : `${number(source.damage.elementalMultiplier * 100)}% ÷ 100`, refs: source => [`stat:${source.element}Damage`] },
        { key: "crit", label: "Eff. Crit Multiplier", value: source => source.canCrit ? number(source.damage.effectiveCriticalMultiplier) : "-", exact: source => source.damage.effectiveCriticalMultiplier, formula: source => source.canCrit ? `Effective crit multiplier = ${number(source.damage.effectiveCriticalMultiplier)}` : "This damage cannot crit", refs: source => source.canCrit ? ["calc:crit:effective"] : [] },
        ...(hasSourceMultiplier ? [{ key: "source-multiplier", label: "Hand Damage", value: source => source.isStatusEffect || Math.abs(source.damage.sourceMultiplier - 1) < .0001 ? "-" : number(source.damage.sourceMultiplier), exact: source => source.damage.sourceMultiplier, formula: source => source.isStatusEffect || Math.abs(source.damage.sourceMultiplier - 1) < .0001 ? "Does not apply to this damage source" : `Source multiplier = ${number(source.damage.sourceMultiplier)}` }] : []),
        ...(hasMultipleProjectiles ? [{ key: "projectiles", label: "Projectiles / Shot", value: source => source.isStatusEffect || source.trigger ? "-" : String(source.projectiles), exact: source => source.projectiles, formula: source => source.isStatusEffect || source.trigger ? "Not projectile-count based" : `${source.projectiles} damage instances per activation` }] : []),
        { key: "average", label: "Average Damage", value: source => number(source.damage.averageDamage), exact: source => source.damage.averageDamage, formula: source => source.canCrit ? `Non-crit: ${source.damage.nonCriticalDamage}\nCrit: ${source.damage.criticalDamage}\nAverage: ${source.damage.nonCriticalDamage} × ${number((1 - model.context.criticalChance) * 100)}% + ${source.damage.criticalDamage} × ${number(model.context.criticalChance * 100)}% = ${number(source.damage.averageDamage)}` : `Average: ${number(source.damage.averageDamage)}`, refs: source => ["base", "overall", "elemental", "crit"].map(key => `calc:${damageKey(source, key)}`), sectionBreak: true, damageValue: true },
        { key: "rate", label: "Instance Rate", value: source => number(source.damage.instancesPerSecond), exact: source => source.damage.instancesPerSecond, formula: rateFormula, refs: source => source.trigger?.type === "onCrit" ? ["calc:crit:rate"] : source.isStatusEffect ? [] : ["stat:attackSpeed"] },
        { key: "dps", label: "DPS", value: source => number(source.damage.dps), exact: source => source.damage.dps, formula: source => `${number(source.damage.averageDamage)} × ${number(source.damage.instancesPerSecond)} = ${number(source.damage.dps)}`, refs: source => [`calc:${damageKey(source, "average")}`, `calc:${damageKey(source, "rate")}`], damageValue: true },
        { key: "uptime", label: "Uptime", value: source => percent(source.damage.uptime), exact: source => source.damage.uptime, formula: source => source.isStatusEffect ? `${number(source.statusDuration)}s duration ÷ ${number(source.statusInterval)}s interval = ${percent(source.damage.uptime)}` : "Always active = 100%" },
        { key: "total-dps", label: "Total DPS", value: source => number(source.damage.totalDps), exact: source => source.damage.totalDps, formula: source => `${number(source.damage.dps)} × ${percent(source.damage.uptime)} = ${number(source.damage.totalDps)}`, refs: source => [`calc:${damageKey(source, "dps")}`, `calc:${damageKey(source, "uptime")}`], sectionBreak: true, total: true, damageValue: true }
      ];
      const statusRows = status => {
        const breakdown = {
          sources: status.sources.map(source => ({ name: source.name, instancesPerSecond: rateNumber(source.instancesPerSecond), chance: percent(source.applicationChance), applicationsPerSecond: rateNumber(source.applicationsPerSecond) })),
          total: rateNumber(status.applicationsPerSecond), interval: number(status.applicationInterval)
        };
        const rowsForStatus = [{
          key: `${status.id}:interval`, label: "Average time between applications", value: `${number(status.applicationInterval)} s`, exact: status.applicationInterval,
          formula: `1 ÷ ${rateNumber(status.applicationsPerSecond)} applications/s = ${number(status.applicationInterval)}s`, applicationBreakdown: breakdown
        }];
        if (status.stacksPerApplication == null) {
          rowsForStatus.push({ key: `${status.id}:stacks`, label: "Stacks per application", value: "?", exact: "unknown", formula: "Not configured yet", unknown: true });
          rowsForStatus.push({ key: `${status.id}:uptime`, label: "Uptime", value: "?", exact: "unknown", formula: "Not configured yet", unknown: true });
        } else {
          rowsForStatus.push({ key: `${status.id}:stacks`, label: "Stacks per application", value: String(status.stacksPerApplication), exact: status.stacksPerApplication, formula: `${status.baseStacks} base + Sticky` });
          rowsForStatus.push({ key: `${status.id}:duration`, label: `${status.name} duration`, value: `${number(status.duration)} s`, exact: status.duration, formula: `${status.stacksPerApplication} stacks × ${number(status.durationPerStack)}s` });
          rowsForStatus.push({ key: `${status.id}:uptime`, label: "Uptime", value: percent(status.uptime), valueHtml: status.rawUptime > 1 ? `100% <span class="status-uncapped-uptime">(${percent(status.rawUptime)})</span>` : null, exact: status.uptime, formula: `${number(status.duration)}s ÷ ${number(status.applicationInterval)}s = ${percent(status.rawUptime)}${status.rawUptime > 1 ? "; capped at 100%" : ""}` });
        }
        return rowsForStatus;
      };
      const statusMarkup = model.statuses.map(status => {
        const rowsForStatus = statusRows(status);
        return `<section class="status-table-wrap" data-status="${escapeHtml(status.id)}"><table class="status-table"><thead><tr><th colspan="2">Status: ${escapeHtml(status.name)}</th></tr></thead><tbody>${rowsForStatus.map(row => `<tr><th scope="row" class="status-label">${escapeHtml(row.label)}</th><td class="status-value ${row.unknown ? "status-value-unknown" : ""}" data-exact-value="${escapeHtml(String(row.exact))}" ${row.applicationBreakdown ? `data-application-breakdown="${escapeHtml(JSON.stringify(row.applicationBreakdown))}"` : ""} ${calculationAttributes(row.key, row.formula)}>${row.valueHtml || escapeHtml(row.value)}</td></tr>`).join("")}</tbody>${status.note ? `<tfoot><tr><td class="status-note" colspan="2">${escapeHtml(status.note)}</td></tr></tfoot>` : ""}</table></section>`;
      }).join("");
      const criticalRows = [
        ["crit:chance", "Crit Chance", `${number(model.criticalChancePercent)}%`, count("Pocket_Abacus") > 0 ? "Pocket Abacus guarantees every fifth damage instance: effective 20%" : `Stats = ${number(model.criticalChancePercent)}%`],
        ["crit:damage", "Crit Damage", `${number(model.criticalDamagePercent)}%`, `Stats = ${number(model.criticalDamagePercent)}%`],
        ["crit:rate", "Crits per second", number(model.criticalHitsPerSecond), `(${number(model.criticalInstanceRate)}) × ${number(model.context.criticalChance * 100)}% = ${number(model.criticalHitsPerSecond)}`],
        ["crit:effective", "Eff. Crit Multiplier", number(1 + (model.context.criticalDamageMultiplier - 1) * model.context.criticalChance), "Weighted critical multiplier"]
      ];
      const combinedBreakdown = Object.values(model.damageSources.reduce((groups, source) => {
        groups[source.element] ||= { id: source.element, name: source.element[0].toUpperCase() + source.element.slice(1), exact: 0 };
        groups[source.element].exact += source.damage.totalDps;
        return groups;
      }, {})).map(item => ({ ...item, value: number(item.exact) }));
      const columns = model.damageSources;
      content.innerHTML = `<div class="calculation-stack"><section class="damage-calculation"><div class="damage-table-wrap"><table class="damage-table ${model.classKey === "twinmage" && model.attackSources.filter(source => source.position?.includes("hand")).length > 1 ? "dual-hand" : "single-hand"} shared-ability-table"><colgroup><col class="damage-label-col"><col class="damage-data-col" span="${columns.length}"></colgroup><thead><tr><th scope="col"><span class="damage-hand-position">Current build</span><span class="damage-hand-title">${escapeHtml(model.className)}</span></th>${columns.map(source => `<th scope="col" class="damage-column ${source.isStatusEffect ? "status-effect-column" : ""} ${source.isStatusGroupStart ? "status-group-start" : ""}" data-element="${escapeHtml(source.element)}" ${calculationAttributes(`source:${source.id}`, sourceFormula(source))} ${sourceIconAttributes(source)} ${sourceUpgradeAttributes(source)}><span class="damage-hand-position">${escapeHtml(source.position)}</span><span class="damage-hand-title">${escapeHtml(source.name)}</span></th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr class="${row.sectionBreak ? "damage-section-break " : ""}${row.total ? "damage-total-row" : ""}"><th scope="row" class="damage-label">${escapeHtml(row.label)}</th>${columns.map(source => `<td class="damage-column ${source.isStatusEffect ? "status-effect-column" : ""} ${source.isStatusGroupStart ? "status-group-start" : ""}" data-element="${escapeHtml(source.element)}"><span class="damage-value ${row.value(source) === "-" ? "damage-value-unknown" : ""}" data-exact-value="${escapeHtml(String(row.exact(source)))}" ${calculationAttributes(damageKey(source, row.key), row.formula(source), row.refs ? row.refs(source) : [])} ${row.damageValue ? damageTypeAttributes(source) : ""} ${sourceIconAttributes(source)} ${sourceUpgradeAttributes(source)}>${escapeHtml(row.value(source))}</span></td>`).join("")}</tr>`).join("")}</tbody><tfoot><tr class="damage-combined-row"><th scope="row" class="damage-combined-label">Combined DPS</th><td colspan="${columns.length}" class="damage-column"><span class="damage-combined-value" data-exact-value="${escapeHtml(String(model.combinedTotalDps))}" data-calculation-breakdown="${escapeHtml(JSON.stringify(combinedBreakdown))}" ${calculationAttributes("damage:combined:total-dps", `${columns.map(source => number(source.damage.totalDps)).join(" + ")} = ${number(model.combinedTotalDps)}`)}>${number(model.combinedTotalDps)}</span></td></tr></tfoot></table></div></section><div class="calculation-secondary"><section class="crit-table-wrap"><table class="crit-table"><thead><tr><th colspan="2">Critical hits</th></tr></thead><tbody>${criticalRows.map(row => `<tr><th scope="row" class="crit-label">${escapeHtml(row[1])}</th><td class="crit-value" ${calculationAttributes(row[0], row[3])}>${escapeHtml(row[2])}</td></tr>`).join("")}</tbody></table></section>${statusMarkup}</div></div>`;
      return { combinedTotalDps: model.combinedTotalDps };
    }

    function renderCalculations(options = {}) {
      return renderUnifiedCalculations(options);
    }

    window.EclipticaBuildForge = {
      buildUnifiedCalculationModel,
      renderCalculations
    };

    function renderRunes() {
      const curseOptions = `<option value="">No curse selected</option>${CURSES.map(curse =>
        `<option value="${curse.id}">Runic Curse: ${escapeHtml(curse.name)}</option>`).join("")}`;
      $("#rune-slots").innerHTML = RUNE_SLOTS.map((slot, index) => {
        const rune = RUNES.find(item => item.id === buildOptions.runes[index]);
        return `<div class="rune-slot ${activeRuneSlot === index ? "active" : ""}" data-slot="${index}" role="button" tabindex="0">
          <span class="slot-name">${slot}</span>
          ${rune ? `<button class="remove-rune" type="button" data-remove-rune="${index}" aria-label="Remove ${escapeHtml(rune.name)} from ${slot}">×</button>` : ""}
          ${rune ? `<img class="slot-rune-art" src="pictures/${encodeURIComponent(rune.image)}" alt="">` : `<span class="slot-rune-empty" aria-hidden="true">◇</span>`}
          <span class="slot-rune">${rune ? escapeHtml(rune.name) : "Choose a rune…"}</span>
          <div class="curse-row">${buildOptions.curses[index] ? `<img class="curse-art" src="pictures/Runic_Curse.png" alt="Runic Curse">` : ""}<select class="curse-select" data-curse-slot="${index}" aria-label="${slot} Runic Curse">${curseOptions}</select></div>
        </div>`;
      }).join("");
      buildOptions.curses.forEach((curse, index) => { $(`[data-curse-slot="${index}"]`).value = curse || ""; });
      $("#rune-catalog").innerHTML = RUNES.map(item => {
        const selectedSlot = buildOptions.runes.indexOf(item.id);
        return `<article class="upgrade rune-card ${selectedSlot >= 0 ? "selected" : ""}" data-id="${item.id}">
          ${selectedSlot >= 0 ? `<span class="count">${selectedSlot + 1}</span>` : ""}
          <div class="item-placeholder"><img class="item-art" src="pictures/${encodeURIComponent(item.image)}" alt="${escapeHtml(item.name)}"></div>
          <div class="upgrade-copy"><h3 class="upgrade-name">${escapeHtml(item.name)}</h3>
            <div class="meta">Rune</div><p class="effect">${escapeHtml(item.effect)}</p></div>
        </article>`;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function render() {
      renderStats();
      renderConfiguration();
      renderCalculations();
      renderPicked();
      renderCatalog();
      renderDpsRanking();
      renderArtifacts();
      renderRunes();
      updateShareWidget();
    }

    function changeClass(nextClass) {
      if (!CLASS_FAMILIES.includes(nextClass) || nextClass === selectedClass) return;
      dpsRankingRun += 1;
      if (dpsRankingFrame !== null) {
        cancelAnimationFrame(dpsRankingFrame);
        dpsRankingFrame = null;
      }
      if (dpsRankingSnapshot) {
        restoreCounts(dpsRankingSnapshot);
        restoreRankingBuildOptions(dpsRankingBuildOptionsSnapshot);
        dpsRankingSnapshot = null;
        dpsRankingBuildOptionsSnapshot = null;
      }
      hideCalculationTooltip();
      selectedClass = nextClass;
      buildOptions.berserkerSoulStacks = berserkerMaximumStacks(rawCount(berserkerVariantForClass()?.id));
      safeSetStorage("ecliptica-upgrade-explorer-class", selectedClass);
      saveBuildOptions();
      syncClassUi();
      $("#configuration-content").replaceChildren();
      $("#calculation-content").replaceChildren();
      renderStats();
      renderConfiguration();
      renderCalculations();
      renderPicked();
      renderCatalog();
      renderDpsRanking();
      renderArtifacts();
      renderRunes();
      updateShareWidget();
    }

    $("#stats").addEventListener("mouseover", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row) showStatTooltip(row);
    });

    $("#stats").addEventListener("mouseout", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row && !row.contains(event.relatedTarget)) hideStatTooltip();
    });

    $("#stats").addEventListener("focusin", event => {
      const row = event.target.closest(".stat-row[data-stat]");
      if (row) showStatTooltip(row);
    });

    $("#stats").addEventListener("focusout", hideStatTooltip);

    $("#calculation-content").addEventListener("mouseover", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value) showCalculationTooltip(value, event.clientX, event.clientY);
    });

    $("#calculation-content").addEventListener("mousemove", event => {
      if (event.target.closest("[data-calculation-formula]")) positionCalculationTooltip(event.clientX, event.clientY);
    });

    $("#calculation-content").addEventListener("mouseout", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value && !value.contains(event.relatedTarget)) hideCalculationTooltip();
    });

    $("#calculation-content").addEventListener("focusin", event => {
      const value = event.target.closest("[data-calculation-formula]");
      if (value) showCalculationTooltip(value);
    });

    $("#calculation-content").addEventListener("focusout", hideCalculationTooltip);

    $("#catalog").addEventListener("click", event => {
      const card = event.target.closest(".upgrade");
      const upgrade = card && upgradeIndex.get(card.dataset.id);
      if (upgrade && isUpgradeConditionallyAvailable(upgrade)) setCount(card.dataset.id, count(card.dataset.id) + 1);
    });

    $("#dps-ranking-list").addEventListener("click", event => {
      const row = event.target.closest("[data-dps-upgrade-id]");
      if (row) setCount(row.dataset.dpsUpgradeId, count(row.dataset.dpsUpgradeId) + 1);
    });

    $("#dps-ranking-toggle").addEventListener("click", () => {
      dpsRankingVisible = !dpsRankingVisible;
      renderDpsRanking();
    });

    $("#catalog").addEventListener("contextmenu", event => {
      const card = event.target.closest(".upgrade");
      const upgrade = card && upgradeIndex.get(card.dataset.id);
      if (!upgrade || !isUpgradeConditionallyAvailable(upgrade)) return;
      event.preventDefault();
      setCount(card.dataset.id, count(card.dataset.id) - 1);
    });

    $("#picked-list").addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;
      setCount(button.dataset.id, count(button.dataset.id) + (button.dataset.action === "plus" ? 1 : -1));
    });

    ["search", "family-filter", "rarity-filter"].forEach(id => {
      $(`#${id}`).addEventListener(id === "search" ? "input" : "change", renderCatalog);
    });

    document.querySelector(".explorer").addEventListener("keydown", event => {
      const search = $("#search");
      if (event.code !== "Space" || event.target === search || event.defaultPrevented) return;
      event.preventDefault();
      if (search.value) {
        search.value = "";
        renderCatalog();
      }
      search.focus();
    });

    document.querySelector(".tabs").addEventListener("click", event => {
      const button = event.target.closest("[data-tab]");
      if (!button) return;
      document.querySelectorAll("[data-tab]").forEach(tab => tab.setAttribute("aria-selected", String(tab === button)));
      document.querySelectorAll(".tab-pane").forEach(pane => { pane.hidden = pane.id !== `tab-${button.dataset.tab}`; });
    });

    $("#configuration-content").addEventListener("change", event => {
      const berserkerStacksInput = event.target.closest('input[name="berserker-soul-stacks"]');
      if (berserkerStacksInput) {
        buildOptions.berserkerSoulStacks = Math.min(berserkerMaximumStacks(), Math.max(0, Math.floor(Number(berserkerStacksInput.value) || 0)));
        saveBuildOptions();
        render();
        return;
      }
      const gunmancerDpsToggle = event.target.closest('input[type="checkbox"][name="gunmancer-dps"]');
      if (gunmancerDpsToggle) {
        const group = gunmancerDpsToggle.value;
        if (group !== "primary" && group !== "secondary") return;
        if (gunmancerDpsToggle.checked) {
          buildOptions.gunmancerPrimaryDamage = group === "primary";
          buildOptions.gunmancerSecondaryDamage = group === "secondary";
        } else {
          gunmancerDpsToggle.checked = true;
        }
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderCatalog();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const damageToggle = event.target.closest('input[type="checkbox"][name$="-damage"]');
      if (damageToggle) {
        if (damageToggle.name === "twinmage-primary-damage") buildOptions.twinmagePrimaryDamage = damageToggle.checked;
        else if (damageToggle.name === "twinmage-secondary-damage") buildOptions.twinmageSecondaryDamage = damageToggle.checked;
        if (!buildOptions.twinmagePrimaryDamage && !buildOptions.twinmageSecondaryDamage) {
          if (damageToggle.name === "twinmage-primary-damage") buildOptions.twinmageSecondaryDamage = true;
          else buildOptions.twinmagePrimaryDamage = true;
        }
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderCatalog();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const gunmancerChoice = event.target.closest('input[type="radio"][name^="gunmancer-"]');
      if (gunmancerChoice) {
        if (gunmancerChoice.name === "gunmancer-primary" && GUNMANCER_ABILITIES.primary.some(ability => ability.id === gunmancerChoice.value)) buildOptions.gunmancerPrimary = gunmancerChoice.value;
        else if (gunmancerChoice.name === "gunmancer-secondary" && GUNMANCER_ABILITIES.secondary.some(ability => ability.id === gunmancerChoice.value)) buildOptions.gunmancerSecondary = gunmancerChoice.value;
        else if (gunmancerChoice.name === "gunmancer-airblast" && ["none", "primary", "secondary"].includes(gunmancerChoice.value)) buildOptions.gunmancerAirblastTarget = gunmancerChoice.value;
        else return;
        saveBuildOptions();
        renderConfiguration();
        renderCalculations();
        renderCatalog();
        renderDpsRanking();
        updateShareWidget();
        return;
      }
      const choice = event.target.closest('input[type="radio"][name^="twinmage-"]');
      if (!choice || !TWINMAGE_ELEMENTS.some(element => element.id === choice.value)) return;
      if (choice.name === "twinmage-primary") buildOptions.twinmagePrimary = choice.value;
      else if (choice.name === "twinmage-secondary") buildOptions.twinmageSecondary = choice.value;
      saveBuildOptions();
      renderConfiguration();
      renderCalculations();
      renderCatalog();
      renderDpsRanking();
      updateShareWidget();
    });

    $("#configuration-content").addEventListener("input", event => {
      const berserkerStacksInput = event.target.closest('input[name="berserker-soul-stacks"]');
      if (!berserkerStacksInput) return;
      buildOptions.berserkerSoulStacks = Math.min(berserkerMaximumStacks(), Math.max(0, Math.floor(Number(berserkerStacksInput.value) || 0)));
      $("#configuration-content").querySelectorAll('input[name="berserker-soul-stacks"]').forEach(input => { input.value = buildOptions.berserkerSoulStacks; });
      const summary = $("#configuration-content").querySelector(".berserker-stack-summary");
      if (summary) summary.textContent = `${buildOptions.berserkerSoulStacks} / ${berserkerMaximumStacks()}`;
      saveBuildOptions();
      renderStats();
      renderCalculations();
      renderDpsRanking();
      updateShareWidget();
    });

    $("#artifact-catalog").addEventListener("click", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      buildOptions.artifacts[card.dataset.id] = Math.min(100, (buildOptions.artifacts[card.dataset.id] || 0) + 1);
      saveBuildOptions();
      render();
    });
    $("#artifact-catalog").addEventListener("contextmenu", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      event.preventDefault();
      const next = (buildOptions.artifacts[card.dataset.id] || 0) - 1;
      if (next > 0) buildOptions.artifacts[card.dataset.id] = next;
      else delete buildOptions.artifacts[card.dataset.id];
      saveBuildOptions();
      render();
    });

    $("#rune-slots").addEventListener("click", event => {
      if (event.target.closest("select")) return;
      const remove = event.target.closest("[data-remove-rune]");
      if (remove) {
        activeRuneSlot = Number(remove.dataset.removeRune);
        buildOptions.runes[activeRuneSlot] = null;
        saveBuildOptions();
        render();
        return;
      }
      const slot = event.target.closest("[data-slot]");
      if (!slot) return;
      activeRuneSlot = Number(slot.dataset.slot);
      renderRunes();
    });
    $("#rune-slots").addEventListener("change", event => {
      const select = event.target.closest("[data-curse-slot]");
      if (!select) return;
      buildOptions.curses[Number(select.dataset.curseSlot)] = select.value || null;
      saveBuildOptions();
      render();
    });
    $("#rune-catalog").addEventListener("click", event => {
      const card = event.target.closest("[data-id]");
      if (!card) return;
      const existing = buildOptions.runes.indexOf(card.dataset.id);
      if (existing >= 0) {
        buildOptions.runes[existing] = null;
        activeRuneSlot = existing;
      } else {
        buildOptions.runes[activeRuneSlot] = card.dataset.id;
        const next = buildOptions.runes.findIndex((id, index) => !id && index > activeRuneSlot);
        const wrapped = buildOptions.runes.findIndex(id => !id);
        if (next >= 0 || wrapped >= 0) activeRuneSlot = next >= 0 ? next : wrapped;
      }
      saveBuildOptions();
      render();
    });

    $("#class-select").addEventListener("change", event => {
      changeClass(event.target.value);
    });

    $("#reset-build").addEventListener("click", () => {
      Object.keys(counts).forEach(id => delete counts[id]);
      buildOptions.artifacts = {};
      buildOptions.runes = RUNE_SLOTS.map(() => null);
      buildOptions.curses = RUNE_SLOTS.map(() => null);
      buildOptions.twinmagePrimary = "fire";
      buildOptions.twinmageSecondary = "lightning";
      buildOptions.twinmagePrimaryDamage = true;
      buildOptions.twinmageSecondaryDamage = true;
      buildOptions.gunmancerPrimary = "va11";
      buildOptions.gunmancerSecondary = "photon";
      buildOptions.gunmancerPrimaryDamage = true;
      buildOptions.gunmancerSecondaryDamage = false;
      buildOptions.gunmancerAirblastTarget = "none";
      buildOptions.berserkerSoulStacks = 0;
      activeRuneSlot = 0;
      saveCounts();
      saveBuildOptions();
      render();
    });

    $("#copy-link").addEventListener("click", copyShareUrl);
    window.addEventListener("hashchange", loadBuildFromHash);

    syncClassUi();
    if (new URLSearchParams(location.hash.slice(1)).has("b")) loadBuildFromHash();
    else render();
  </script>
</body>
</html>
