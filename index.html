<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecliptica Build Forge</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f2ff;
      --muted: #ad9ebd;
      --panel: rgba(18, 7, 31, .86);
      --panel-2: rgba(35, 14, 55, .82);
      --class-rgb: 255, 0, 244;
      --class-deep: #170319;
      --class-logo: url("pictures/Class7.png");
      --line: rgba(var(--class-rgb), .19);
      --accent: rgb(var(--class-rgb));
      --physical: #ff5b6e;
      --fire: #ff612f;
      --frost: #42cfff;
      --electric: #ffe31f;
      --luminous: #dbef71;
      --shadow: #b83cff;
      --poison: #ff3fc8;
      --positive: #8ef6b1;
      --negative: #ff8b9c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 11% 18%, rgba(var(--class-rgb), .31), transparent 31rem),
        radial-gradient(circle at 84% 75%, rgba(var(--class-rgb), .17), transparent 38rem),
        linear-gradient(145deg, var(--class-deep), #07030b 66%, var(--class-deep));
      background-attachment: fixed;
    }

    body[data-class="Spellsword"] { --class-rgb: 255, 20, 28; --class-deep: #1c0307; --class-logo: url("pictures/Class1.png"); }
    body[data-class="Twinmage"] { --class-rgb: 0, 204, 24; --class-deep: #031a0a; --class-logo: url("pictures/Class2.png"); }
    body[data-class="Gunmancer"] { --class-rgb: 191, 207, 229; --class-deep: #0a0e16; --class-logo: url("pictures/Class3.png"); }
    body[data-class="Fistmage"] { --class-rgb: 255, 235, 0; --class-deep: #1b1700; --class-logo: url("pictures/Class4.png"); }
    body[data-class="Spellhammer"] { --class-rgb: 255, 126, 0; --class-deep: #211003; --class-logo: url("pictures/Class5.png"); }
    body[data-class="Shield Mage"] { --class-rgb: 0, 229, 239; --class-deep: #021b20; --class-logo: url("pictures/Class6.png"); }
    body[data-class="Thaumaturge"] { --class-rgb: 255, 0, 244; --class-deep: #1c031d; --class-logo: url("pictures/Class7.png"); }
    body[data-class="Nekomancer"] { --class-rgb: 139, 28, 255; --class-deep: #120326; --class-logo: url("pictures/Class8.png"); }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    body::after {
      content: "";
      position: fixed;
      z-index: 0;
      right: -5vw;
      bottom: -16vh;
      width: min(68vw, 920px);
      height: min(82vh, 920px);
      pointer-events: none;
      opacity: .075;
      background: var(--class-logo) right bottom / contain no-repeat;
      filter: saturate(1.25);
    }

    button, input, select { font: inherit; }
    button { color: inherit; }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: rgb(var(--class-rgb));
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 2rem);
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .class-logo {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      object-fit: contain;
      filter: drop-shadow(0 7px 16px rgba(var(--class-rgb), .28));
    }

    .reset, .clear-search {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.045);
      padding: 9px 13px;
      cursor: pointer;
    }

    .reset:hover, .clear-search:hover { border-color: rgba(217, 164, 255, .55); }

    .top-actions {
      display: flex;
      align-items: end;
      gap: 9px;
    }

    .class-picker {
      display: grid;
      gap: 4px;
      color: #bdaac9;
      font-size: .61rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .class-picker select {
      min-width: 170px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: rgba(12, 4, 20, .82);
      padding: 8px 10px;
      text-transform: none;
    }

    .class-picker select:focus { border-color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: minmax(310px, 390px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(var(--class-rgb), .105), var(--panel));
      box-shadow: 0 24px 70px rgba(0,0,0,.32);
      backdrop-filter: blur(14px);
    }

    .stats-panel {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 20px;
    }

    .panel-title {
      margin: 0;
      font-size: .78rem;
      color: #cbb7da;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .stat-list {
      margin-top: 15px;
      display: grid;
      gap: 3px;
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-stretch: condensed;
      font-size: .94rem;
      font-weight: 800;
      font-style: normal;
      text-transform: none;
    }

    .stat-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: baseline;
      min-height: 20px;
      padding: 1px 5px;
      border-radius: 5px;
      cursor: help;
    }

    .stat-row.element { padding-left: 28px; }
    .stat-row.changed { background: rgba(255,255,255,.045); }
    .stat-row .value { color: #fff; white-space: nowrap; }
    .stat-row .delta { margin-left: 4px; font-size: .7rem; font-style: normal; }
    .delta.up { color: var(--positive); }
    .delta.down { color: var(--negative); }
    .stat-gap { height: 13px; }
    .physical { color: var(--physical); }
    .fire { color: var(--fire); }
    .frost { color: var(--frost); }
    .electric { color: var(--electric); }
    .luminous { color: var(--luminous); }
    .shadow { color: var(--shadow); }
    .poison { color: var(--poison); }

    .stat-tooltip {
      position: fixed;
      z-index: 1000;
      display: none;
      width: min(650px, calc(100vw - 28px));
      max-height: min(440px, calc(100vh - 28px));
      overflow: auto;
      border: 1px solid rgba(221, 177, 255, .58);
      border-radius: 16px;
      color: var(--ink);
      background: radial-gradient(circle at 12% 0, rgba(184, 91, 255, .18), transparent 38%), linear-gradient(145deg, rgba(27, 14, 37, .98), rgba(8, 8, 13, .98));
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 22px 65px rgba(0,0,0,.68), 0 0 24px rgba(183, 91, 255, .14);
      padding: 14px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: .75rem;
      font-style: normal;
      text-transform: none;
      backdrop-filter: blur(16px);
      pointer-events: none;
    }

    .stat-tooltip.visible { display: block; }
    .stat-tooltip h3 { margin: 0 0 11px; color: #f0ceff; font-size: .9rem; letter-spacing: .02em; }
    .stat-tooltip table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .stat-tooltip th {
      color: #d7b8e8;
      font-size: .62rem;
      letter-spacing: .09em;
      text-align: left;
      text-transform: uppercase;
    }
    .stat-tooltip th, .stat-tooltip td {
      padding: 6px 7px;
      border-bottom: 1px solid rgba(224, 198, 255, .11);
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    .stat-tooltip th:nth-child(1) { width: 16%; }
    .stat-tooltip th:nth-child(2) { width: 16%; }
    .stat-tooltip th:nth-child(3) { width: 27%; }
    .stat-tooltip th:nth-child(4) { width: 41%; }
    .stat-tooltip .source-value { color: #fff; font-weight: 800; white-space: nowrap; }
    .stat-tooltip .source-type { color: #d3a8f1; }
    .stat-tooltip tbody tr:hover { background: rgba(215, 151, 255, .07); }
    .cap-calculation {
      margin-top: 10px;
      border: 1px solid rgba(255, 222, 73, .22);
      border-radius: 9px;
      color: #d8cde0;
      background: rgba(255, 211, 45, .055);
      padding: 8px 9px;
      line-height: 1.5;
    }
    .cap-calculation strong { color: #ffe66c; }
    .cap-formula { color: #f6effa; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    .explorer {
      padding: 18px;
      min-width: 0;
    }

    .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 18px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .tab-button { border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: rgba(255,255,255,.03); padding: 9px 13px; cursor: pointer; }
    .tab-button[aria-selected="true"] { border-color: rgba(var(--class-rgb), .55); color: var(--ink); background: rgba(var(--class-rgb), .14); }
    .tab-pane[hidden] { display: none; }
    .placeholder-pane { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .configuration-empty { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .configuration-stack { display: grid; gap: 24px; }
    .berserker-stack-control { border: 1px solid rgba(var(--class-rgb), .34); border-radius: 12px; margin: 0; padding: 12px; background: rgba(var(--class-rgb), .06); }
    .berserker-stack-control legend { padding: 0 6px; color: var(--ink); font-size: .78rem; font-weight: 850; }
    .berserker-stack-inputs { display: grid; grid-template-columns: minmax(160px, 1fr) 92px; gap: 12px; align-items: center; }
    .berserker-stack-inputs input[type="range"] { width: 100%; accent-color: rgb(var(--class-rgb)); }
    .berserker-stack-inputs input[type="number"] { width: 100%; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: rgba(0,0,0,.22); padding: 7px 8px; font: inherit; font-variant-numeric: tabular-nums; }
    .berserker-stack-summary { display: block; margin-top: 8px; color: var(--muted); font-size: .68rem; }
    .twinmage-configuration { display: grid; gap: 24px; }
    .gunmancer-configuration { display: grid; gap: 22px; }
    .gunmancer-configuration-note { margin: 0; border: 1px solid rgba(var(--class-rgb), .28); border-radius: 10px; color: var(--muted); background: rgba(var(--class-rgb), .06); padding: 10px 12px; font-size: .72rem; line-height: 1.5; }
    .gunmancer-configuration-note strong { color: var(--ink); }
    .ability-picker { border: 0; margin: 0; padding: 0; }
    .ability-picker legend { width: 100%; margin-bottom: 10px; color: var(--ink); }
    .ability-picker-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
    .ability-picker-title { font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .ability-picker-subtitle { color: var(--muted); font-size: .68rem; }
    .ability-options { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 10px; }
    .ability-option { position: relative; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; min-width: 0; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.025); padding: 9px; cursor: pointer; transition: border-color .15s, background .15s, color .15s, transform .15s; }
    .ability-option:hover { border-color: rgba(var(--class-rgb), .45); color: var(--ink); transform: translateY(-1px); }
    .ability-option:has(input:focus-visible) { outline: 2px solid rgba(var(--class-rgb), .8); outline-offset: 2px; }
    .ability-option:has(input:checked) { border-color: rgba(var(--class-rgb), .8); color: var(--ink); background: rgba(var(--class-rgb), .16); box-shadow: inset 0 0 0 1px rgba(var(--class-rgb), .3), 0 0 18px rgba(var(--class-rgb), .13); }
    .ability-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .ability-icon { width: 58px; height: 58px; display: block; object-fit: contain; border-radius: 9px; background: rgba(0,0,0,.2); }
    .ability-option:has(input:checked) .ability-icon { filter: saturate(1.16) drop-shadow(0 0 7px rgba(var(--class-rgb), .4)); }
    .ability-copy { min-width: 0; }
    .ability-name { display: block; overflow: hidden; color: inherit; font-size: .76rem; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
    .ability-effect { display: block; margin-top: 4px; color: var(--muted); font-size: .65rem; line-height: 1.35; }
    .airblast-options { display: grid; grid-template-columns: repeat(3, minmax(130px, 1fr)); gap: 8px; }
    .airblast-option { position: relative; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: rgba(255,255,255,.025); padding: 8px 9px; font-size: .7rem; cursor: pointer; }
    .airblast-option:has(input:checked) { border-color: rgba(var(--class-rgb), .75); color: var(--ink); background: rgba(var(--class-rgb), .13); }
    .airblast-option input { accent-color: rgb(var(--class-rgb)); }
    .gunmancer-unknown { color: #ffd36a; font-weight: 850; }
    .gunmancer-source-note { color: var(--muted); font-size: .66rem; line-height: 1.4; }
    .gunmancer-dps-picker { border: 1px solid rgba(var(--class-rgb), .28); border-radius: 10px; margin: 0; padding: 10px 12px 12px; }
    .gunmancer-dps-picker legend { padding: 0 5px; color: var(--ink); font-size: .78rem; font-weight: 850; }
    .gunmancer-dps-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .gunmancer-dps-option { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: rgba(255,255,255,.025); padding: 8px 9px; font-size: .7rem; cursor: pointer; }
    .gunmancer-dps-option:has(input:checked) { border-color: rgba(var(--class-rgb), .75); color: var(--ink); background: rgba(var(--class-rgb), .13); }
    .gunmancer-dps-option:has(input:focus-visible) { outline: 2px solid rgba(var(--class-rgb), .8); outline-offset: 2px; }
    .gunmancer-dps-option input { width: 16px; height: 16px; margin: 0; accent-color: rgb(var(--class-rgb)); }
    .gunmancer-dps-help { margin: 8px 0 0; color: var(--muted); font-size: .65rem; line-height: 1.4; }
    .element-picker { border: 0; margin: 0; padding: 0; }
    .element-picker legend { width: 100%; margin-bottom: 10px; color: var(--ink); }
    .element-picker-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .element-picker-title { font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .damage-calculation-toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .72rem; font-weight: 700; text-transform: none; letter-spacing: 0; cursor: pointer; }
    .damage-calculation-toggle input { width: 16px; height: 16px; margin: 0; accent-color: rgb(var(--class-rgb)); cursor: pointer; }
    .element-options { display: grid; grid-template-columns: repeat(6, minmax(76px, 1fr)); gap: 10px; }
    .element-option { position: relative; display: grid; justify-items: center; gap: 7px; min-width: 0; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.025); padding: 11px 7px 9px; cursor: pointer; transition: border-color .15s, background .15s, color .15s, transform .15s; }
    .element-option:hover { border-color: rgba(var(--class-rgb), .45); color: var(--ink); transform: translateY(-1px); }
    .element-option:has(input:focus-visible) { outline: 2px solid rgba(var(--class-rgb), .8); outline-offset: 2px; }
    .element-option:has(input:checked) { border-color: rgba(var(--class-rgb), .8); color: var(--ink); background: rgba(var(--class-rgb), .16); box-shadow: inset 0 0 0 1px rgba(var(--class-rgb), .3), 0 0 18px rgba(var(--class-rgb), .13); }
    .element-option input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .element-icon { width: 64px; height: 64px; display: block; object-fit: contain; filter: saturate(.88); }
    .element-option:has(input:checked) .element-icon { filter: saturate(1.16) drop-shadow(0 0 7px rgba(var(--class-rgb), .4)); }
    .element-name { overflow: hidden; max-width: 100%; font-size: .72rem; font-weight: 800; text-transform: uppercase; text-overflow: ellipsis; }
    .calculation-empty { min-height: 260px; display: grid; place-items: center; color: var(--muted); text-align: center; }
    .calculation-stack { display: grid; gap: 12px; align-items: start; justify-items: start; }
    .calculation-secondary { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; max-width: 100%; }
    .damage-calculation { width: 100%; }
    .damage-table-wrap { width: max-content; max-width: 100%; overflow-x: auto; border: 1px solid rgba(var(--class-rgb), .58); border-radius: 12px; background: linear-gradient(135deg, rgba(255,255,255,.025), rgba(0,0,0,.22)); box-shadow: inset 0 0 18px rgba(0,0,0,.22), 0 0 12px rgba(var(--class-rgb), .08); }
    .damage-table { width: auto; min-width: 0; border-collapse: collapse; table-layout: fixed; }
    .damage-table .damage-label-col { width: 120px; }
    .damage-table .damage-data-col { width: 72px; }
    .damage-table.shared-ability-table .damage-data-col { width: 120px; }
    .damage-table th, .damage-table td { border-right: 1px solid rgba(255,255,255,.13); border-bottom: 1px solid rgba(255,255,255,.13); padding: 6px 9px; }
    .damage-table tr > :last-child { border-right: 0; }
    .damage-table tbody tr:last-child > * { border-bottom: 0; }
    .damage-table thead th { height: 42px; background: rgba(0,0,0,.18); }
    .damage-table .damage-label { width: 120px; min-width: 120px; color: #e8e8ec; font-size: .66rem; font-weight: 650; text-align: left; white-space: nowrap; }
    .damage-column { --damage-color: #d8dde5; width: 72px; min-width: 72px; color: var(--damage-color); text-align: center; }
    .shared-ability-table .damage-column { width: 120px; min-width: 120px; }
    .shared-ability-table .damage-hand-title { overflow-wrap: normal; word-break: normal; }
    .damage-column[data-element="fire"] { --damage-color: #ff8717; }
    .damage-column[data-element="frost"] { --damage-color: #59b8ff; }
    .damage-column[data-element="lightning"] { --damage-color: #ffe45e; }
    .damage-column[data-element="electric"] { --damage-color: var(--electric); }
    .damage-column[data-element="physical"] { --damage-color: var(--physical); }
    .damage-column[data-element="luminous"] { --damage-color: #fff3a0; }
    .damage-column[data-element="shadow"] { --damage-color: #c77dff; }
    .damage-column[data-element="poison"] { --damage-color: var(--poison); }
    .damage-column[data-element="burning"] { --damage-color: #ff8717; }
    .damage-column[data-element="bleeding"] { --damage-color: var(--physical); }
    .damage-column.status-effect-column { background: color-mix(in srgb, var(--damage-color) 4%, transparent); }
    .damage-column.status-group-start { border-left: 3px solid rgba(var(--class-rgb), .72); }
    .damage-hand-position { display: block; margin-bottom: 2px; color: #9d93a4; font-size: .46rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .damage-hand-title { display: block; color: var(--damage-color); font-size: .7rem; font-weight: 900; line-height: 1.05; overflow-wrap: anywhere; }
    .damage-value { color: var(--damage-color); font-size: .72rem; font-variant-numeric: tabular-nums; font-weight: 800; }
    .damage-value-unknown { color: #aaa6af; font-size: .82rem; }
    .damage-section-break > * { border-top: 3px solid rgba(255,255,255,.11); }
    .damage-total-row .damage-label, .damage-total-row .damage-value { font-size: .93rem; font-weight: 950; }
    .damage-combined-row > * { border-top: 4px solid rgba(var(--class-rgb), .5); border-bottom: 0; background: linear-gradient(90deg, rgba(var(--class-rgb), .14), rgba(var(--class-rgb), .045)); padding-top: 10px; padding-bottom: 10px; }
    .damage-combined-label { color: #f1f3f4; font-size: .78rem; font-weight: 950; letter-spacing: .035em; text-align: left; text-transform: uppercase; }
    .damage-combined-value { display: inline-block; min-width: 82px; color: rgb(var(--class-rgb)); font-size: 1.34rem; font-variant-numeric: tabular-nums; font-weight: 950; line-height: 1; text-shadow: 0 0 14px rgba(var(--class-rgb), .42); }
    .crit-table-wrap { width: max-content; max-width: 100%; overflow-x: auto; border: 1px solid rgba(255, 112, 190, .58); border-radius: 12px; background: linear-gradient(135deg, rgba(255,112,190,.055), rgba(0,0,0,.22)); box-shadow: inset 0 0 18px rgba(0,0,0,.22), 0 0 12px rgba(255,112,190,.06); }
    .crit-table { width: 230px; border-collapse: collapse; table-layout: fixed; }
    .crit-table th, .crit-table td { border-right: 1px solid rgba(255,255,255,.13); border-bottom: 1px solid rgba(255,255,255,.13); padding: 6px 9px; }
    .crit-table tr > :last-child { border-right: 0; }
    .crit-table tbody tr:last-child > * { border-bottom: 0; }

          .map(([id, value]) => [id, Math.min(100, Number(value))]));
        const legacyBerserkerCount = Math.min(100, Math.max(0, Number(saved["Berserker's_Soul"]) || 0));
        if (legacyBerserkerCount) {
          const legacyVariant = Object.values(BERSERKER_SOUL).find(variant => variant.classes.includes(selectedClass));
          if (legacyVariant) loaded[legacyVariant.id] = legacyBerserkerCount;
        }
        return loaded;
      } catch { return {}; }
    }

    function safeSetStorage(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch {
        try {
          localStorage.removeItem(key);
          localStorage.setItem(key, value);
          return true;
        } catch { return false; }
      }
    }

    function saveCounts() {
      safeSetStorage("ecliptica-upgrade-explorer-v1", JSON.stringify(counts));
    }

    function loadBuildOptions() {
      try {
        const saved = JSON.parse(localStorage.getItem("ecliptica-build-options-v1") || "{}");
        const savedArtifacts = Array.isArray(saved.artifacts)
          ? Object.fromEntries(saved.artifacts.filter(id => ARTIFACTS.some(item => item.id === id)).map(id => [id, 1]))
          : saved.artifacts && typeof saved.artifacts === "object" ? saved.artifacts : {};
        const savedGunmancerDps = saved.gunmancerSecondaryDamage === true && saved.gunmancerPrimaryDamage !== true ? "secondary" : "primary";
        const savedBerserkerVariant = Object.values(BERSERKER_SOUL).find(variant => variant.classes.includes(selectedClass));
        const defaultBerserkerStacks = (Number(counts[savedBerserkerVariant?.id]) || 0) * 70;
        return {
          artifacts: Object.fromEntries(ARTIFACTS.map(item => [item.id, Math.min(100, Math.max(0, Number(savedArtifacts[item.id]) || 0))]).filter(([, count]) => count)),
          runes: RUNE_SLOTS.map((_, index) => RUNES.some(item => item.id === saved.runes?.[index]) ? saved.runes[index] : null),
          curses: RUNE_SLOTS.map((_, index) => CURSES.some(item => item.id === saved.curses?.[index]) ? saved.curses[index] : null),
          twinmagePrimary: TWINMAGE_ELEMENTS.some(item => item.id === saved.twinmagePrimary) ? saved.twinmagePrimary : "fire",
          twinmageSecondary: TWINMAGE_ELEMENTS.some(item => item.id === saved.twinmageSecondary) ? saved.twinmageSecondary : "lightning",
          twinmagePrimaryDamage: saved.twinmagePrimaryDamage !== false,
          twinmageSecondaryDamage: saved.twinmageSecondaryDamage !== false,
          gunmancerPrimary: GUNMANCER_ABILITIES.primary.some(item => item.id === saved.gunmancerPrimary) ? saved.gunmancerPrimary : "va11",
          gunmancerSecondary: GUNMANCER_ABILITIES.secondary.some(item => item.id === saved.gunmancerSecondary) ? saved.gunmancerSecondary : "photon",
          gunmancerPrimaryDamage: savedGunmancerDps === "primary",
          gunmancerSecondaryDamage: savedGunmancerDps === "secondary",
          gunmancerAirblastTarget: ["none", "primary", "secondary"].includes(saved.gunmancerAirblastTarget) ? saved.gunmancerAirblastTarget : "none",
          berserkerSoulStacks: saved.berserkerSoulStacks == null ? defaultBerserkerStacks : Math.max(0, Math.floor(Number(saved.berserkerSoulStacks) || 0))
        };
      } catch { return { artifacts: {}, runes: [null, null, null, null], curses: [null, null, null, null], twinmagePrimary: "fire", twinmageSecondary: "lightning", twinmagePrimaryDamage: true, twinmageSecondaryDamage: true, gunmancerPrimary: "va11", gunmancerSecondary: "photon", gunmancerPrimaryDamage: true, gunmancerSecondaryDamage: false, gunmancerAirblastTarget: "none", berserkerSoulStacks: 0 }; }
    }

    function saveBuildOptions() {
      safeSetStorage("ecliptica-build-options-v1", JSON.stringify(buildOptions));
    }

    const upgradeIndex = new Map(U.map(upgrade => [upgrade.id, upgrade]));
    function berserkerVariantForClass(className = selectedClass) {
      return Object.values(BERSERKER_SOUL).find(variant => variant.classes.includes(className));
    }
    function berserkerUpgradeCount() {
      return rawCount(berserkerVariantForClass()?.id);
    }
    function berserkerMaximumStacks(upgradeCount = berserkerUpgradeCount()) {
      return Math.max(0, upgradeCount * 70);
    }
    function clampBerserkerStacks(upgradeCount = berserkerUpgradeCount()) {
      const maximum = berserkerMaximumStacks(upgradeCount);
      buildOptions.berserkerSoulStacks = Math.min(maximum, Math.max(0, Math.floor(Number(buildOptions.berserkerSoulStacks) || 0)));
      return buildOptions.berserkerSoulStacks;
    }
    function isUpgradeAvailable(upgrade) {
      return upgrade.family === selectedClass || DEFAULT_FAMILIES.includes(upgrade.family);
    }
    function rawCount(id) {
      return Math.max(0, Number(counts[id]) || 0);
    }
    function getDamageSources() {
      const sources = new Set(CLASS_DAMAGE_SOURCES[selectedClass] || []);
      if (selectedClass === "Twinmage") {
        if (buildOptions.twinmagePrimaryDamage) sources.add(buildOptions.twinmagePrimary);
        if (buildOptions.twinmageSecondaryDamage) sources.add(buildOptions.twinmageSecondary);
      }
      if (selectedClass === "Gunmancer") {
        [gunmancerAbility(buildOptions.gunmancerPrimary, "primary"), gunmancerAbility(buildOptions.gunmancerSecondary, "secondary")]
          .flatMap(ability => ability.components.map(component => component.element))
          .forEach(element => sources.add(element));
      }
      Object.entries(PICKED_DAMAGE_SOURCES).forEach(([upgradeId, elements]) => {
        const upgrade = upgradeIndex.get(upgradeId);
        if (upgrade && isUpgradeAvailable(upgrade) && rawCount(upgradeId) > 0) elements.forEach(element => sources.add(element));
      });
      return sources;
    }
    function conditionalAvailabilityReason(upgrade) {
      const berserkerVariant = Object.values(BERSERKER_SOUL).find(variant => variant.id === upgrade.id);
      if (berserkerVariant && !berserkerVariant.classes.includes(selectedClass)) return `Unavailable for ${selectedClass}.`;
      const rule = CONDITIONAL_UPGRADE_RULES[upgrade.id];
      if (!rule) return "";
      const sources = getDamageSources();
      if (rule.requiresAbility && selectedClass === "Gunmancer") {
        const selectedAbility = gunmancerAbility(buildOptions[`gunmancer${rule.requiresAbility.group === "primary" ? "Primary" : "Secondary"}`], rule.requiresAbility.group);
        if (selectedAbility.id !== rule.requiresAbility.id) return `Unavailable: ${rule.reason}.`;
      }
      if (rule.requires && !sources.has(rule.requires)) return `Unavailable: requires ${rule.reason}.`;
      if (rule.blockedBy && sources.has(rule.blockedBy)) return `Unavailable: ${rule.reason}.`;
      return "";
    }
    function isUpgradeConditionallyAvailable(upgrade) {
      return !conditionalAvailabilityReason(upgrade);
    }
    function count(id) {
      const upgrade = upgradeIndex.get(id);
      if (upgrade && !isUpgradeAvailable(upgrade)) return 0;
      if (upgrade && !isUpgradeConditionallyAvailable(upgrade)) return 0;
      return rawCount(id);
    }

        .map(family => `<option>${escapeHtml(family)}</option>`).join("")}`;
      familyFilter.value = availableFamilies.includes(previous) ? previous : "";
    }

    const STAT_EFFECTS = [
      ["health", "Fluffy", 10], ["health", "Big_and_Round", 30],

        .flatMap(stat => [[stat, "Sorcerer's_Mastery", 8], [stat, "An_IQ_Too_High_", 25]]),
      ["fireDamage", "Fire_Aspect", 15], ["frostDamage", "Frost_Aspect", 15],

      ["projectileSpeed", "Eagle_Eye", 35], ["projectileSpeed", "An_IQ_Too_High_", -15],
      ["projectileSpread", "Thaumaturge_Splitshot", 2.5], ["projectileSpread", "Hawkeye", -1],
      ["movementSpeed", "Big_and_Round", -10], ["movementSpeed", "Iron_Skin", -3],
      ["movementSpeed", "Mass_Aspect", -30], ["movementSpeed", "Athletic", 8],
      ["movementSpeed", "Leg_Day", 5],
      ["movementSpeed", "Thunder_Aura", -5, { once: true, notes: "This penalty only applies once." }],
      ["movementSpeed", "Featherweight", 30],
      ["jumpHeight", "Big_and_Round", -10], ["jumpHeight", "Springfoot", 20],
      ["jumpHeight", "Leg_Day", 10], ["extraJumps", "Partial_Flight", 1],
      ["knockbackResistance", "Big_and_Round", 50],
      ["criticalChance", "Full_Focus", 5], ["criticalChance", "Charged_Strike", -5],
      ["criticalDamage", "Full_Focus", 5], ["criticalDamage", "Pocket_Abacus", 10],
      ["utilityCooldownRate", "Adrenaline_Fiend", 7], ["utilityCooldownRate", "Quick_Breath", 10],
      ["utilityCooldownRate", "Big_and_Speedy", 50], ["utilityCooldownRate", "Warrior's_Will", -15],
      ["utilityCooldownRate", "Spellsword_Burst", -20]
    ].map(([stat, id, value, options = {}]) => ({ stat, id, value, ...options }));

    function capValue(stat, raw) {
      const cap = CAPS[stat];
      if (!cap || raw <= cap[0]) return raw;
      const [soft, hard] = cap;
      const overflow = raw - soft;
      return soft + (hard - soft) * overflow / ((hard - soft) + overflow);
    }

    function hardCapValue(stat, raw) {
      const hardCap = HARD_CAPS[stat];
      return hardCap && raw > hardCap ? hardCap : raw;
    }

    function calculateStats() {
      const activeBase = {
        ...BASE,
        health: CLASS_BASE_HEALTH[selectedClass],
        healingReceived: selectedClass === "Thaumaturge" ? 50 : 100
      };
      const bonus = Object.fromEntries(Object.keys(activeBase).map(stat => [stat, 0]));
      const breakdowns = Object.fromEntries(Object.entries(activeBase).map(([stat, base]) => [stat, [{
        value: formatContribution(stat, base),
        type: "Base",
        source: selectedClass,
        notes: "Default class value."
      }]]));

      for (const effect of STAT_EFFECTS) {
        const selected = count(effect.id);
        if (!selected) continue;
        const appliedStacks = effect.once ? 1 : selected;
        const total = typeof effect.value === "function"
          ? effect.value(selected)
          : effect.value * appliedStacks;
        bonus[effect.stat] += total;

        const stackNote = typeof effect.value === "number" && selected > 1
          ? `${selected} stacks × ${formatContribution(effect.stat, effect.value)}.`
          : effect.once && selected > 1
            ? `${selected} selected; the modifier is only applied once.`
            : "";
        breakdowns[effect.stat].push({
          value: formatContribution(effect.stat, total, true),
          type: "Additive",
          source: upgradeIndex.get(effect.id)?.name || effect.id,
          notes: [effect.notes, stackNote].filter(Boolean).join(" ")
        });
      }

      const berserkerVariant = berserkerVariantForClass();
      const berserkerCopies = berserkerUpgradeCount();
      const berserkerStacks = clampBerserkerStacks(berserkerCopies);
      if (berserkerVariant && berserkerCopies > 0) {
        const berserkerEffects = {
          overallDamage: berserkerVariant.damagePenalty * berserkerCopies + berserkerVariant.damageAt70 * berserkerStacks / 70,
          attackSpeed: berserkerVariant.attackSpeedPenalty * berserkerCopies + berserkerVariant.attackSpeedAt70 * berserkerStacks / 70,
          healthRegeneration: berserkerVariant.regenerationAt70 * berserkerStacks / 70,
          projectileSpread: berserkerVariant.spreadAt70 * berserkerStacks / 70
        };
        for (const [stat, value] of Object.entries(berserkerEffects)) {
          if (!value) continue;
          bonus[stat] += value;
          breakdowns[stat].push({
            value: formatContribution(stat, value, true),
            type: "Additive",
            source: upgradeIndex.get(berserkerVariant.id)?.name || berserkerVariant.id,
            notes: `${berserkerCopies} upgrade stack${berserkerCopies === 1 ? "" : "s"}; ${berserkerStacks}/${berserkerMaximumStacks(berserkerCopies)} Berserker's Soul stacks.`
          });
        }
      }

      const addBuildStats = (stats, source, type = "Additive") => {
        for (const [stat, value] of Object.entries(stats || {})) {
          if (!(stat in bonus) || !value) continue;
          bonus[stat] += value;
          breakdowns[stat].push({
            value: formatContribution(stat, value, true), type, source,
            notes: "Selected outside the upgrade catalog."
          });
        }
      };
      for (const [artifactId, artifactCount] of Object.entries(buildOptions.artifacts)) {
        const artifact = ARTIFACTS.find(item => item.id === artifactId);
        if (!artifact) continue;
        const totalMultiplier = artifactCount;
        addBuildStats(Object.fromEntries(Object.entries(artifact.stats).map(([stat, value]) => [stat, value * totalMultiplier])),
          artifact.name, `Artifact ×${artifactCount}`);
      }
      buildOptions.runes.forEach((runeId, index) => {
        const rune = RUNES.find(item => item.id === runeId);
        if (rune?.stats) addBuildStats(rune.stats(index + 1), `${RUNE_SLOTS[index]} · ${rune.name}`, "Rune");
        const curse = rune && CURSES.find(item => item.id === buildOptions.curses[index]);
        if (curse?.stats) addBuildStats(curse.stats(index + 1), `${RUNE_SLOTS[index]} · Runic Curse: ${curse.name}`, "Curse");
      });

      const caps = {};
      const defenseCalculations = {};
      const result = Object.fromEntries(Object.entries(activeBase).map(([stat, base]) => {
        if (DEFENSE_STATS.has(stat)) {
          const calculation = DefenseCalculation.calculateDefense(bonus[stat]);
          defenseCalculations[stat] = calculation;
          return [stat, calculation.defense];
        }
        const raw = base + bonus[stat];
        const cappedRaw = capValue(stat, raw);
        const cappedBase = capValue(stat, base);
        const lowerSoftCap = LOWER_CAPS[stat];
        const hardCappedRaw = hardCapValue(stat, raw);
        let effective = bonus[stat] > 0 ? base + cappedRaw - cappedBase : raw;
        if (bonus[stat] > 0 && Math.abs(cappedRaw - raw) > .0001) {
          const [soft, hard] = CAPS[stat];
          caps[stat] = {
            kind: "upper", base, bonus: bonus[stat], raw, soft, hard,
            overflow: raw - soft, range: hard - soft,
            cappedRaw, cappedBase, effective
          };
        } else if (Math.abs(hardCappedRaw - raw) > .0001) {
          effective = hardCappedRaw;
          caps[stat] = {
            kind: "hard", base, bonus: bonus[stat], raw,
            hard: HARD_CAPS[stat], effective
          };
        } else if (lowerSoftCap && bonus[stat] < -lowerSoftCap) {
          effective = lowerSoftCap ** 2 / Math.abs(bonus[stat]);
          caps[stat] = {
            kind: "lower",
            base,
            bonus: bonus[stat],
            raw,
            soft: lowerSoftCap,
            divisor: Math.abs(bonus[stat]),
            numerator: lowerSoftCap ** 2,
            effective
          };
        }
        return [stat, effective];
      }));

      const wardenStacks = count("Shieldmage_Warden");
      if (wardenStacks) {
        const divisor = 1 + wardenStacks;
        breakdowns.utilityCooldownRate.push({
          value: `÷${formatNumber(divisor)}`,
          type: "Multiplicative",
          source: upgradeIndex.get("Shieldmage_Warden")?.name || "Shieldmage: Warden",
          notes: `+100% cooldown per stack is converted to recovery rate; ${formatNumber(result.utilityCooldownRate)}% ÷ ${formatNumber(divisor)}.`
        });
        result.utilityCooldownRate /= divisor;
      }
      if (result.health < 1) result.health = 1;
      if (result.projectileSpread < 0) result.projectileSpread = 0;
      return { stats: result, base: activeBase, breakdowns, caps, defenseCalculations };
    }

    function formatNumber(value) {
      const rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function formatContribution(stat, value, showSign = false) {
      const prefix = showSign && value > 0 ? "+" : "";
      const suffix = stat === "health" || stat === "extraJumps" ? "" : "%";
      return `${prefix}${formatNumber(value)}${suffix}`;
    }

    function formatStat(stat, value) {
      if (stat === "health" || stat === "extraJumps") return formatNumber(value);
      if (stat === "attackSpeed") return `${Number(Number(value).toFixed(2))}%`;
      if (stat === "movementSpeed") return `${formatNumber(value)}% · ${formatNumber(7 * value / 100)} m/s`;
      return `${formatNumber(value)}%`;
    }

    let latestCalculation;

    function renderStats() {
      hideStatTooltip();
      latestCalculation = calculateStats();
      const stats = latestCalculation.stats;
      $("#stats").innerHTML = STAT_ROWS.map(([stat, label, color]) => {
        if (!stat) return '<div class="stat-gap"></div>';
        const delta = stats[stat] - latestCalculation.base[stat];
        const changed = Math.abs(delta) > .001;
        const deltaHtml = changed
          ? `<span class="delta ${delta > 0 ? "up" : "down"}">${delta > 0 ? "+" : ""}${formatNumber(delta)}</span>`
          : "";
        return `<div class="stat-row ${color ? `element ${color}` : ""} ${changed ? "changed" : ""}"
          data-stat="${stat}" data-label="${escapeHtml(label)}" tabindex="0">
          <span>${label}:</span><span class="value">${formatStat(stat, stats[stat])}${deltaHtml}</span>
        </div>`;
      }).join("");
    }

    function softCapMarkup(stat) {
      const cap = latestCalculation?.caps?.[stat];
      if (!cap) return "";
      const unit = stat === "health" || stat === "extraJumps" ? "" : "%";
      const n = value => `${formatNumber(value)}${unit}`;
      if (cap.kind === "lower") {
        return `<div class="cap-calculation">
          <strong>Lower soft-cap calculation</strong><br>
          Raw additive sum: <span class="cap-formula">${n(cap.base)} ${cap.bonus < 0 ? "−" : "+"} ${n(Math.abs(cap.bonus))} = ${n(cap.raw)}</span><br>
          Negative modifier exceeds the ${n(cap.soft)} lower soft cap.<br>
          <span class="cap-formula">${formatNumber(cap.soft)}² ÷ |${n(cap.bonus)}| = ${formatNumber(cap.numerator)} ÷ ${n(cap.divisor)} = ${n(cap.effective)}</span>
        </div>`;
      }
      if (cap.kind === "hard") {
        return `<div class="cap-calculation">
          <strong>Hard-cap calculation</strong><br>
          Raw additive sum: <span class="cap-formula">${n(cap.base)} + ${n(cap.bonus)} = ${n(cap.raw)}</span><br>
          Hard cap ${n(cap.hard)}<br>
          Effective result: <span class="cap-formula">min(${n(cap.raw)}, ${n(cap.hard)}) = ${n(cap.effective)}</span>
        </div>`;
      }
      return `<div class="cap-calculation">
        <strong>Upper soft-cap calculation</strong><br>
        <em>Warning: the game's exact approaching-hard-cap formula is not yet known; this is an estimate.</em><br>
        Raw additive sum: <span class="cap-formula">${n(cap.base)} + ${n(cap.bonus)} = ${n(cap.raw)}</span><br>
        Soft cap ${n(cap.soft)} · hard-cap limit ${n(cap.hard)}<br>
        <span class="cap-formula">${n(cap.soft)} + (${n(cap.range)} × ${n(cap.overflow)} ÷ (${n(cap.range)} + ${n(cap.overflow)})) = ${n(cap.cappedRaw)}</span><br>
        Effective result: <span class="cap-formula">${n(cap.base)} + ${n(cap.cappedRaw)} − ${n(cap.cappedBase)} = ${n(cap.effective)}</span>
      </div>`;
    }

    function defenseCalculationMarkup(stat) {
      const calculation = latestCalculation?.defenseCalculations?.[stat];
      if (!calculation) return "";
      const n = value => `${formatNumber(value)}%`;
      const modifier = calculation.defenseModifier;
      const modifierFormula = modifier === 0
        ? n(calculation.rawDamageTaken)
        : `${n(DefenseCalculation.BASE_DAMAGE_TAKEN)} ${modifier > 0 ? "−" : "+"} ${n(Math.abs(modifier))} = ${n(calculation.rawDamageTaken)}`;
      const capMarkup = calculation.isSoftCapped
        ? `<br>Reduction exceeds the ${n(calculation.softCap)} damage-taken lower soft cap.<br>
          <span class="cap-formula">${formatNumber(calculation.softCap)}² ÷ ${n(modifier)} = ${formatNumber(calculation.numerator)} ÷ ${n(modifier)} = ${n(calculation.damageTaken)}</span>`
        : "";
      return `<div class="cap-calculation">
        <strong>Defense derived from damage taken</strong><br>
        Defense modifiers apply inversely to damage taken.<br>
        Damage taken: <span class="cap-formula">${modifierFormula}</span>${capMarkup}<br>
        Shown defense: <span class="cap-formula">100% ÷ ${n(calculation.damageTaken)} = ${n(calculation.defense)}</span>
      </div>`;
    }

    function showStatTooltip(row) {
      const stat = row.dataset.stat;
      const label = row.dataset.label;
      const entries = latestCalculation?.breakdowns?.[stat] || [];
      const tooltip = $("#stat-tooltip");
      tooltip.innerHTML = `<h3>${escapeHtml(label)} · ${formatStat(stat, latestCalculation.stats[stat])}</h3>
        <table>
          <thead><tr><th>Value</th><th>Type</th><th>Source</th><th>Notes</th></tr></thead>
          <tbody>${entries.map(entry => `<tr>
            <td class="source-value">${escapeHtml(entry.value)}</td>
            <td class="source-type">${escapeHtml(entry.type)}</td>
            <td>${escapeHtml(entry.source)}</td>
            <td>${escapeHtml(entry.notes || "—")}</td>
          </tr>`).join("")}</tbody>
        </table>
        ${defenseCalculationMarkup(stat)}
        ${softCapMarkup(stat)}`;
      tooltip.classList.add("visible");

      const rect = row.getBoundingClientRect();
      const box = tooltip.getBoundingClientRect();
      const gap = 10;
      let left = rect.right + gap;
      let top = rect.top - 12;
      if (left + box.width > window.innerWidth - 12) left = Math.max(12, rect.left - box.width - gap);
      if (top + box.height > window.innerHeight - 12) top = window.innerHeight - box.height - 12;
      tooltip.style.left = `${Math.max(12, left)}px`;
      tooltip.style.top = `${Math.max(12, top)}px`;
    }

    function hideStatTooltip() {
      $("#stat-tooltip").classList.remove("visible");
    }

    function clearCalculationReferences() {
      document.querySelectorAll(".calculation-reference").forEach(element => element.classList.remove("calculation-reference"));
    }

    function highlightCalculationReferences(refs) {
      clearCalculationReferences();
      refs.filter(Boolean).forEach(ref => {
        const separator = ref.indexOf(":");
        const type = ref.slice(0, separator);
        const key = ref.slice(separator + 1);
        const selector = type === "stat" ? `[data-stat="${CSS.escape(key)}"]`
          : type === "upgrade" ? `[data-id="${CSS.escape(key)}"]`
          : `[data-calculation-key="${CSS.escape(key)}"]`;
        document.querySelectorAll(selector).forEach(element => element.classList.add("calculation-reference"));
      });
    }

    function positionCalculationTooltip(clientX, clientY) {
      const tooltip = $("#calculation-tooltip");
      const gap = 14;
      const box = tooltip.getBoundingClientRect();
      let left = clientX + gap;
      let top = clientY + gap;
      if (left + box.width > window.innerWidth - 8) left = clientX - box.width - gap;
      if (top + box.height > window.innerHeight - 8) top = clientY - box.height - gap;
      tooltip.style.left = `${Math.max(8, left)}px`;
      tooltip.style.top = `${Math.max(8, top)}px`;
    }

    function showCalculationTooltip(value, clientX, clientY) {
      const tooltip = $("#calculation-tooltip");
      const lines = value.dataset.calculationFormula.split("\n");
      const isSource = value.dataset.calculationKey.startsWith("source:");
      const accent = getComputedStyle(value).color;
      const damageType = value.dataset.calculationDamageType;
      const damageTypeId = value.dataset.calculationDamageId;
      const sourceUpgradeId = value.dataset.calculationSourceUpgrade;
      const sourceUpgrade = sourceUpgradeId ? upgradeIndex.get(sourceUpgradeId) : null;
      const sourceIcon = value.dataset.calculationSourceIcon;
      const sourceIconUrl = sourceIcon && /^(?:https?:|data:|\/|pictures\/)/i.test(sourceIcon)
        ? sourceIcon
        : sourceIcon ? `pictures/${encodeURIComponent(sourceIcon)}` : "";
      let damageBreakdown = [];
      try { damageBreakdown = JSON.parse(value.dataset.calculationBreakdown || "[]"); } catch { damageBreakdown = []; }
      let applicationBreakdown = null;
      try { applicationBreakdown = JSON.parse(value.dataset.applicationBreakdown || "null"); } catch { applicationBreakdown = null; }
      const damageBadge = damageType
        ? `<span class="calculation-damage-type damage-type-${escapeHtml(damageTypeId)}">${escapeHtml(damageType)}</span>`
        : "";
      const breakdownMarkup = damageBreakdown.length
        ? `<div class="calculation-damage-breakdown">${damageBreakdown.map(item => `<div class="calculation-damage-breakdown-row damage-type-${escapeHtml(item.id)}"><span>${escapeHtml(item.name)}</span><strong>${escapeHtml(item.value)}</strong></div>`).join("")}</div>`
        : "";
      const applicationBreakdownMarkup = applicationBreakdown?.sources?.length
        ? `<div class="application-breakdown"><table><thead><tr><th>Source</th><th>Instances/s</th><th>Chance</th><th>Applications/s</th></tr></thead><tbody>${applicationBreakdown.sources.map(source => `<tr><td>${escapeHtml(source.name)}</td><td>${escapeHtml(source.instancesPerSecond)}</td><td>${escapeHtml(source.chance)}</td><td>${escapeHtml(source.applicationsPerSecond)}</td></tr>`).join("")}</tbody><tfoot><tr><th colspan="3">Total applications/s</th><td>${escapeHtml(applicationBreakdown.total)}</td></tr></tfoot></table><div class="application-breakdown-result">1 ÷ ${escapeHtml(applicationBreakdown.total)} = ${escapeHtml(applicationBreakdown.interval)} s</div></div>`
        : "";
      const upgradeMarkup = sourceUpgrade
        ? `<div class="calculation-tooltip-upgrade">
            <img class="calculation-tooltip-upgrade-icon" src="pictures/${encodeURIComponent(sourceUpgrade.icon)}" alt="">
            <div class="calculation-tooltip-upgrade-name">${escapeHtml(sourceUpgrade.name)}</div>
            <span class="calculation-tooltip-upgrade-stacks">${count(sourceUpgrade.id)} ${count(sourceUpgrade.id) === 1 ? "stack" : "stacks"}</span>
            <div class="calculation-tooltip-upgrade-effect">${escapeHtml(sourceUpgrade.effect)}</div>
          </div>`
        : "";
      const sourceDetailsMarkup = sourceIcon
        ? `<div class="calculation-tooltip-source-with-icon">
            <img class="calculation-tooltip-source-icon" src="${escapeHtml(sourceIconUrl)}" alt="" onerror="this.onerror=null;this.src='pictures/${escapeHtml(CLASS_LOGOS[selectedClass])}';">
            <div><div class="calculation-tooltip-title">${escapeHtml(lines[0])}</div>
              <div class="calculation-tooltip-lines">${lines.slice(1).map(line => `<span>${escapeHtml(line)}</span>`).join("")}</div></div>
          </div>`
        : `<div class="calculation-tooltip-title">${escapeHtml(lines[0])}</div>
          <div class="calculation-tooltip-lines">${lines.slice(1).map(line => `<span>${escapeHtml(line)}</span>`).join("")}</div>`;
      const formulaSourceIcon = sourceIcon
        ? `<img class="calculation-tooltip-mini-source-icon" src="${escapeHtml(sourceIconUrl)}" alt="" onerror="this.onerror=null;this.src='pictures/${escapeHtml(CLASS_LOGOS[selectedClass])}';">`
        : "";
      tooltip.style.setProperty("--tooltip-accent", accent);
      const contextMarkup = isSource
        ? `<div class="calculation-tooltip-head"><span class="calculation-tooltip-icon">◆</span>Damage source${damageBadge}</div>
          ${sourceDetailsMarkup}`
        : `<div class="calculation-tooltip-head"><span class="calculation-tooltip-icon">ƒ</span>Formula${formulaSourceIcon}${damageBadge}</div>
          <div class="calculation-tooltip-expression">${applicationBreakdownMarkup || lines.map(line => `<span class="calculation-tooltip-expression-line">${escapeHtml(line)}</span>`).join("")}</div>${breakdownMarkup}`;
      tooltip.innerHTML = `${upgradeMarkup}${contextMarkup}`;
      tooltip.classList.add("visible");
      highlightCalculationReferences((value.dataset.calculationRefs || "").split("|"));
      const rect = value.getBoundingClientRect();
      positionCalculationTooltip(clientX ?? rect.right, clientY ?? rect.bottom);
    }

    function hideCalculationTooltip() {
      $("#calculation-tooltip").classList.remove("visible");
      clearCalculationReferences();
    }

    let loadingSharedBuild = false;

    function getCurrentBuild() {
      return {
        version: ShareBuildCodec.FORMAT_VERSION,
        characterId: CLASS_FAMILIES.indexOf(selectedClass),
        upgrades: U.filter(upgrade => count(upgrade.id) > 0)
          .map(upgrade => ({ id: upgrade.globalId, count: Math.min(100, Math.max(1, count(upgrade.id))) }))
          .sort((a, b) => a.id - b.id),
        artifacts: ARTIFACTS.map((artifact, id) => ({ id, count: buildOptions.artifacts[artifact.id] || 0 })).filter(entry => entry.count),
        runes: buildOptions.runes.map(id => id == null ? null : RUNES.findIndex(rune => rune.id === id)),
        curses: buildOptions.curses.map(id => id == null ? null : CURSES.findIndex(curse => curse.id === id))
      };
    }

    function encodeBuildV1(build) { return ShareBuildCodec.encodeBuildV1(build); }
    function encodeBuild(build) { return ShareBuildCodec.encodeBuild(build); }

    function decodeBuildV1(reader) { return ShareBuildCodec.decodeBuildV1(reader); }
    function decodeBuild(code) {
      return ShareBuildCodec.decodeBuild(code, {
        characterCount: CLASS_FAMILIES.length,
        upgradeCount: U.length,
        isUpgradeAllowed: (upgradeId, characterId) => {
          const upgrade = U[upgradeId];
          const character = CLASS_FAMILIES[characterId];
          return Boolean(upgrade && (upgrade.family === character || DEFAULT_FAMILIES.includes(upgrade.family)));
        },
        artifactCount: ARTIFACTS.length,
        runeCount: RUNES.length,
        curseCount: CURSES.length
      });
    }

    function applyBuild(build) {
      if (!build || !CLASS_FAMILIES[build.characterId]) throw new Error("Unknown character ID");
      loadingSharedBuild = true;
      try {
        selectedClass = CLASS_FAMILIES[build.characterId];
        safeSetStorage("ecliptica-upgrade-explorer-class", selectedClass);
        Object.keys(counts).forEach(id => delete counts[id]);
        for (const entry of build.upgrades) {
          const upgrade = U[entry.id];
          if (upgrade && Number.isInteger(entry.count) && entry.count >= 1 && entry.count <= 100) {
            const importedId = upgrade.id === BERSERKER_SOUL.melee.id ? berserkerVariantForClass()?.id : upgrade.id;
            if (importedId) counts[importedId] = entry.count;
          }
        }
        buildOptions.artifacts = Object.fromEntries((build.artifacts || []).flatMap(entry => {
          const artifact = ARTIFACTS[entry.id];
          return artifact && Number.isInteger(entry.count) && entry.count >= 1 && entry.count <= 100 ? [[artifact.id, entry.count]] : [];
        }));
        buildOptions.runes = RUNE_SLOTS.map((_, index) => RUNES[build.runes?.[index]]?.id || null);
        buildOptions.curses = RUNE_SLOTS.map((_, index) => CURSES[build.curses?.[index]]?.id || null);
        saveCounts();
        saveBuildOptions();
        syncClassUi();
        render();
      } finally {
        loadingSharedBuild = false;
      }
    }

    function createShareUrl() {
      const url = new URL(location.href);
      const parameters = new URLSearchParams(url.hash.slice(1));
      parameters.set("b", encodeBuild(getCurrentBuild()));
      url.hash = parameters.toString();
      return url.href;
    }

    function updateShareWidget() {
      if (loadingSharedBuild) return;
      const shareUrl = createShareUrl();
      $("#share-url").value = shareUrl;
      history.replaceState(null, "", shareUrl);
    }

    function loadBuildFromHash() {
      const code = new URLSearchParams(location.hash.slice(1)).get("b");
      if (!code) { updateShareWidget(); return; }
      try {
        const build = decodeBuild(code);
        applyBuild(build);
        // Preserve the original code (including valid ignored entries) while refreshing the widget.
        $("#share-url").value = location.href;
        $("#copy-status").textContent = build.warnings.length ? `Loaded with ${build.warnings.length} ignored entr${build.warnings.length === 1 ? "y" : "ies"}.` : "";
      } catch (error) {
        console.warn("Could not load shared build:", error);
        $("#copy-status").textContent = "Invalid build link; current build kept.";
        $("#share-url").value = location.href;
      }
    }

    async function copyShareUrl() {
      const input = $("#share-url");
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(input.value);
        else {
          input.select();
          input.setSelectionRange(0, input.value.length);
          if (!document.execCommand("copy")) throw new Error("Copy command failed");
          input.setSelectionRange(0, 0);
        }
        $("#copy-status").textContent = "Copied!";
      } catch {
        $("#copy-status").textContent = "Copy failed — select the link manually.";
      }
    }

    function setCount(id, next) {
      const previous = rawCount(id);
      next = Math.min(100, Math.max(0, Number(next) || 0));
      const isActiveBerserker = id === berserkerVariantForClass()?.id;
      if (isActiveBerserker && previous !== next) {
        const previousMaximum = berserkerMaximumStacks(previous);
        const nextMaximum = berserkerMaximumStacks(next);
        const stackRatio = previousMaximum > 0 ? clampBerserkerStacks(previous) / previousMaximum : 1;
        buildOptions.berserkerSoulStacks = nextMaximum > 0 ? Math.round(stackRatio * nextMaximum) : 0;
        saveBuildOptions();
      }
      if (next > 0) counts[id] = next;
      else delete counts[id];
      saveCounts();
      render();
    }

    function renderPicked() {
      const selected = U.filter(u => count(u.id));
      const total = selected.reduce((sum, u) => sum + count(u.id), 0);
      $("#picked-summary").textContent = `${total} upgrade${total === 1 ? "" : "s"} · ${selected.length} unique`;
      $("#picked-list").innerHTML = selected.length ? selected.map(u => `
        <div class="picked-item ${u.rarity.toLowerCase()}" title="${escapeHtml(u.effect)}">
          <img src="pictures/${encodeURIComponent(u.icon).replaceAll("%2F", "/")}" alt="">
          <span class="picked-name">${escapeHtml(u.name)}</span>
          <span class="picked-stepper">
            <button type="button" data-action="minus" data-id="${u.id}" aria-label="Remove one ${escapeHtml(u.name)}">−</button>
            <span>${count(u.id)}</span>
            <button type="button" data-action="plus" data-id="${u.id}" aria-label="Add one ${escapeHtml(u.name)}">+</button>
          </span>
        </div>`).join("") : '<span class="empty">No upgrades picked yet.</span>';
    }

    function filteredUpgrades() {
      const query = $("#search").value.trim().toLowerCase();
      const family = $("#family-filter").value;
      const rarity = $("#rarity-filter").value;
      return U.filter(u =>
        isUpgradeAvailable(u) &&
        (!family || u.family === family) &&
        (!rarity || u.rarity === rarity) &&
        (!query || `${u.name} ${u.family} ${u.rarity} ${u.effect}`.toLowerCase().includes(query))
      );
    }

    function renderCatalog() {
      const list = filteredUpgrades().sort((a, b) => {
        const availabilityOrder = Number(isUpgradeConditionallyAvailable(b)) - Number(isUpgradeConditionallyAvailable(a));
        if (availabilityOrder) return availabilityOrder;
        if (!isUpgradeConditionallyAvailable(a)) return a.globalId - b.globalId;
        const familyOrder = family => family === "Mobility Crystal" ? 0 : family === "Endurance Crystal" ? 1 : 2;
        return familyOrder(a.family) - familyOrder(b.family) || a.globalId - b.globalId;
      });
      const availableTotal = U.filter(isUpgradeAvailable).length;
      $("#result-summary").textContent = `${list.length} of ${availableTotal}`;
      $("#catalog").innerHTML = list.length ? list.map(u => `
        <article class="upgrade ${u.rarity.toLowerCase()} ${count(u.id) ? "selected" : ""} ${isUpgradeConditionallyAvailable(u) ? "" : "conditional-unavailable"}"
          data-id="${u.id}" title="Left-click to add · Right-click to remove">
          ${count(u.id) ? `<span class="count">×${count(u.id)}</span>` : ""}
          <img src="pictures/${encodeURIComponent(u.icon).replaceAll("%2F", "/")}" alt="">
          <div class="upgrade-copy">
            <h3 class="upgrade-name">${escapeHtml(u.name)}</h3>
            <div class="meta">${escapeHtml(u.rarity)} · ${escapeHtml(u.family)}</div>
            ${conditionalAvailabilityReason(u) ? `<div class="conditional-note">${escapeHtml(conditionalAvailabilityReason(u))}</div>` : ""}
            <p class="effect">${escapeHtml(u.effect)}</p>
          </div>
        </article>`).join("") : '<div class="no-results">No upgrades match these filters.</div>';
    }

    let dpsRankingRun = 0;
    let dpsRankingVisible = false;
    let dpsRankingFrame = null;
    let dpsRankingSnapshot = null;
    let dpsRankingBuildOptionsSnapshot = null;

    function restoreCounts(snapshot) {
      Object.keys(counts).forEach(id => delete counts[id]);
      Object.assign(counts, snapshot);
    }

    function restoreRankingBuildOptions(snapshot) {
      if (!snapshot) return;
      buildOptions.berserkerSoulStacks = snapshot.berserkerSoulStacks;
    }

    function renderDpsRanking() {
      const listElement = $("#dps-ranking-list");
      const toggleElement = $("#dps-ranking-toggle");
      const rankingSection = listElement?.closest(".dps-ranking");
      if (!listElement || !toggleElement) return;
      if (dpsRankingFrame !== null) {
        cancelAnimationFrame(dpsRankingFrame);
        dpsRankingFrame = null;
      }
      const run = ++dpsRankingRun;
      if (rankingSection) rankingSection.hidden = !dpsRankingVisible;
      listElement.hidden = !dpsRankingVisible;
      toggleElement.textContent = dpsRankingVisible ? "Hide sorted by DPS" : "Show sorted by DPS";
      toggleElement.setAttribute("aria-expanded", String(dpsRankingVisible));

      if (!dpsRankingVisible) {
        if (dpsRankingSnapshot) {
          restoreCounts(dpsRankingSnapshot);
          restoreRankingBuildOptions(dpsRankingBuildOptionsSnapshot);
          latestCalculation = calculateStats();
          dpsRankingSnapshot = null;
          dpsRankingBuildOptionsSnapshot = null;
        }
        listElement.innerHTML = "";
        return;
      }

      if (!["Twinmage", "Gunmancer", "Thaumaturge"].includes(selectedClass)) {
        dpsRankingSnapshot = null;
        listElement.innerHTML = '<div class="dps-ranking-empty">DPS ranking is currently available for Twinmage, Gunmancer, and Thaumaturge.</div>';
        return;
      }

      const snapshot = { ...counts };
      const buildOptionsSnapshot = { berserkerSoulStacks: buildOptions.berserkerSoulStacks };
      dpsRankingSnapshot = snapshot;
      dpsRankingBuildOptionsSnapshot = buildOptionsSnapshot;
      const results = [];
      const candidates = U.filter(upgrade => isUpgradeAvailable(upgrade) && isUpgradeConditionallyAvailable(upgrade)).filter(upgrade => count(upgrade.id) < 100);
      listElement.innerHTML = `<div class="dps-ranking-loading"><span class="dps-ranking-spinner" aria-hidden="true"></span><span class="dps-ranking-progress">Calculating 0 / ${candidates.length}…</span></div>`;
      const progressElement = listElement.querySelector(".dps-ranking-progress");
      latestCalculation = calculateStats();
      const baseDps = renderCalculations({ render: false })?.combinedTotalDps || 0;
      let index = 0;

      const processChunk = () => {
        dpsRankingFrame = null;
        if (run !== dpsRankingRun || !dpsRankingVisible) {
          restoreCounts(snapshot);
          restoreRankingBuildOptions(buildOptionsSnapshot);
          latestCalculation = calculateStats();
          return;
        }
        const chunkEnd = Math.min(index + 10, candidates.length);
        for (; index < chunkEnd; index += 1) {
          const upgrade = candidates[index];
          counts[upgrade.id] = (snapshot[upgrade.id] || 0) + 1;
          if (upgrade.id === berserkerVariantForClass()?.id) {
            const previousMaximum = berserkerMaximumStacks(snapshot[upgrade.id] || 0);
            const nextMaximum = berserkerMaximumStacks(counts[upgrade.id]);
            const stackRatio = previousMaximum > 0 ? Math.min(previousMaximum, Math.max(0, Number(buildOptionsSnapshot.berserkerSoulStacks) || 0)) / previousMaximum : 1;
            buildOptions.berserkerSoulStacks = Math.round(stackRatio * nextMaximum);
          }
          latestCalculation = calculateStats();
          const candidateDps = renderCalculations({ render: false })?.combinedTotalDps || 0;
          results.push({ upgrade, delta: candidateDps - baseDps });
          restoreCounts(snapshot);
          restoreRankingBuildOptions(buildOptionsSnapshot);
        }
        if (progressElement) progressElement.textContent = `Calculating ${index} / ${candidates.length}…`;
        if (index < candidates.length) {
          dpsRankingFrame = requestAnimationFrame(processChunk);
          return;
        }

        restoreCounts(snapshot);
        restoreRankingBuildOptions(buildOptionsSnapshot);
        latestCalculation = calculateStats();
        if (run !== dpsRankingRun || !dpsRankingVisible) return;
        results.sort((a, b) => b.delta - a.delta || a.upgrade.name.localeCompare(b.upgrade.name));
        listElement.innerHTML = results.length ? results.map((result, resultIndex) => {
          const sign = result.delta >= 0 ? "+" : "";
          const state = result.delta < 0 ? " negative" : "";
          return `<button class="dps-ranking-item${state}" type="button" data-dps-upgrade-id="${escapeHtml(result.upgrade.id)}" title="Add one stack of ${escapeHtml(result.upgrade.name)}">
            <span class="dps-ranking-rank">${resultIndex + 1}</span>
            <img src="pictures/${encodeURIComponent(result.upgrade.icon).replaceAll("%2F", "/")}" alt="">
            <span class="dps-ranking-name">${escapeHtml(result.upgrade.name)}</span>
            <span class="dps-ranking-increase">${sign}${Number(result.delta).toFixed(2)} DPS</span>
          </button>`;
        }).join("") : '<div class="dps-ranking-empty">No upgrades are available for another stack.</div>';
      };

      dpsRankingFrame = requestAnimationFrame(processChunk);
    }

    function renderArtifacts() {
      const total = Object.values(buildOptions.artifacts).reduce((sum, value) => sum + value, 0);
      const unique = Object.keys(buildOptions.artifacts).length;
      $("#artifact-summary").textContent = `${total} artifact${total === 1 ? "" : "s"} · ${unique} unique`;
      $("#artifact-catalog").innerHTML = ARTIFACTS.map(item => `
        <article class="upgrade artifact-card ${buildOptions.artifacts[item.id] ? "selected" : ""}" data-id="${item.id}" title="Left-click to add · Right-click to remove">
          ${buildOptions.artifacts[item.id] ? `<span class="count">×${buildOptions.artifacts[item.id]}</span>` : ""}
          <div class="item-placeholder"><img class="item-art" src="pictures/${encodeURIComponent(item.image)}" alt="${escapeHtml(item.name)}"></div>
          <div class="upgrade-copy"><h3 class="upgrade-name">${escapeHtml(item.name)}</h3>
            <div class="meta">Party artifact</div><p class="effect">${escapeHtml(item.effect)}</p></div>
        </article>`).join("");
    }

    function gunmancerAbility(id, group) {
      return GUNMANCER_ABILITIES[group].find(ability => ability.id === id) || GUNMANCER_ABILITIES[group][0];
    }

    function gunmancerAbilitySummary(ability) {
      const damage = ability.components.map(component => `${component.damage} ${component.element}`).join(" + ");
      const interval = ability.interval == null ? "X s" : `${ability.interval} s`;
      return `${damage} damage per activation · ${interval} interval`;
    }

    function gunmancerDpsGroup() {
      return buildOptions.gunmancerSecondaryDamage === true && buildOptions.gunmancerPrimaryDamage !== true ? "secondary" : "primary";
    }

    function gunmancerAbilityOption(ability, group, selected) {
      return `<label class="ability-option">
        <input type="radio" name="gunmancer-${group}" value="${escapeHtml(ability.id)}" ${ability.id === selected ? "checked" : ""}>
        <img class="ability-icon" src="${escapeHtml(ability.iconUrl)}" alt="" onerror="this.onerror=null;this.src='pictures/Class3.png';">
        <span class="ability-copy"><span class="ability-name">${escapeHtml(ability.name)}</span><span class="ability-effect">${escapeHtml(gunmancerAbilitySummary(ability))}<br>${escapeHtml(ability.description)}</span></span>
      </label>`;
    }

    function renderGunmancerConfiguration(content) {
      const primary = gunmancerAbility(buildOptions.gunmancerPrimary, "primary");
      const secondary = gunmancerAbility(buildOptions.gunmancerSecondary, "secondary");
      content.innerHTML = `<div class="gunmancer-configuration">
        <p class="gunmancer-configuration-note"><strong>Gunmancer calculation setup.</strong> Choose one Primary and one Secondary skill. Values marked <span class="gunmancer-unknown">X / ?</span> are preserved from the English wiki and prevent a fabricated DPS result. Ability icons are loaded from the English wiki file names with a local class-icon fallback.</p>
        <fieldset class="gunmancer-dps-picker">
          <legend>Ability used for DPS calculation</legend>
          <div class="gunmancer-dps-options">
            <label class="gunmancer-dps-option"><input type="checkbox" name="gunmancer-dps" value="primary" ${gunmancerDpsGroup() === "primary" ? "checked" : ""}> Primary — ${escapeHtml(primary.name)}</label>
            <label class="gunmancer-dps-option"><input type="checkbox" name="gunmancer-dps" value="secondary" ${gunmancerDpsGroup() === "secondary" ? "checked" : ""}> Secondary — ${escapeHtml(secondary.name)}</label>
          </div>
          <p class="gunmancer-dps-help">Only one ability can be used for DPS at a time. Selecting one automatically deselects the other.</p>
        </fieldset>
        <fieldset class="ability-picker">
          <legend><span class="ability-picker-heading"><span class="ability-picker-title">Primary skill</span><span class="ability-picker-subtitle">Choose one</span></span></legend>
          <div class="ability-options">${GUNMANCER_ABILITIES.primary.map(ability => gunmancerAbilityOption(ability, "primary", primary.id)).join("")}</div>
        </fieldset>
        <fieldset class="ability-picker">
          <legend><span class="ability-picker-heading"><span class="ability-picker-title">Secondary skill</span><span class="ability-picker-subtitle">Choose one</span></span></legend>
          <div class="ability-options">${GUNMANCER_ABILITIES.secondary.map(ability => gunmancerAbilityOption(ability, "secondary", secondary.id)).join("")}</div>
        </fieldset>
        <fieldset class="ability-picker">
          <legend><span class="ability-picker-heading"><span class="ability-picker-title">Airblast charge</span><span class="ability-picker-subtitle">${GUNMANCER_AIRBLAST.cooldown}s cooldown</span></span></legend>
          <div class="airblast-options">
            <label class="airblast-option"><input type="radio" name="gunmancer-airblast" value="none" ${buildOptions.gunmancerAirblastTarget === "none" ? "checked" : ""}> Off</label>
            <label class="airblast-option"><input type="radio" name="gunmancer-airblast" value="primary" ${buildOptions.gunmancerAirblastTarget === "primary" ? "checked" : ""}> Charge Primary</label>
            <label class="airblast-option"><input type="radio" name="gunmancer-airblast" value="secondary" ${buildOptions.gunmancerAirblastTarget === "secondary" ? "checked" : ""}> Charge Secondary</label>
          </div>
          <p class="gunmancer-source-note">The selected target is modeled as one additional 100% damage instance every Airblast cooldown. Gunmancer: Mastery increases the charged-shot multiplier by 50% per stack. This is a calculator interpretation of the English-wiki wording.</p>
        </fieldset>
        <p class="gunmancer-source-note">Sources: <a href="${GUNMANCER_WIKI_URL}" target="_blank" rel="noreferrer">English Ecliptica Wiki</a> and <a href="https://wikiwiki.jp/ecliptica/%E3%82%AC%E3%83%B3%E3%83%9E%E3%83%B3%E3%82%B5%E3%83%BC" target="_blank" rel="noreferrer">Japanese Ecliptica Wiki</a>. The Japanese page gives 0.5/s for both primaries, but separate secondary rates: Firebomb 0.33/s, Photon Condenser 4/s, and Antimatter Accelerator 0.5/s. Attack Speed is applied to selected skills as a working model.</p>
      </div>`;
    }

    function renderThaumaturgeConfiguration(content) {
      const splitshotStacks = count("Thaumaturge_Splitshot");
      const projectileCount = 1 + splitshotStacks;
      content.innerHTML = `<div class="gunmancer-configuration">
        <div class="ability-options">
          <div class="ability-option"><img class="ability-icon" src="pictures/Thaumaturge-Life-Energy-a.png" alt=""><span class="ability-copy"><span class="ability-name">Life Energy</span><span class="ability-effect">Passive</span></span></div>
          <div class="ability-option"><img class="ability-icon" src="pictures/Thaumaturge-Secondary.png" alt=""><span class="ability-copy"><span class="ability-name">Pain Exchange</span><span class="ability-effect">Secondary</span></span></div>
          <div class="ability-option"><img class="ability-icon" src="pictures/Thaumaturge-Utility.png" alt=""><span class="ability-copy"><span class="ability-name">Soulborne</span><span class="ability-effect">Utility</span></span></div>
        </div>
        <fieldset class="ability-picker">
          <legend><span class="ability-picker-heading"><span class="ability-picker-title">Primary skill</span><span class="ability-picker-subtitle">Foul Pustule</span></span></legend>
          <div class="ability-options"><div class="ability-option">
            <img class="ability-icon" src="${escapeHtml(THAUMATURGE_PRIMARY.iconUrl)}" alt="">
            <span class="ability-copy"><span class="ability-name">${escapeHtml(THAUMATURGE_PRIMARY.name)}</span><span class="ability-effect">30 Poison damage · 0.75 attacks/s · 10% Poisoned chance<br>26 m/s projectile speed · 50 m range</span></span>
          </div></div>
        </fieldset>
        ${splitshotStacks > 0 ? `<p class="gunmancer-source-note"><strong>Splitshot:</strong> ${projectileCount} projectiles per shot (${splitshotStacks} stack${splitshotStacks === 1 ? "" : "s"}). Its -30% Damage per stack is already represented by Overall Damage; the Japanese wiki says that penalty is additive and has an unspecified lower bound.</p>` : ""}
      </div>`;
    }

    function berserkerStackControlMarkup() {
      const variant = berserkerVariantForClass();
      const upgradeCount = berserkerUpgradeCount();
      if (!variant || upgradeCount <= 0) return "";
      const maximum = berserkerMaximumStacks(upgradeCount);
      const stacks = clampBerserkerStacks(upgradeCount);
      const upgradeName = upgradeIndex.get(variant.id)?.name || "Berserker's Soul";
      return `<fieldset class="berserker-stack-control">
        <legend>${escapeHtml(upgradeName)} stacks</legend>
        <div class="berserker-stack-inputs">
          <input type="range" name="berserker-soul-stacks" min="0" max="${maximum}" step="1" value="${stacks}" aria-label="${escapeHtml(upgradeName)} stacks">
          <input type="number" name="berserker-soul-stacks" min="0" max="${maximum}" step="1" value="${stacks}" aria-label="${escapeHtml(upgradeName)} stack count">
        </div>
        <span class="berserker-stack-summary">${stacks} / ${maximum}</span>
      </fieldset>`;
    }

    function appendBerserkerStackControl(content) {
      const markup = berserkerStackControlMarkup();
      if (!markup) return;
      content.classList.add("configuration-stack");
      content.insertAdjacentHTML("beforeend", markup);
    }

    function renderConfiguration() {
      const content = $("#configuration-content");
      content.classList.remove("configuration-stack");
      if (selectedClass === "Gunmancer") {
        renderGunmancerConfiguration(content);
        appendBerserkerStackControl(content);
        return;
      }
      if (selectedClass === "Thaumaturge") {
        renderThaumaturgeConfiguration(content);
        appendBerserkerStackControl(content);
        return;
      }
      if (selectedClass !== "Twinmage") {
        const stackControl = berserkerStackControlMarkup();
        content.innerHTML = stackControl || '<div class="configuration-empty">No configuration options are available for this class yet.</div>';
        if (stackControl) content.classList.add("configuration-stack");
        return;
      }
      const picker = (hand, label, selected, useForDamage) => `
        <fieldset class="element-picker">
          <legend><span class="element-picker-heading">
            <span class="element-picker-title">${label}</span>
            <label class="damage-calculation-toggle">
              <input type="checkbox" name="twinmage-${hand}-damage" ${useForDamage ? "checked" : ""}>
              <span>Use for damage calculations</span>
            </label>
          </span></legend>
          <div class="element-options">
            ${TWINMAGE_ELEMENTS.map(element => `
              <label class="element-option">
                <input type="radio" name="twinmage-${hand}" value="${element.id}" ${element.id === selected ? "checked" : ""}>
                <img class="element-icon" src="pictures/${encodeURIComponent(element.image)}" alt="">
                <span class="element-name">${element.name}</span>
              </label>`).join("")}
          </div>
        </fieldset>`;
      content.innerHTML = `<div class="twinmage-configuration">
        ${picker("primary", "Primary element", buildOptions.twinmagePrimary, buildOptions.twinmagePrimaryDamage)}
        ${picker("secondary", "Secondary element", buildOptions.twinmageSecondary, buildOptions.twinmageSecondaryDamage)}
      </div>`;
      appendBerserkerStackControl(content);
    }

    function effectiveSourceStatusChance(statusId, baseChance, attackSpeedMultiplier) {
      if (!Number.isFinite(baseChance) || attackSpeedMultiplier <= 0) return null;
      const bonus = STATUS_CHANCE_BONUSES[statusId];
      return (baseChance + (bonus ? count(bonus.upgradeId) * bonus.chancePerStack : 0)) / attackSpeedMultiplier;
    }

    function calculationElementMultipliers(stats) {
      return Object.fromEntries(["physical", "fire", "frost", "electric", "luminous", "shadow", "poison"]
        .map(element => [element, Number(stats[`${element}Damage`] || 0) / 100]));
    }

    function abilityDamageSourceSpecs(classKey, ability, group, attackSpeedMultiplier) {
      const activationRate = ability.interval > 0 ? attackSpeedMultiplier / ability.interval : 0;
      return ability.components.map((component, index) => {
        const projectiles = Math.max(1, Number(typeof component.projectiles === "function" ? component.projectiles() : component.projectiles) || 1);
        const statusChance = index === 0 && ability.status
          ? effectiveSourceStatusChance(ability.status.id, ability.status.chance, attackSpeedMultiplier)
          : null;
        return {
          id: `${classKey}-${ability.id}-${component.id || index}`,
          name: ability.components.length === 1 ? ability.name : component.name,
          position: group,
          sourceIcon: ability.iconUrl,
          element: component.element,
          baseDamage: component.damage,
          canCrit: component.canCrit !== false,
          activationRate,
          instancesPerActivation: projectiles,
          projectiles,
          statuses: statusChance == null ? [] : [{ id: ability.status.id, name: ability.status.name, chance: statusChance }]
        };
      });
    }

    function sharedUpgradeSourceSpecs(classKey, primaryActivationRate, attackSpeedMultiplier) {
      const sources = [];
      const flamingSpiritStacks = count("Flaming_Spirit");
      if (flamingSpiritStacks > 0 && primaryActivationRate > 0) {
        const burningChance = effectiveSourceStatusChance("burning", .10, attackSpeedMultiplier);
        sources.push({
          id: `${classKey}-flaming-spirit`, name: "Flaming Spirit", position: "Upgrade effect",
          sourceIcon: "Flaming_Spirit.png", sourceUpgradeId: "Flaming_Spirit",
          element: "fire", baseDamage: 16 + 16 * Math.max(0, flamingSpiritStacks - 1), canCrit: true,
          activationRate: primaryActivationRate, instancesPerActivation: 1, projectiles: 1,
          overallDamageApplies: false, statuses: burningChance == null ? [] : [{ id: "burning", name: "Burning", chance: burningChance }],
          trigger: { type: "primaryActivation" }
        });
      }
      const chargedStrikeStacks = count("Charged_Strike");
      if (chargedStrikeStacks > 0) sources.push({
        id: `${classKey}-charged-strike`, name: "Charged Strike", position: "Upgrade effect",
        sourceIcon: "Charged_Strike.png", sourceUpgradeId: "Charged_Strike",
        element: "physical", baseDamage: 25 + 10 * Math.max(0, chargedStrikeStacks - 1), canCrit: false,
        trigger: { type: "onCrit", instancesPerTrigger: 1 }, sourceMultiplierStrategy: "weightedCritSources", statuses: []
      });
      return sources;
    }

    function buildGunmancerSourceModel(stats) {
      const attackSpeedMultiplier = Number(stats.attackSpeed || 0) / 100;
      const group = gunmancerDpsGroup();
